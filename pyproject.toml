[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "splat-explorer"
version = "0.1.0"
description = "VLM agent harness for exploring 3D Gaussian splats and finding rendering artifacts"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "pillow>=10.0",
    "pyyaml>=6.0",
    "scipy>=1.11",
]

[project.optional-dependencies]
# Debug viewer (browser-based, no GPU needed)
viewer = ["viser>=0.2.7"]
# Real 3DGS rasterization. Requires an NVIDIA GPU + CUDA toolchain.
# torch must be installed first (gsplat compiles CUDA kernels against it).
gpu = ["torch>=2.1", "gsplat>=1.4"]
# Differentiable 3DGS refine on Apple Silicon (Metal via MLX). No CUDA.
apple = [
    "mlx>=0.31.0",
    "gsplat-mlx @ git+https://github.com/RobotFlow-Labs/gsplat-mlx.git@9e53709a94e9c56fb66db2708d7d728832176713",
]
# VLM API access (openai client is also used for the CliRelay backend)
vlm = ["openai>=1.40"]
# Self-hosted Qwen-Image-Edit-2511 (RGB repair backup). Needs CUDA torch from [gpu].
# GPU setup installs this only when QWEN_required is true. Scene-runs default to
# CliRelay gpt-image-2.5 and do not need these packages.
# Diffusers >=0.36 ships QwenImageEditPlusPipeline (the 2511 model-card class).
image-edit = [
    "diffusers>=0.36.0",
    "transformers>=4.51.3",
    "accelerate>=1.2.0",
    "safetensors>=0.4.5",
]

[project.scripts]
splat-explorer = "splat_explorer.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"splat_explorer.web" = ["static/*"]
