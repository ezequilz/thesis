# Override: drive the agent with Gemini through a browser session.
# Usage: splat-explorer --config configs/gemini_web.yaml explore
#
# Requires pip install ".[gemini-web]" and a logged-in gemini.google.com
# session — either auto_cookies on the host, or a cookie export file.

agent:
  vlm_backend: gemini_web
  # Option A (host only): read cookies from a specific Chrome profile
  # directory (see chrome://version -> Profile Path for the name).
  chrome_profile: "Profile 1"
  # Option B (host only): pull cookies from the DEFAULT browser profile.
  # auto_cookies: true
  # Option C (works in Docker): export cookies to a file and point here.
  # cookie_file: secrets/gemini_cookies.json
  # Keep test episodes short while the web session is rate-limit sensitive.
  max_steps: 15
