container: /dss/dssmcmlfs01/pn25pi/pn25pi-dss-0000/go73kaf2/splat-explorer/containers/pytorch.sqsh
cpus: 4
mem: 32G
# Pyxis name reused for the rest of this allocation (persists compiled gsplat).
