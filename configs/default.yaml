# Default configuration for the splat-explorer harness.
# Any value can be overridden with a second yaml passed via --config.

scene:
  # Path to the Gaussian splat asset. Supported: SOG v2 .sog bundles
  # (compressed/quantized — compact, default) and standard 3DGS .ply exports
  # (uncompressed full precision; big files, keep them out of git).
  path: 3dgs_rooms/ArchInteriors_for_UE2_Atlux.sog
  # Drop gaussians with opacity below this when building the working set (0 disables).
  min_opacity: 0.05

renderer:
  # "viser"      — capture RGB from the dashboard visor iframe, sized to the
  #                selected VLM resolution (default 960x720). Keep the dashboard
  #                tab visible during episodes; Chrome throttles hidden tabs.
  #                /spectator is HD viewing only and is not used for captures.
  # "cpu_splats" — CPU EWA rasterizer with visor-style back-to-front layers.
  # "gsplat"     — reference 3DGS rasterization, requires NVIDIA GPU + [gpu] extra.
  # "cpu_points" — legacy dot-based debug renderer (speckled; not for VLM runs).
  backend: viser
  # Empty: VISER_RENDER_URL env, then http://localhost:8081.
  viser_url: ""
  width: 960
  height: 720
  fov_deg: 75.0
  # cpu_splats only: cap on a single splat's screen-space radius in pixels
  # (bounds worst-case render time). Too low turns room-sized low-opacity
  # "fog" gaussians into visible blobs; 120 renders them faithfully as haze.
  max_splat_radius_px: 120
  # cpu_points only: screen-space radius of each projected point in pixels.
  point_radius_px: 1

camera:
  # World up axis of the scene: one of +x,-x,+y,-y,+z,-z.
  # The SOG spec defines y-up, but this asset (like most COLMAP-trained 3DGS
  # scenes) is y-down — verified via render-test.
  up_axis: "-y"
  # Starting pose. "auto" runs the spawn-point search (navigation section
  # below) and lets the VLM pick a start from a bird's-eye view; an explicit
  # [x, y, z] skips that phase and spawns there directly.
  start_position: auto
  start_yaw_deg: 0.0
  # Eye height offset (in scene units) applied along up when start_position is auto.
  eye_height: 0.0

# Scene-aware navigation: spawn-point search, bird's-eye start selection, and
# collision handling for agent movement (see splat_explorer/navigation.py).
navigation:
  # Percentage of gaussians removed from the top (by centroid height along the
  # up axis) to cut the ceiling away for the bird's-eye view and spawn search.
  ceiling_percentile: 25
  # Number of candidate start positions offered to the VLM.
  num_spawn_points: 5
  # Cell size (scene units) of the 2D occupancy grid used by the spawn search.
  grid_cell: 0.15
  # Gaussians below this opacity are ignored for occupancy/collision (haze).
  # Keep this LOW: semi-transparent geometry like sheer curtains sits around
  # 0.1-0.3 opacity and must still count as an obstacle (splat extents are
  # accounted for, so sparse large curtain gaussians block properly).
  solid_opacity: 0.1
  # Minimum distance (scene units) the camera keeps from solid splat centers;
  # all movement is clamped so clearance never drops below this.
  clearance_radius: 0.25
  # Spawn eye height as a fraction of the interior height (floor -> ceiling cut).
  spawn_height_fraction: 0.5
  # Pull of spawn candidates toward the scene's center of mass: score =
  # clearance - centroid_pull * distance_to_center. Higher = more central spots.
  centroid_pull: 0.35

agent:
  # "scripted"  — canned action sequence, no API needed (for testing the loop).
  # "cli_relay" — Gemini/Claude/OpenAI via a self-hosted CliRelay proxy
  #               (pip install ".[vlm]", see configs/cli_relay.yaml).
  # "openai"    — any OpenAI-compatible chat completions endpoint with vision + tools.
  vlm_backend: scripted
  # Default model for live backends. Must be a vision-capable ID the CliRelay
  # instance routes (GET /v1/models) when vlm_backend is cli_relay.
  model: gpt-5.6-luna
  # openai backend only: base URL for OpenAI-compatible APIs (vLLM, OpenRouter,
  # Ollama, ...). Leave empty for api.openai.com. Key from OPENAI_API_KEY env.
  base_url: ""
  # cli_relay only. Endpoint of the CliRelay instance (OpenAI-compatible /v1).
  # Leave empty: falls back to the CLIRELAY_BASE_URL env var (set in
  # docker-compose to reach the host-local relay via host.docker.internal),
  # then to http://localhost:8317/v1. A value here would override both.
  relay_base_url: ""
  # cli_relay only. API key created in the CliRelay panel; prefer setting the
  # CLIRELAY_API_KEY env var instead of putting the key in a config file.
  relay_api_key: ""
  max_steps: 40
  # Task prompt variant: v3 = short inspector, no done (artifact_hunt_3.py),
  # v2 = precision-first, v1 = original. Add more names in tasks/registry.py.
  prompt: v3
  # Force-attach the depth map to every VLM prompt. Depth is always rendered,
  # saved per step, and used for move_toward regardless. When false (default)
  # the model can still call view_depth to see it on the next observation.
  send_depth: false
  # Hard limits the harness enforces on tool call parameters.
  max_move_distance: 2.0
  max_rotate_degrees: 90.0

viewer:
  host: 0.0.0.0
  port: 8080
  # HTTP capture API the harness posts cameras to (WebGL get_render).
  render_port: 8081
  # Max splats served to the browser; 0 = no limit (full scene). Lower this if
  # the viewer tab becomes unresponsive on weaker machines.
  max_splats: 0

# Episode control/debug dashboard (splat-explorer dashboard): start & watch
# runs from the browser — frames, raw VLM replies, parsed actions, timings.
# 0.0.0.0 so the port mapping works when served from the Docker container.
dashboard:
  host: 0.0.0.0
  port: 8090

output:
  dir: outputs
