# Use: python -m splat_explorer.splatfix.cli --config configs/splatfix.yaml select
# Credentials come from .env / CLIRELAY_API_KEY; do not put secrets here.
agent:
  vlm_backend: cli_relay

splatfix:
  # Default 1280x720; both dimensions are divisible by 16.
  # Render directly at this size; existing images use calibrated scale/crop.
  # Set training explicitly for the smaller 832x480 profile.
  # early_original: v0, original 960x720 captures and uncapped source inputs.
  resolution_profile: 720p
  oraclegs_runtime:
    seva_fit: crop  # pad is the explicit fallback
    auto_setup: true
    seva_resolution: 576p
    oracle_adapter: trajectory
    oracle_target_frames: 240  # per consecutive viewpoint pair, including endpoints
    iterations: 22000
    cap_max: 1800000
    # Isolated environments; see docs/oraclegs.md for setup and protocol.
    repo: /workspace/third_party/OracleGS
    python: /workspace/oraclegs-env/bin/python
    model_python: /workspace/oraclegs-model-env/bin/python
  g4splat_runtime:
    auto_setup: true
    source_depth: false  # Opt-in source-splat depth extension; changes the method.
    repo: /workspace/third_party/G4Splat
    python: /workspace/g4splat-env/bin/python
  runtime:
    artifixer_pipeline: authors_3dgut  # legacy_gsplat restores the previous renderer and reconstruction controls
    prompt_source: worldexplorer
    reconstruction_initialization: point_cloud  # authors path always uses a fresh fit
    initial_image_seeding: true  # Seed each series, including both endpoint directions
    image_cache_insertion: false  # Optional exact latent/cache preservation
    repo: /workspace/third_party/ArtiFixer
    python: /workspace/artifixer-venv/bin/python
    checkpoint: /workspace/models/artifixer/artifixer-1.3b.pt
    model_id: Wan-AI/Wan2.1-T2V-1.3B-Diffusers
    hf_home: /workspace/models/huggingface
