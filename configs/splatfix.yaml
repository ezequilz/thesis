# Use: python -m splat_explorer.splatfix.cli --config configs/splatfix.yaml select
# Credentials come from .env / CLIRELAY_API_KEY; do not put secrets here.
agent:
  vlm_backend: cli_relay

splatfix:
  # Typical released DL3DV training preprocessing: 960x540 -> 960x544.
  # Set 720p explicitly for 1280x720 novel camera renders.
  # early_original: v0, original 960x720 captures and uncapped source inputs.
  resolution_profile: training
  runtime:
    repo: /workspace/third_party/ArtiFixer
    python: /workspace/artifixer-venv/bin/python
    checkpoint: /workspace/models/artifixer/artifixer-1.3b.pt
    model_id: Wan-AI/Wan2.1-T2V-1.3B-Diffusers
    hf_home: /workspace/models/huggingface
