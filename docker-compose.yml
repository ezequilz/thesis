x-base: &base
  build: .
  image: splat-explorer:latest
  volumes:
    - ./3dgs_rooms:/app/3dgs_rooms:ro
    - ./outputs:/app/outputs
    - ./configs:/app/configs:ro

services:
  # One-off: sanity-render a panorama from the scene center into outputs/test_views/.
  render-test:
    <<: *base
    profiles: ["tools"]
    command: ["render-test"]

  # Interactive splat viewer for debugging (browser at http://localhost:8080).
  viewer:
    <<: *base
    command: ["viewer"]
    ports:
      - "8080:8080"

  # The agent harness. Default config uses the scripted policy; to go live use
  # a config override (e.g. configs/cli_relay.yaml) + the matching API key env.
  # Note: from inside the container a host-local CliRelay is reachable at
  # http://host.docker.internal:8317/v1, not localhost.
  harness:
    <<: *base
    profiles: ["tools"]
    command: ["explore"]
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - CLIRELAY_API_KEY=${CLIRELAY_API_KEY:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
