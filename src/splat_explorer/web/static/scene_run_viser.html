<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>splat-explorer · scene-run visor</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root {
    --bg: #101318; --panel: #171c24; --border: #2a3342;
    --text: #dce3ee; --dim: #8b97a8; --accent: #5aa2ff;
    --ok: #45c98b; --warn: #e6b450; --err: #ef6a6a;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #000; color: var(--text);
               font: 13px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
               display: flex; flex-direction: column; }
  header { display: flex; align-items: center; gap: 12px; padding: 8px 14px;
           background: var(--panel); border-bottom: 1px solid var(--border);
           flex-shrink: 0; }
  header h1 { font-size: 14px; margin: 0; font-weight: 600; }
  header h1 span { color: var(--dim); font-weight: 400; }
  .hint { color: var(--dim); font-size: 12px; }
  .hint.err { color: var(--err); }
  a { color: var(--accent); text-decoration: none; }
  .spacer { flex: 1; }
  header button {
    border: 0; border-radius: 6px; padding: 6px 12px; cursor: pointer;
    background: var(--accent); color: #091525; font-weight: 650;
  }
  #view-nav {display:flex;align-items:center;gap:5px;font-size:11px;color:var(--dim)}
  #view-nav button {padding:2px 7px;font-size:14px;background:transparent;color:var(--text);border:1px solid var(--border)}
  #view-nav[hidden] {display:none}
  #highlight { background: transparent; color: var(--dim); border: 1px solid var(--border); }
  #highlight[aria-pressed="true"] { background: #302527; color: #d9a5a5; border-color: #705053; }
  header { flex-wrap: wrap; }
  header button:disabled { opacity: .45; cursor: default; }
  #stage { flex: 1; min-height: 0; width: 100%; background: #000; position: relative; }
  #stage iframe { width: 100%; height: 100%; border: 0; display: block; }
  #overlay {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    background: #000c; color: var(--dim); font-size: 14px; text-align: center; padding: 24px;
  }
  #overlay.hidden { display: none; }
</style>
</head>
<body>
<header>
  <h1>splat-explorer <span id="title">· visor</span></h1>
  <span id="hint" class="hint">Loading repaired splat…</span>
  <span class="spacer"></span>
  <span id="view-nav" hidden><button id="view-prev" aria-label="Previous saved view" disabled>‹</button><span id="view-index"></span><button id="view-next" aria-label="Next saved view" disabled>›</button></span>
  <a href="/scene-runs">scene runs</a>
  <button id="highlight" type="button" aria-pressed="false" disabled
    title="Approximate difference from the nearest original Gaussian. Stronger red means a larger change; opacity is preserved. Deleted splats are not shown.">Highlight repair</button>
  <button id="flip" type="button" disabled>Show original</button>
</header>
<div id="stage">
  <iframe id="frame" title="Scene-run visor" allow="autoplay"></iframe>
  <div id="overlay">Loading repaired splat…</div>
</div>
<script>
"use strict";
const resultReview = location.pathname === "/splatfix/results/viser";
const resultId = new URLSearchParams(location.search).get("id");
const runId = resultReview ? resultId : decodeURIComponent(location.pathname.replace(/^\/+|\/viser\/?$/g, ""));
const client = (crypto.randomUUID && crypto.randomUUID()) || String(Date.now());
const $ = id => document.getElementById(id);
const title = $("title"), hint = $("hint"), flip = $("flip");
const highlight = $("highlight");
const frame = $("frame"), overlay = $("overlay");
const api = resultReview ? `/api/splatfix/results/viser?id=${encodeURIComponent(runId)}` : `/api/scene-runs/${encodeURIComponent(runId)}/viser`;
if(resultReview){highlight.hidden=true;document.querySelector("header a").href="/splatfix/results";document.querySelector("header a").textContent="Results";document.querySelector("h1").firstChild.textContent="Review ";}
let state = null, pending = false, timer = null, started = false, closed = false, revision = 0;

function plyLabel(which) {
  return which === "original" ? "scene_original.ply" : "scene_repaired.ply";
}
function setOverlay(text, isError) {
  overlay.textContent = text || "";
  overlay.classList.toggle("hidden", !text);
  hint.classList.toggle("err", Boolean(isError));
  hint.textContent = text || "";
}
function render() {
  const which = state?.which || "repaired";
  const status = state?.status || "idle";
  const showing = status === "ready" ? which : (state?.which || "repaired");
  document.title = `splat-explorer · ${runId} visor`;
  title.textContent = `· ${state?.label || runId}`;
  flip.textContent = showing === "original" ? "Show repaired" : "Show original";
  const other = showing === "original" ? "repaired" : "original";
  const otherReady = Boolean(state?.[other]);
  $("view-nav").hidden = !state?.view_count;
  $("view-index").textContent = `View ${(state?.view_index ?? 0)+1} / ${state?.view_count || 0}`;
  $("view-index").title = state?.view_label || "";
  $("view-prev").disabled = $("view-next").disabled = pending || status !== "ready" || state?.view_count < 2;
  highlight.disabled = pending || status !== "ready" || !state?.highlight_available;
  highlight.setAttribute("aria-pressed", String(Boolean(state?.highlight)));
  flip.disabled = pending || status === "loading" || !otherReady;
  flip.title = otherReady
    ? `Swap the full-screen splat to ${plyLabel(other)}`
    : `No ${plyLabel(other)} on disk yet`;
  if (state?.viewer_url && !String(frame.src).startsWith(state.viewer_url)) {
    frame.src = state.viewer_url;
  }
  if (!state?.ok && state?.message) {
    setOverlay(state.message, true);
    return;
  }
  if (status === "error") {
    setOverlay(state.error || state.message || "Visor failed to load.", true);
    return;
  }
  if (status === "ready" && state.viewer_url) {
    setOverlay("");
    hint.classList.remove("err");
    hint.textContent = state?.highlight ? "repair difference · faint → strong red (approximate)" : showing === "original" ? "original splat" : "repaired splat";
    return;
  }
  const loadingWhich = state?.which || "repaired";
  setOverlay(`Loading ${plyLabel(loadingWhich)}…`);
  hint.textContent = `Loading ${plyLabel(loadingWhich)}…`;
}
async function fetchJson(url, options) {
  const response = await fetch(url, options);
  const body = await response.json().catch(() => ({}));
  if (!response.ok && body.ok !== false) {
    throw new Error(body.message || body.error || `HTTP ${response.status}`);
  }
  return body;
}
async function post(body) {
  return fetchJson(api, {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify({client, ...body}),
  });
}
async function refresh(start) {
  const requestRevision = revision;
  if (start) {
    pending = true;
    state = await post({});
    started = Boolean(state?.viewer_url) || state?.status === "loading" || state?.status === "ready";
    pending = false;
  } else if (started) {
    const next = await post({heartbeat: true});
    if (requestRevision !== revision || closed) return;
    state = next;
  } else {
    state = await fetchJson(api);
  }
  if (closed) { stopVisor(); return; }
  render();
}
async function tick() {
  clearTimeout(timer);
  if (closed) return;
  try {
    if (!pending) await refresh(!started);
  } catch (error) {
    state = {ok: false, message: error.message, status: "error"};
    render();
  }
  const wait = !started || state?.status === "loading" ? 1000 : 8000;
  if (!closed) timer = setTimeout(tick, wait);
}
function stopVisor() {
  closed = true;
  clearTimeout(timer);
  const body = JSON.stringify({stop: true, client});
  try {
    if (navigator.sendBeacon(api, new Blob([body], {type: "application/json"}))) return;
  } catch (_err) {}
  fetch(api, {method: "POST", headers: {"Content-Type": "application/json"},
    body, keepalive: true}).catch(() => {});
}
async function changeView(body) {
  clearTimeout(timer);
  revision += 1;
  pending = true;
  render();
  try { state = await post(body); }
  catch (error) { state = {...(state || {}), ok: false, message: error.message, status: "error"}; }
  pending = false;
  if (closed) { stopVisor(); return; }
  render();
  timer = setTimeout(tick, state?.status === "loading" ? 1000 : 8000);
};
$("view-prev").onclick = () => { if(!$("view-prev").disabled) changeView({view_delta:-1}); };
$("view-next").onclick = () => { if(!$("view-next").disabled) changeView({view_delta:1}); };
flip.onclick = () => { if (!flip.disabled) changeView({toggle: true}); };
highlight.onclick = () => { if (!highlight.disabled) changeView({which: "repaired", highlight: !state?.highlight}); };
window.addEventListener("keydown", event => { if(event.code === "Space" && !event.repeat && event.target === document.body){event.preventDefault();flip.click();} });
window.addEventListener("pagehide", stopVisor);
window.addEventListener("pageshow", event => {
  if (event.persisted) { closed = false; started = false; frame.removeAttribute("src"); tick(); }
});
tick();
</script>
</body>
</html>
