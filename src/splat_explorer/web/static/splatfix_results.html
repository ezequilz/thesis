<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reconstruction results</title><style>
:root{color-scheme:dark;font:14px/1.45 system-ui;background:#111416;color:#e4e9ec}*{box-sizing:border-box}body{margin:0}main{max-width:1500px;margin:auto;padding:28px}header,.tools,.facts,.links{display:flex;align-items:center;gap:18px;flex-wrap:wrap}header{border-bottom:1px solid #333c41;padding-bottom:18px}h1{font-size:21px;font-weight:550;margin:0;flex:1}a{color:#b4d8ea;text-decoration:none}a:hover{text-decoration:underline}input,select,button{font:inherit;background:#1c2226;color:inherit;border:1px solid #3a444b;border-radius:5px;padding:8px 11px}input{min-width:260px}button{cursor:pointer}.tools{margin:22px 0}.count,.dim{color:#97a6ae;font-size:12px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(380px,1fr));gap:18px}article{border:1px solid #354048;border-radius:7px;background:#171d21;overflow:hidden}article .body{padding:19px}h2{font-size:17px;font-weight:550;margin:0 0 4px}.run{font:11px ui-monospace,monospace;color:#9baab2;overflow-wrap:anywhere}.preview-link{position:relative;display:block}.preview-label{position:absolute;right:8px;bottom:8px;font-size:10px;background:#101416dd;padding:3px 6px;color:#d3e1e8}.preview{width:100%;height:180px;object-fit:cover;display:block;background:#101416}.facts{gap:9px;margin:14px 0;font-size:12px}.tag{padding:3px 7px;border:1px solid #3c4a53;border-radius:3px}.links{margin-top:16px;font-size:12px;gap:15px}.review{border:1px solid #6894a9;border-radius:4px;padding:6px 10px;color:#d8eef7}.metrics{width:100%;border-collapse:collapse;font-size:12px;font-variant-numeric:tabular-nums;margin-top:15px}.metrics th,.metrics td{padding:6px 0;border-bottom:1px solid #2e383f;text-align:right}.metrics th:first-child,.metrics td:first-child{text-align:left}.metrics th{font-weight:500;color:#a6b6bf}.metrics tr.geometry{color:#bfdfec}details{font-size:12px;margin-top:12px;color:#9baab2}details p{line-height:1.5}.empty{padding:50px;color:#a6b6bf;text-align:center}#error{color:#ffb2a8}label{font-size:12px;color:#a6b6bf}.titleline{display:flex;gap:12px;align-items:center}.titleline h2{flex:1}@media(max-width:500px){main{padding:16px}.grid{grid-template-columns:1fr}input{min-width:0;width:100%}}
</style></head><body><main><header><h1>Reconstruction results</h1><a href="/splatfix">Pipeline</a><a href="/scene-runs">Scene runs</a></header><div class="tools"><input id="search" type="search" aria-label="Search saved results" placeholder="Scene, run or model"><select id="kind" aria-label="Result type"><option value="">All results</option><option>ArtiFixer3D</option><option>Scene repair</option></select><label><input id="scored" type="checkbox" style="min-width:0;width:auto"> Evaluated only</label><span id="count" class="count"></span><button id="refresh">Refresh</button></div><p id="error" role="alert"></p><section id="results" class="grid" aria-live="polite"></section></main><script>
const $=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let rows=[];
const names={baseline:'Original',artifixer:'ArtiFixer images',artifixer3d:'ArtiFixer3D',artifixer3d_plus:'ArtiFixer3D+ images'};
const val=(v,n)=>typeof v==='number'&&Number.isFinite(v)?v.toFixed(n):'—';
function render(){const query=$('search').value.toLowerCase();const shown=rows.filter(r=>(!$('kind').value||r.kind===$('kind').value)&&(!$('scored').checked||Object.keys(r.metrics).length)&&[r.scene,r.run_id,r.model,r.result_name].join(' ').toLowerCase().includes(query));$('count').textContent=`${shown.length} / ${rows.length} runs`;$('results').innerHTML=shown.map(r=>`<article>${r.preview_url?`<a class="preview-link" href="${esc(r.viser_url)}"><img class="preview" loading="lazy" src="${esc(r.preview_url)}" alt="Postprocessed image preview for ${esc(r.scene)}"><span class="preview-label">3D+ image preview</span></a>`:''}<div class="body"><div class="titleline"><h2>${esc(r.scene||r.run_id)}</h2><span class="dim">${esc(r.incomplete?'Interrupted · incomplete':r.status)}</span></div><div class="run">${esc(r.run_id)} · ${esc(r.result_name)}</div><div class="facts"><span class="tag">${esc(r.kind)}</span>${[r.phase,r.mode,r.model,r.trajectory,r.frames?`${r.frames} frames`:null].filter(Boolean).map(x=>`<span class="dim">${esc(x)}</span>`).join('')}</div>${Object.keys(r.metrics).length?`<div class="dim">${esc(r.test_count||'')} test images · LPIPS VGG</div><table class="metrics"><thead><tr><th>Stage</th><th>PSNR ↑</th><th>SSIM ↑</th><th>LPIPS ↓</th></tr></thead><tbody>${Object.entries(r.metrics).map(([stage,m])=>`<tr class="${stage==='artifixer3d'?'geometry':''}"><td>${esc(names[stage]||stage)}</td><td>${val(m.psnr,2)}</td><td>${val(m.ssim,3)}</td><td>${val(m.lpips,3)}</td></tr>`).join('')}</tbody></table>`:'<div class="dim">No evaluation saved</div>'}<div class="links"><a class="review" href="${esc(r.detail_url)}">Run details</a>${r.original||r.repaired?`<a class="review" href="${esc(r.viser_url)}">Review splat ↗</a>`:``}${r.ply_url?`<a href="${esc(r.ply_url)}" download>PLY</a>`:''}${r.diagnostics_url?`<a href="${esc(r.diagnostics_url)}">Run diagnostics</a>`:``}${r.metrics_url?`<a href="${esc(r.metrics_url)}">Metrics JSON</a>`:''}${r.provenance_url?`<a href="${esc(r.provenance_url)}">Run metadata</a>`:''}</div><div class="dim" style="margin-top:9px">${r.inference_ready?'Inference images ready · reconstruction outputs pending':r.original&&r.repaired?'Original ↔ reconstructed · Space to switch':r.original?'Original saved · reconstructed unavailable':r.repaired?'Reconstructed saved · original unavailable':r.message||'Waiting for generated images and reconstruction outputs'}</div>${r.metrics_scope||r.limitation?`<details><summary>Evaluation scope</summary><p>${esc(r.metrics_scope||r.limitation)}</p>${r.metrics_scope&&r.limitation?`<p>${esc(r.limitation)}</p>`:''}</details>`:''}</div></article>`).join('')||'<div class="empty">No matching saved results</div>'}
async function refresh(){try{$('refresh').disabled=true;const response=await fetch('/api/splatfix/results');if(!response.ok)throw Error(`Results unavailable (${response.status})`);rows=(await response.json()).results;$('error').textContent='';render()}catch(e){$('error').textContent=e.message}finally{$('refresh').disabled=false}}
$('search').oninput=render;$('kind').onchange=render;$('scored').onchange=render;$('refresh').onclick=refresh;refresh();setInterval(()=>{if(!document.hidden)refresh()},15000);
</script></body></html>
