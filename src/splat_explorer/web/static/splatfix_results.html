<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reconstruction results</title><style>
:root{color-scheme:dark;font:14px/1.45 system-ui;background:#111416;color:#e4e9ec}*{box-sizing:border-box}body{margin:0}main{max-width:1500px;margin:auto;padding:28px}header,.tools,.facts,.links{display:flex;align-items:center;gap:18px;flex-wrap:wrap}header{border-bottom:1px solid #333c41;padding-bottom:18px}h1{font-size:21px;font-weight:550;margin:0;flex:1}a{color:#b4d8ea;text-decoration:none}a:hover{text-decoration:underline}input,select,button{font:inherit;background:#1c2226;color:inherit;border:1px solid #3a444b;border-radius:5px;padding:8px 11px}input{min-width:260px}button{cursor:pointer}.tools{margin:22px 0}.count,.dim{color:#97a6ae;font-size:12px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(380px,1fr));gap:18px}article{border:1px solid #354048;border-radius:7px;background:#171d21;overflow:hidden}article .body{padding:19px}h2{font-size:17px;font-weight:550;margin:0 0 4px}.run{font:11px ui-monospace,monospace;color:#9baab2;overflow-wrap:anywhere}.preview-link{position:relative;display:block}.preview-label{position:absolute;right:8px;bottom:8px;font-size:10px;background:#101416dd;padding:3px 6px;color:#d3e1e8}.preview{width:100%;height:180px;object-fit:cover;display:block;background:#101416}.facts{gap:9px;margin:14px 0;font-size:12px}.tag{padding:3px 7px;border:1px solid #3c4a53;border-radius:3px}.links{margin-top:16px;font-size:12px;gap:15px;display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center}.storage-actions{display:flex;align-items:center;gap:8px}.run-links{display:flex;align-items:center;flex-wrap:wrap;gap:15px}.review{border:1px solid #6894a9;border-radius:4px;padding:6px 10px;color:#d8eef7}.metrics{width:100%;border-collapse:collapse;font-size:12px;font-variant-numeric:tabular-nums;margin-top:15px}.metrics th,.metrics td{padding:6px 0;border-bottom:1px solid #2e383f;text-align:right}.metrics th:first-child,.metrics td:first-child{text-align:left}.metrics th{font-weight:500;color:#a6b6bf}.metrics tr.geometry{color:#bfdfec}details{font-size:12px;margin-top:12px;color:#9baab2}details p{line-height:1.5}.empty{padding:50px;color:#a6b6bf;text-align:center}#error{color:#ffb2a8}label{font-size:12px;color:#a6b6bf}.titleline{display:flex;gap:12px;align-items:center}.titleline h2{flex:1;min-width:0;overflow-wrap:anywhere}.run-size{white-space:nowrap}@media(max-width:500px){main{padding:16px}.grid{grid-template-columns:1fr}input{min-width:0;width:100%}}
.icon-button{display:inline-flex;align-items:center;justify-content:center;width:30px;height:30px;padding:5px;flex-shrink:0;background:transparent;border-color:transparent;color:#97a6ae}.icon-button:hover,.icon-button[aria-pressed="true"]{color:#d8eef7;background:#253139;border-color:#465963}.icon-button:focus-visible{outline:2px solid #b4d8ea;outline-offset:2px}.icon-button:disabled{opacity:.45;cursor:wait}.icon-button svg{width:17px;height:17px}.titleline .icon-button{width:24px;height:24px;padding:4px}.titleline .icon-button svg{width:14px;height:14px}article.hidden-run{border-style:dashed}.hidden-label{font-size:11px;color:#97a6ae}
.delete-button:hover{color:#ffb2a8;border-color:#a45d58}
</style></head><body><main><header><h1>Reconstruction results</h1><a href="/splatfix">Pipeline</a><a href="/scene-runs">Scene runs</a></header><div class="tools"><input id="search" type="search" aria-label="Search saved results" placeholder="Scene, run or model"><select id="kind" aria-label="Result type"><option value="">All results</option><option>ArtiFixer3D</option><option>Scene repair</option><option>WorldExplorer</option></select><select id="sort" aria-label="Sort runs"><option value="newest">Newest first (default)</option><option value="oldest">Oldest first</option><option value="largest">Largest first</option><option value="smallest">Smallest first</option></select><label><input id="scored" type="checkbox" style="min-width:0;width:auto"> Evaluated only</label><span id="count" class="count"></span><button id="refresh">Refresh</button><button id="show-hidden" class="icon-button" type="button" aria-label="Show hidden runs" title="Show hidden runs" aria-pressed="false"></button><button id="delete-hidden" class="delete-button" type="button" hidden>Delete all hidden runs</button></div><p id="error" role="alert"></p><p id="notice" class="dim" role="status"></p><section id="results" class="grid" aria-live="polite"></section></main><script>
const $=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let rows=[],showHidden=false,refreshVersion=0;const saving=new Set();
const eyeIcon=off=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/>${off?'<path d="m3 3 18 18"/>':''}</svg>`;
const storageIcon='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 3h18v5H3zM5 8v13h14V8M9 12h6"/></svg>';
const reduceIcon='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 3l6 6M3 9h6V3M21 21l-6-6M15 21v-6h6M15 9l6-6M15 3v6h6M9 15l-6 6M3 15h6v6"/></svg>';
const reconstructionReduceIcon='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7h4l2-3h6l2 3h4v14H3z"/><circle cx="12" cy="13" r="4"/></svg>';
const backupReduceIcon='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 14H2V2h12v2M6 6h16v16H6zM9 9l3 3M9 12h3V9M19 19l-3-3M16 19v-3h3"/></svg>';
const deleteIcon='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6h18M9 6V3h6v3M5 6l1 15h12l1-15M10 10v7M14 10v7"/></svg>';
const names={baseline:'Original',artifixer:'ArtiFixer images',artifixer3d:'ArtiFixer3D',artifixer3d_plus:'ArtiFixer3D+ images'};
const val=(v,n)=>typeof v==='number'&&Number.isFinite(v)?v.toFixed(n):'—';
function formatBytes(bytes){if(!Number.isSafeInteger(bytes)||bytes<0)return '';const units=['B','KiB','MiB','GiB','TiB'];const index=bytes===0?0:Math.min(Math.floor(Math.log(bytes)/Math.log(1024)),units.length-1);return `${(bytes/1024**index).toFixed(index?1:0)} ${units[index]}`}
function compareRunTime(a,b){
 // Both run stores encode local timestamps; only scene runs use a numeric suffix.
 const key=r=>{const m=/^(run|we)_(\d{8})_(\d{6})(?:_([0-9a-f]+))?$/.exec(r.run_id);return m?[m[2]+m[3],m[1]==='run'?Number(m[4]||1):0]:['',0]};
 const x=key(a),y=key(b);return x[0].localeCompare(y[0])||x[1]-y[1];
}
function sortRuns(items,order){
 return [...items].sort((a,b)=>{
  if(order==='largest'||order==='smallest'){
   const known=r=>Number.isSafeInteger(r.output_size_bytes)&&r.output_size_bytes>=0;
   const ak=known(a),bk=known(b);if(ak!==bk)return ak?-1:1;
   if(ak){const delta=a.output_size_bytes-b.output_size_bytes;if(delta)return order==='smallest'?delta:-delta}
  }
  return (order==='oldest'?1:-1)*compareRunTime(a,b);
 });
}
function hiddenRunIds(){return [...new Set(rows.filter(r=>r.hidden&&r.can_archive).map(r=>r.run_id))]}
function render(){ $('delete-hidden').hidden=!showHidden;$('delete-hidden').disabled=!!saving.size||!hiddenRunIds().length;const query=$('search').value.toLowerCase();const shown=sortRuns(rows.filter(r=>(showHidden||!r.hidden)&&(!$('kind').value||r.kind===$('kind').value)&&(!$('scored').checked||Object.keys(r.metrics).length)&&[r.scene,r.run_id,r.model,r.result_name].join(' ').toLowerCase().includes(query)),$('sort').value);const toggle=$('show-hidden');toggle.innerHTML=eyeIcon(!showHidden);toggle.setAttribute('aria-pressed',String(showHidden));toggle.title=showHidden?'Hide hidden runs':'Show hidden runs';toggle.setAttribute('aria-label',toggle.title);$('count').textContent=`${shown.length} / ${rows.length} runs`;$('results').innerHTML=shown.map(r=>`<article class="${r.hidden?'hidden-run':''}">${r.preview_url?`<a class="preview-link" href="${esc(r.detail_url)}"><img class="preview" loading="lazy" src="${esc(r.preview_url)}" alt="${esc(r.preview_label)} for ${esc(r.scene)}"><span class="preview-label">${esc(r.preview_label)}</span></a>`:''}<div class="body"><div class="titleline"><h2>${esc(r.scene||r.run_id)}</h2><button class="icon-button delete-button" type="button" data-run="${esc(r.run_id)}" data-action="delete" aria-label="Permanently delete run ${esc(r.run_id)}" title="${r.can_archive?'Permanently delete entire run':'Run must finish before deletion'}" ${!r.can_archive||saving.has(r.run_id)?'disabled':''}>${deleteIcon}</button><button class="icon-button" type="button" data-run="${esc(r.run_id)}" aria-label="${r.hidden?'Restore':'Hide'} run ${esc(r.run_id)}" title="${r.hidden?'Restore run':'Hide run'}" ${saving.has(r.run_id)?'disabled':''}>${eyeIcon(!r.hidden)}</button><span class="dim">${esc(r.incomplete?'Interrupted · incomplete':r.status)}</span>${formatBytes(r.output_size_bytes)?`<span class="dim run-size" title="Saved total file size in this run folder">${formatBytes(r.output_size_bytes)}</span>`:''}${r.hidden?'<span class="hidden-label">Hidden</span>':''}</div><div class="run">${esc(r.run_id)} · ${esc(r.result_name)}</div><div class="facts">${r.reduced?`<span class="tag">Reduced${formatBytes(r.reduction_saved_bytes)?' -'+formatBytes(r.reduction_saved_bytes):''}</span>`:''}<span class="tag">${esc(r.kind)}</span>${[r.phase,r.mode,r.model,r.trajectory,r.frames?`${r.frames} frames`:null].filter(Boolean).map(x=>`<span class="dim">${esc(x)}</span>`).join('')}</div>${Object.keys(r.metrics).length?`<div class="dim">${esc(r.test_count||'')} test images · LPIPS VGG</div><table class="metrics"><thead><tr><th>Stage</th><th>PSNR ↑</th><th>SSIM ↑</th><th>LPIPS ↓</th></tr></thead><tbody>${Object.entries(r.metrics).map(([stage,m])=>`<tr class="${stage==='artifixer3d'?'geometry':''}"><td>${esc(names[stage]||stage)}</td><td>${val(m.psnr,2)}</td><td>${val(m.ssim,3)}</td><td>${val(m.lpips,3)}</td></tr>`).join('')}</tbody></table>`:'<div class="dim">No evaluation saved</div>'}<div class="links"><div class="run-links"><a class="review" href="${esc(r.detail_url)}">Run details</a>${r.original||r.repaired?`<a class="review" href="${esc(r.viser_url)}">Review splat ↗</a>`:``}${r.ply_url?`<a href="${esc(r.ply_url)}" download>PLY</a>`:''}${r.diagnostics_url?`<a href="${esc(r.diagnostics_url)}">Run diagnostics</a>`:``}${r.metrics_url?`<a href="${esc(r.metrics_url)}">Metrics JSON</a>`:''}${r.provenance_url?`<a href="${esc(r.provenance_url)}">Run metadata</a>`:''}</div><div class="storage-actions">${r.can_reduce?`${r.kind==='ArtiFixer3D'&&r.mode==='edited'?`<button class="icon-button" type="button" data-run="${esc(r.run_id)}" data-action="reduce-reconstruction" aria-label="Reduce, keep reconstruction inputs ${esc(r.run_id)}" title="Reduce, keep reconstruction inputs (images and camera poses)" ${!r.can_archive||saving.has(r.run_id)?'disabled':''}>${reconstructionReduceIcon}</button>`:''}<button class="icon-button" type="button" data-run="${esc(r.run_id)}" data-action="reduce" aria-label="Reduce run ${esc(r.run_id)}" title="Reduce run" ${!r.can_archive||saving.has(r.run_id)?'disabled':''}>${reduceIcon}</button><button class="icon-button" type="button" data-run="${esc(r.run_id)}" data-action="backup-reduce" aria-label="Backup &amp; reduce run ${esc(r.run_id)}" title="Backup &amp; reduce run" ${!r.can_archive||saving.has(r.run_id)?'disabled':''}>${backupReduceIcon}</button>`:''}<button class="icon-button" type="button" data-run="${esc(r.run_id)}" data-action="archive" aria-label="Move run ${esc(r.run_id)} to history for backup" title="${r.can_archive?'Move entire run to outputs/run_history for backup':'Run must finish before moving to history'}" ${!r.can_archive||saving.has(r.run_id)?'disabled':''}>${storageIcon}</button></div></div><div class="dim" style="margin-top:9px">${r.inference_ready?'Inference images ready · reconstruction outputs pending':r.original&&r.repaired?'Original ↔ reconstructed · Space to switch':r.original?'Original saved · reconstructed unavailable':r.repaired?'Reconstructed saved · original unavailable':esc(r.message)||'Waiting for generated images and reconstruction outputs'}</div>${r.metrics_scope||r.limitation?`<details><summary>Evaluation scope</summary><p>${esc(r.metrics_scope||r.limitation)}</p>${r.metrics_scope&&r.limitation?`<p>${esc(r.limitation)}</p>`:''}</details>`:''}</div></article>`).join('')||'<div class="empty">No matching saved results</div>'}
async function refresh(){if(saving.size)return;const version=++refreshVersion;try{$('refresh').disabled=true;const response=await fetch('/api/splatfix/results');if(!response.ok)throw Error(`Results unavailable (${response.status})`);const data=await response.json();if(version!==refreshVersion)return;rows=data.results;$('error').textContent='';render()}catch(e){if(version===refreshVersion)$('error').textContent=e.message}finally{if(version===refreshVersion)$('refresh').disabled=false}}
$('show-hidden').onclick=()=>{showHidden=!showHidden;render()};
$('delete-hidden').onclick=async()=>{
 if(!showHidden||saving.size)return;
 const runIds=hiddenRunIds();if(!runIds.length)return;
 if(!window.confirm(`Permanently delete all ${runIds.length} inactive hidden runs and their files? This includes hidden runs excluded by the current search and filters. Active runs will be kept. This cannot be undone; no history backup will be created.`))return;
 runIds.forEach(id=>saving.add(id));++refreshVersion;$('refresh').disabled=true;$('notice').textContent='';$('error').textContent='';render();
 try{
  const response=await fetch('/api/splatfix/results/delete-hidden',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({run_ids:runIds})});
  const data=await response.json();if(!response.ok)throw Error(data.error||'Could not delete hidden runs');
  const deleted=new Set(data.deleted);rows=rows.filter(r=>!deleted.has(r.run_id));
  $('notice').textContent=`Deleted ${data.deleted.length} hidden runs.`+(data.skipped.length?` Skipped ${data.skipped.length} runs that are active, no longer hidden, or unavailable.`:'');
  if(data.failed.length)$('error').textContent=`Could not fully delete: ${data.failed.join(', ')}. Some files may have been removed. Check folder permissions before retrying.`;
 }catch(e){$('error').textContent=e.message}
 finally{runIds.forEach(id=>saving.delete(id));$('refresh').disabled=!!saving.size;render()}
};
$('results').onclick=async event=>{
 const button=event.target.closest('button[data-run]');if(!button)return;
 const run=button.dataset.run,row=rows.find(r=>r.run_id===run);if(!row||saving.has(run))return;
 const archive=button.dataset.action==='archive',remove=button.dataset.action==='delete';const preserveReconstruction=button.dataset.action==='reduce-reconstruction';const reduce=['reduce','backup-reduce','reduce-reconstruction'].includes(button.dataset.action),backup=button.dataset.action==='backup-reduce';if((archive||remove||reduce)&&!row.can_archive)return;if(reduce&&!row.can_reduce)return;
 if(reduce&&!window.confirm(`${backup?'Create and verify a full copy in outputs/run_history, then reduce':'Permanently reduce'} ${run}? ${preserveReconstruction?'Keep generated inference/plus images, all saved inference camera poses and intrinsics, six repaired references, frame mappings, original/final PLYs, logs, verified MP4 videos and essential metadata so reconstruction can be run again.':row.kind==='ArtiFixer3D'?'Encode every inference/plus batch as a verified MP4, then keep all generated inference/plus output images, original/final PLYs, logs, inference videos, comparison/quality previews and essential metadata.':'Keep available repaired references, full trajectory videos, original/final PLYs, logs and essential metadata.'} Failed or stopped runs may not have produced every artifact. ${preserveReconstruction?'Remove other input images, sparse videos and intermediate checkpoints. Reconstruction can restart from saved inference; existing training checkpoints are removed.':'Remove all other images, poses, sparse videos and intermediate checkpoints. Training cannot be resumed from a reduced run.'} ${backup?'The backup uses additional local disk space until you move it.':'No backup will be created; this cannot be undone.'}`))return;
 if(remove&&!window.confirm(`Permanently delete ${run} (${row.scene||'run'}) and all files in its run folder? This cannot be undone. No history backup will be created.`))return;
 const hidden=!row.hidden;saving.add(run);++refreshVersion;$('refresh').disabled=true;$('notice').textContent=reduce?(backup?'Copying and verifying full backup, then reducing…':'Reducing run…'):'';render();
 try{
  const response=await fetch('/api/splatfix/results/'+(reduce?'reduce':remove?'delete':archive?'archive':'visibility'),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(reduce?{run_id:run,backup,...(preserveReconstruction?{preserve_reconstruction:true}:{})}:archive||remove?{run_id:run}:{run_id:run,hidden})});
  const data=await response.json();if(!response.ok)throw Error(data.error||(remove?'Could not delete run':archive?'Could not move run to history':'Could not save run visibility'));
  if(remove){rows=rows.filter(r=>r.run_id!==run);$('notice').textContent=`Permanently deleted ${run}.`}
  else if(archive){rows=rows.filter(r=>r.run_id!==run);$('notice').textContent=`Moved ${run} to ${data.path}. Ready to transfer to external storage.`}
  else if(reduce){rows.forEach(r=>{if(r.run_id===run){r.reduced=true;r.reduction_saved_bytes=data.reduction_saved_bytes;r.can_reduce=false;r.output_size_bytes=data.output_size_bytes;r.preview_url=null}});$('notice').textContent=`Reduced ${run} to ${formatBytes(data.output_size_bytes)}.`+(data.backup_path?` Full backup: ${data.backup_path}`:'')}
  else rows.forEach(r=>{if(r.run_id===run)r.hidden=data.hidden});
  $('error').textContent='';
 }catch(e){$('error').textContent=e.message}
 finally{saving.delete(run);$('refresh').disabled=!!saving.size;render()}
};
$('search').oninput=render;$('kind').onchange=render;$('sort').onchange=render;$('scored').onchange=render;$('refresh').onclick=refresh;refresh();setInterval(()=>{if(!document.hidden)refresh()},15000);
</script></body></html>
