<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>splat-explorer · extended scene runs</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root {
    --bg:#101318; --panel:#171c24; --panel2:#1e2530; --border:#2a3342;
    --text:#dce3ee; --dim:#8b97a8; --accent:#5aa2ff; --ok:#45c98b;
    --warn:#e6b450; --err:#ef6a6a; --mono:ui-monospace,SFMono-Regular,Menlo,monospace;
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text);
    font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
  header { position:sticky; top:0; z-index:10; display:flex; align-items:center; gap:14px;
    padding:10px 16px; background:var(--panel); border-bottom:1px solid var(--border);
    flex-wrap:wrap; }
  h1 { margin:0; font-size:15px; font-weight:650; }
  h1 span { color:var(--dim); font-weight:400; }
  a { color:var(--accent); text-decoration:none; }
  .spacer { flex:1; }
  .pill { padding:2px 10px; border:1px solid var(--border); border-radius:20px;
    color:var(--dim); font-size:12px; }
  .pill.ok { color:var(--ok); border-color:var(--ok); }
  .pill.busy { color:var(--warn); border-color:var(--warn); }
  .pill.err { color:var(--err); border-color:var(--err); }
  main { max-width:1440px; margin:auto; padding:16px 16px 28px; display:grid;
    grid-template-columns:minmax(300px,340px) minmax(0,1fr); gap:16px; align-items:start; }
  .column { display:flex; flex-direction:column; gap:12px; min-width:0; }
  .card { background:var(--panel); border:1px solid var(--border); border-radius:10px;
    padding:14px 16px; min-width:0; }
  .card h2 { margin:0; color:var(--dim); font-size:11px; font-weight:650;
    text-transform:uppercase; letter-spacing:.06em; }
  .card-head { display:flex; align-items:center; justify-content:space-between;
    gap:8px 12px; margin-bottom:12px; flex-wrap:wrap; }
  .setup-row { display:flex; align-items:center; gap:4px; min-width:0; }
  .setup-status { max-width:148px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
    color:var(--dim); font-size:12px; }
  .setup-status.ok { color:var(--ok); }
  .setup-status.warn { color:var(--warn); }
  .setup-status.err { color:var(--err); }
  form { display:grid; grid-template-columns:1fr 1fr; gap:8px 10px; }
  label { display:flex; flex-direction:column; gap:3px; color:var(--dim); font-size:11px; }
  label.wide, .actions { grid-column:1/-1; }
  input, select, button { font-family:inherit; }
  input, select { width:100%; padding:6px 8px; border:1px solid var(--border);
    border-radius:6px; background:var(--panel2); color:var(--text); font-size:13px; }
  input[readonly] { color:var(--dim); }
  input:focus, select:focus { outline:1px solid var(--accent); }
  .stepper { display:flex; align-items:stretch; min-width:0; }
  .stepper input { flex:1; min-width:0; width:auto;
    border-top-right-radius:0; border-bottom-right-radius:0; }
  .stepper input::-webkit-outer-spin-button,
  .stepper input::-webkit-inner-spin-button { -webkit-appearance:none; margin:0; }
  .stepper input[type=number] { -moz-appearance:textfield; appearance:textfield; }
  .nudge { display:flex; flex-direction:column; flex:none; }
  .nudge button { width:16px; flex:1; padding:0; margin:0; border:1px solid var(--border);
    border-left:0; border-radius:0; background:transparent; color:var(--dim);
    font-size:8px; font-weight:500; line-height:1; }
  .nudge button:first-child { border-radius:0 6px 0 0; }
  .nudge button:last-child { border-top:0; border-radius:0 0 6px 0; }
  .nudge button:hover:not(:disabled) { color:var(--text); background:rgba(255,255,255,.04); }
  .locked { flex-direction:row; align-items:center; gap:6px; font-size:12px; }
  .locked input { width:auto; accent-color:var(--accent); }
  button { border:1px solid transparent; border-radius:6px; padding:7px 12px; cursor:pointer;
    background:var(--panel2); color:var(--text); font-weight:600; font-size:13px; }
  #start { background:var(--accent); color:#091525; }
  button.ghost { background:transparent; color:var(--dim); border-color:var(--border);
    padding:3px 8px; font-size:12px; font-weight:550; }
  button.ghost:hover:not(:disabled) { color:var(--text); border-color:#3d4c63; }
  button.ghost.loaded { border-color:transparent; color:var(--dim); opacity:.45;
    font-weight:500; padding-left:4px; padding-right:4px; }
  button.ghost.loaded:hover:not(:disabled) { opacity:.8; color:var(--text); }
  button.stop { background:transparent; color:var(--err); border-color:rgba(239,106,106,.4); }
  button.stop:hover:not(:disabled) { border-color:var(--err); }
  button:disabled { opacity:.4; cursor:default; }
  .actions { display:flex; align-items:center; gap:10px; margin-top:2px; }
  #message { color:var(--warn); font-size:12px; min-height:16px; }
  .list-label { margin:0 0 6px; color:var(--dim); font-size:11px; font-weight:650;
    text-transform:uppercase; letter-spacing:.06em; }
  .list-label.later { margin-top:14px; }
  .run-list { display:flex; flex-direction:column; gap:2px; max-height:320px; overflow:auto; }
  .run-row { display:flex; align-items:center; justify-content:space-between; gap:10px;
    padding:8px 8px; border:1px solid transparent; border-radius:8px; cursor:pointer; }
  .run-row:hover { background:var(--panel2); }
  .run-row.selected { background:var(--panel2); border-color:#3a4d66; }
  .run-main { min-width:0; display:flex; flex-direction:column; gap:1px; }
  .run-scene { font-size:13px; font-weight:600; }
  .run-id { font:11px var(--mono); color:var(--dim); overflow:hidden;
    text-overflow:ellipsis; white-space:nowrap; }
  .run-side { display:flex; flex-direction:column; align-items:flex-end; gap:2px; flex:none; }
  .when { color:var(--dim); font-size:11px; }
  .status { font-size:11px; font-weight:650; color:var(--dim); text-transform:lowercase; }
  .status.running,.status.completed { color:var(--ok); }
  .status.queued,.status.waiting_gpu,.status.starting,.status.stopping { color:var(--warn); }
  .status.error,.status.gpu_expired { color:var(--err); }
  .empty { color:var(--dim); padding:8px 4px; }
  .empty-state { min-height:240px; display:flex; align-items:center; justify-content:center;
    color:var(--dim); }
  .detail-head { display:flex; gap:12px; align-items:flex-start; flex-wrap:wrap; }
  .detail-head h2 { margin:0; color:var(--text); font:600 13px var(--mono);
    text-transform:none; letter-spacing:0; overflow-wrap:anywhere; }
  .detail-id { display:flex; flex-direction:column; gap:3px; min-width:0; }
  .detail-head .right { margin-left:auto; display:flex; align-items:center; gap:8px; }
  a.btn { display:inline-block; border:1px solid var(--border); border-radius:6px;
    padding:6px 10px; background:transparent; color:var(--text); font-size:12px; font-weight:600; }
  a.btn:hover { border-color:#3d4c63; }
  .summary { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:8px; margin-top:14px; }
  .metric { padding:8px 10px; background:var(--panel2); border-radius:7px; min-width:0; }
  .metric .key { color:var(--dim); font-size:10px; text-transform:uppercase; letter-spacing:.05em; }
  .metric .value { margin-top:3px; font:600 13px var(--mono); overflow-wrap:anywhere; }
  .metric .value.running,.metric .value.completed { color:var(--ok); }
  .metric .value.queued,.metric .value.waiting_gpu,.metric .value.starting,
  .metric .value.stopping { color:var(--warn); }
  .metric .value.error,.metric .value.gpu_expired { color:var(--err); }
  .kv { display:grid; grid-template-columns:150px minmax(0,1fr); gap:5px 12px;
    margin-top:13px; font-size:12.5px; }
  .kv .k { color:var(--dim); }
  .kv .v { font-family:var(--mono); overflow-wrap:anywhere; }
  .section-label { margin:16px 0 0; color:var(--dim); font-size:11px; font-weight:650;
    text-transform:uppercase; letter-spacing:.06em; }
  .run-error { margin-top:12px; padding:10px; border-left:3px solid var(--err);
    background:rgba(239,106,106,.08); color:#ffb3b3; white-space:pre-wrap; }
  .artifacts { display:grid; grid-template-columns:repeat(auto-fill,minmax(220px,1fr));
    gap:10px; margin-top:8px; }
  .artifact { min-width:0; padding:8px; border:1px solid var(--border);
    border-radius:8px; background:var(--panel2); overflow:hidden; }
  .artifact img { display:block; width:100%; aspect-ratio:4/3; object-fit:contain;
    background:#080a0d; border-radius:4px; }
  .artifact a.cap { display:block; margin-top:6px; font:11px var(--mono); color:var(--dim);
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .artifact a.cap:hover { color:var(--accent); }
  .files { display:flex; flex-direction:column; gap:4px; margin-top:8px; }
  .files a { font:12px var(--mono); overflow-wrap:anywhere; }
  details { margin-top:14px; border:1px solid var(--border); border-radius:8px; }
  summary { padding:8px 10px; color:var(--dim); cursor:pointer; font-size:12px; }
  pre { margin:0; padding:10px; border-top:1px solid var(--border); overflow:auto;
    max-height:420px; color:var(--text); font:11.5px/1.5 var(--mono); }
  #capture-pip { position:fixed; right:14px; bottom:14px; z-index:20;
    width:260px; background:var(--panel); border:1px solid var(--border);
    border-radius:8px; overflow:hidden; box-shadow:0 8px 30px #0008; }
  #capture-pip .bar { padding:5px 8px; color:var(--dim); font-size:10px;
    border-bottom:1px solid var(--border); }
  #capture-window { width:260px; height:195px; overflow:hidden; background:#000; }
  #capture-stage { transform-origin:top left; }
  #capture-frame { display:block; border:0; }
  @media (max-width:900px) {
    main { grid-template-columns:1fr; }
    .summary { grid-template-columns:1fr 1fr; }
  }
</style>
</head>
<body>
<header>
  <h1>splat-explorer <span>· extended scene runs</span></h1>
  <span id="manager-pill" class="pill">manager: …</span>
  <span id="run-pill" class="pill">no active run</span>
  <span class="spacer"></span>
  <a href="/">episode dashboard</a>
  <a href="/scene-runs">baseline pipeline</a>
  <a href="/repair">repair review</a>
  <a href="/repair/gpu">GPU / LRZ</a>
  <a href="/spectator" target="_blank">spectator (HD) ↗</a>
</header>
<main>
  <section class="column">
    <div class="card">
      <div class="card-head">
        <h2>Queue</h2>
        <div class="setup-row">
          <span id="gpu-mode" class="setup-status" aria-live="polite">GPU …</span>
          <button type="button" id="load-artifixer" class="ghost">ArtiFixer</button>
          <button type="button" id="load-baseline" class="ghost">Baseline</button>
        </div>
      </div>
      <form id="run-form">
        <label class="wide">Scene<select id="scene" name="scene_id"></select></label>
        <label>Duration (hours)<span class="stepper"><input id="duration" type="number" min="0.01" max="168" step="0.25" value="1"><span class="nudge"><button type="button" data-step="1" aria-label="Increase duration">▴</button><button type="button" data-step="-1" aria-label="Decrease duration">▾</button></span></span></label>
        <label>VLM backend<input id="backend" name="backend" value="cli_relay" readonly></label>
        <label>Width<input id="width" name="width" type="number" min="64" max="3840" value="960"></label>
        <label>Height<input id="height" name="height" type="number" min="64" max="2160" value="720"></label>
        <label class="wide">VLM model<input id="model" name="model" value="gpt-5.6-luna"></label>
        <label>Image edit<select id="image-edit" name="image_edit_backend">
          <option value="gpt-image-2.5-sunburst">gpt-image-2.5 sunburst (CliRelay)</option>
          <option value="gpt-image-2.5-flare">gpt-image-2.5 flare (CliRelay)</option>
          <option value="gpt-image-2">gpt-image-2 (CliRelay)</option>
          <option value="qwen-image-edit">qwen-image-edit (GPU backup)</option>
        </select></label>
        <label>3D repair<input id="repair-backend" name="repair_backend" value="artifixer-gsplat" readonly></label>
        <label style="display:none">Repair type<select id="repair-type" name="repair_type">
          <option value="original">original GSFix3D</option>
          <option value="looped">looped</option>
        </select></label>
        <label>Repair trigger<select id="repair-trigger" name="repair_trigger">
          <option value="regenerate_yes">regenerate=yes</option>
          <option value="every_artifact">every artifact</option>
          <option value="every_step">every step after first artifact</option>
        </select></label>
        <label>Propagation frames<input id="ext-frames" type="number" min="9" max="81" step="4" value="25"></label>
        <label>Trajectory span / depth<input id="ext-span" type="number" min="0.005" max="0.15" step="0.005" value="0.04"></label>
        <label>Multiview fit iterations<input id="ext-iters" type="number" min="1" max="2000" value="200"></label>
        <label>Scene units → metres<span class="stepper"><input id="ext-scale" type="number" min="0.0001" max="10000" step="0.1" value="1"><span class="nudge"><button type="button" data-step="1" aria-label="Increase scene scale">▴</button><button type="button" data-step="-1" aria-label="Decrease scene scale">▾</button></span></span></label>
        <label id="repair-time-wrap" style="display:none">Repair Time (seconds)<input id="repair-seconds" name="repair_seconds" type="number" min="1" max="43200" value="180"></label>
        <label class="wide locked" title="Scene runs always render and send the exploration map.">
          <input id="send-map" type="checkbox" checked disabled> Send exploration map (locked)
        </label>
        <div class="actions">
          <button id="start" type="submit">Queue scene run</button>
          <span id="message"></span>
        </div>
      </form>
    </div>
    <div class="card">
      <div class="list-label">Active</div>
      <div id="active-list" class="run-list"><div class="empty">No queued runs.</div></div>
      <div class="list-label later">History</div>
      <div id="history" class="run-list"><div class="empty">No runs yet.</div></div>
    </div>
  </section>
  <section class="column">
    <div id="detail" class="card"><div class="empty-state">Select a run</div></div>
  </section>
</main>
<aside id="capture-pip" title="This live WebGL client answers scene-run render requests while the page is open.">
  <div class="bar">VLM capture visor · <span id="capture-size">960×720</span></div>
  <div id="capture-window"><div id="capture-stage">
    <iframe id="capture-frame" title="Scene-run capture visor" src="http://localhost:8080" allow="autoplay"></iframe>
  </div></div>
</aside>
<script>
"use strict";
const $ = id => document.getElementById(id);
const ACTIVE = new Set(["queued","waiting_gpu","starting","running","stopping"]);
let state = null, detail = null, selectedId = null, timer = null, first = true;

const esc = value => String(value ?? "").replace(/[&<>"']/g, c => (
  {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]
));
function runId(run) { return run?.id || run?.run_id || run?.run?.id || ""; }
function statusOf(run) {
  const stateValue = run?.state;
  return String(
    run?.status || (typeof stateValue === "object" ? stateValue?.status : stateValue)
    || run?.run?.status || "unknown"
  ).toLowerCase();
}
function bag(run) {
  const stateValue = typeof run?.state === "object" ? run.state : {};
  return {...run, ...(run?.status && typeof run.status === "object" ? run.status : {}),
    ...stateValue, ...(stateValue?.details || {}), ...(run?.progress || {})};
}
function firstValue(obj, keys) {
  for (const key of keys) if (obj?.[key] !== undefined && obj?.[key] !== null && obj[key] !== "") return obj[key];
  return null;
}
function fmtTime(value) {
  if (value == null || value === "") return "–";
  const date = new Date(typeof value === "number" && value < 1e12 ? value * 1000 : value);
  return Number.isNaN(date.valueOf()) ? String(value) : date.toLocaleString();
}
function fmtDuration(seconds) {
  const n = Number(seconds);
  if (!Number.isFinite(n)) return "–";
  if (n >= 3600) return `${(n / 3600).toFixed(n % 3600 ? 1 : 0)}h`;
  if (n >= 60) return `${Math.round(n / 60)}m`;
  return `${Math.round(n)}s`;
}
function runRow(run) {
  const id = runId(run), status = statusOf(run), b = bag(run);
  const scene = run?.config?.scene_id || b.scene_id || "scene";
  const when = firstValue(b, ["updated_at","created_at","started_at"]);
  return `<div class="run-row ${id === selectedId ? "selected" : ""}" data-id="${esc(id)}">
    <span class="run-main">
      <span class="run-scene">${esc(scene)}</span>
      <span class="run-id">${esc(id || "(unknown id)")}</span>
    </span>
    <span class="run-side">
      <span class="status ${esc(status)}">${esc(String(status).replace(/_/g, " "))}</span>
      <span class="when">${when ? esc(fmtTime(when)) : ""}</span>
    </span>
  </div>`;
}
function wireRows() {
  document.querySelectorAll(".run-row").forEach(row => row.onclick = () => {
    selectedId = row.dataset.id; detail = null; refreshDetail().then(render);
  });
}
function stepPlaces(input) {
  return Math.max(0, ...[input.min, input.max, input.step].map(raw => {
    const text = String(raw ?? "");
    const dot = text.indexOf(".");
    return dot < 0 ? 0 : text.length - dot - 1;
  }));
}
function snapInput(input) {
  const step = Number(input.step);
  if (!Number.isFinite(step) || step <= 0) return;
  const min = Number(input.min);
  const max = Number(input.max);
  const origin = Number.isFinite(min) ? min : 0;
  let value = Number(input.value);
  if (!Number.isFinite(value)) value = origin;
  let snapped = origin + Math.round((value - origin) / step) * step;
  if (Number.isFinite(min) && snapped < min - step * 1e-6) snapped = min;
  if (Number.isFinite(max) && snapped > max + step * 1e-6) {
    snapped = origin + Math.floor((max - origin) / step + 1e-8) * step;
  }
  input.value = snapped.toFixed(stepPlaces(input));
  const wrap = input.closest(".stepper");
  if (!wrap) return;
  const current = Number(input.value);
  wrap.querySelector('[data-step="1"]').disabled = Number.isFinite(max) && current >= max - step / 2;
  wrap.querySelector('[data-step="-1"]').disabled = Number.isFinite(min) && current <= min + step / 2;
}
function bumpInput(input, direction) {
  const step = Number(input.step) || 1;
  const current = Number(input.value);
  input.value = String((Number.isFinite(current) ? current : 0) + direction * step);
  snapInput(input);
}
function snapSteppers() {
  document.querySelectorAll(".stepper input").forEach(snapInput);
}
function setDefaults(defaults, scenes) {
  if (!first) return;
  first = false;
  $("scene").innerHTML = (scenes || []).map(s =>
    `<option value="${esc(s.id)}">${esc(s.label || s.id)}</option>`).join("");
  if (!scenes?.length) $("scene").innerHTML = `<option value="${esc(defaults.scene_id)}">${esc(defaults.scene_id)}</option>`;
  $("scene").value = defaults.scene_id;
  $("duration").value = Number(defaults.duration_seconds || 3600) / 3600;
  snapSteppers();
  for (const [id,key] of [["backend","backend"],["model","model"],["width","width"],["height","height"],
    ["image-edit","image_edit_backend"],["repair-backend","repair_backend"],
    ["repair-type","repair_type"],["repair-trigger","repair_trigger"],["repair-seconds","repair_seconds"]]) {
    if (defaults[key] !== undefined) $(id).value = defaults[key];
  }
  syncRepairTime();
  layoutCapture();
}
function syncRepairTime() {
  const looped = $("repair-type").value === "looped";
  $("repair-time-wrap").style.display = looped ? "" : "none";
}
function layoutCapture() {
  const active = (state?.runs || []).find(run => ["starting","running","stopping"].includes(statusOf(run)));
  const w = Number(active?.config?.width || $("width").value || 960);
  const h = Number(active?.config?.height || $("height").value || 720);
  const visualW = 260, scale = visualW / Math.max(1, w);
  $("capture-frame").style.width = `${w}px`;
  $("capture-frame").style.height = `${h}px`;
  $("capture-stage").style.width = `${w}px`;
  $("capture-stage").style.height = `${h}px`;
  $("capture-stage").style.transform = `scale(${scale})`;
  $("capture-window").style.height = `${Math.round(h * scale)}px`;
  $("capture-size").textContent = `${w}×${h}`;
}
function renderState() {
  const runs = state?.runs || [];
  const active = runs.filter(run => ACTIVE.has(statusOf(run)));
  const history = runs.filter(run => !ACTIVE.has(statusOf(run)));
  $("active-list").innerHTML = active.length ? active.map(runRow).join("") : `<div class="empty">No queued runs.</div>`;
  $("history").innerHTML = history.length ? history.map(runRow).join("") : `<div class="empty">No completed runs.</div>`;
  wireRows();
  const manager = state?.manager || {};
  const managerStatus = String(manager.status || (manager.active ? "busy" : "idle"));
  $("manager-pill").textContent = `manager: ${managerStatus}`;
  $("manager-pill").className = `pill ${
    manager.active ? "ok" : managerStatus === "stale" || managerStatus === "not_detected" ? "err" : ""
  }`;
  $("run-pill").textContent = active.length ? `${active.length} active / queued` : "no active run";
  $("run-pill").className = `pill ${active.length ? "busy" : "ok"}`;
  if (!selectedId && runs.length) selectedId = runId(state.active_run) || runId(runs[0]);
  setDefaults(state?.defaults || {}, state?.scenes || []);
  layoutCapture();
  paintSetup();
}
function deadlineRows(b) {
  const user = firstValue(b, ["requested_deadline","user_deadline","user_end","deadline"]);
  const gpu = firstValue(b, ["gpu_expected_end","gpu_deadline","slurm_end","gpu_end"])
    ?? firstValue(b.gpu || {}, ["expected_end","deadline","end"]);
  const effective = firstValue(b, ["effective_deadline","effective_end"]);
  let remaining = null;
  if (effective != null) {
    const ms = new Date(typeof effective === "number" && effective < 1e12 ? effective * 1000 : effective).valueOf();
    if (Number.isFinite(ms)) remaining = Math.max(0, (ms - Date.now()) / 1000);
  }
  return [
    ["user deadline", fmtTime(user)], ["GPU deadline", fmtTime(gpu)],
    ["effective deadline", `${fmtTime(effective)}${remaining == null ? "" : ` · ${fmtDuration(remaining)} left`}`],
  ];
}
function artifactEntries(value, id, key = "", seen = new Set()) {
  const entries = [];
  if (!value || typeof value !== "object" || seen.has(value)) return entries;
  seen.add(value);
  for (const [name,item] of Object.entries(value)) {
    const nextKey = `${key}.${name}`.toLowerCase();
    if ((name === "name" || name === "relative") && value.url) continue;
    if (typeof item === "string" && /\.(png|jpe?g|webp|gif|ply|log|txt|jsonl)$/i.test(item)) {
      if (nextKey.endsWith(".path") && !/(image|frame|artifact|ply|log)/.test(nextKey)) continue;
      let url = item.startsWith("/scene-run-files/") || item.startsWith("/frames/") ? item : "";
      if (!url) {
        if (item.startsWith("/") || /^[A-Za-z]:[\\/]/.test(item)) continue;
        const rel = item.replace(/^\.?\//,"");
        if (!rel.includes("..") && !rel.includes("://")) url = `/scene-run-files/${encodeURIComponent(id)}/${rel.split("/").map(encodeURIComponent).join("/")}`;
      }
      if (url) entries.push({name, path:item, url, image:/\.(png|jpe?g|webp|gif)$/i.test(item)});
    } else if (item && typeof item === "object") {
      entries.push(...artifactEntries(item, id, nextKey, seen));
    }
  }
  return entries.filter((entry,index,all) => all.findIndex(other => other.url === entry.url) === index);
}
function cell(kind, key, value, extra = "") {
  return `<div class="${kind}"><div class="${kind === "metric" ? "key" : "k"}">${esc(key)}</div><div class="${kind === "metric" ? "value" : "v"} ${extra}">${esc(value)}</div></div>`;
}
function fileName(path) {
  const parts = String(path || "").split(/[\\/]/);
  return parts[parts.length - 1] || path || "file";
}
function renderDetail() {
  if (!selectedId) {
    $("detail").innerHTML = `<div class="empty-state">Select a run</div>`;
    return;
  }
  if (!detail) {
    $("detail").innerHTML = `<div class="empty-state">Loading ${esc(selectedId)}…</div>`;
    return;
  }
  const b = bag(detail), status = statusOf(detail), cfg = detail.config || detail.params || {};
  const step = firstValue(b, ["step","current_step","steps","steps_completed"]);
  const phase = firstValue(b, ["phase","current_phase"]);
  const repairs = firstValue(b, ["repair_count","repairs","repairs_completed"]);
  const repairTime = firstValue(b, ["repair_elapsed_seconds","repair_seconds_total","last_repair_seconds"]);
  const l1Before = firstValue(b, ["l1_before","repair_l1_before"]);
  const l1After = firstValue(b, ["l1_after","repair_l1_after"]);
  const metrics = [
    ["Status", status, status],
    ["Step / phase", [step == null ? null : `#${step}`, phase].filter(Boolean).join(" · ") || "–", ""],
    ["Repairs", `${repairs ?? 0}${repairTime == null ? "" : ` · ${fmtDuration(repairTime)}`}`, ""],
    ["L1 before → after", l1Before == null && l1After == null ? "–" : `${l1Before ?? "–"} → ${l1After ?? "–"}`, ""],
  ];
  const rows = [
    ["scene", cfg.scene_id || firstValue(b, ["scene_id","scene"]) || "–"],
    ["VLM", [cfg.backend,cfg.model].filter(Boolean).join(" · ") || "–"],
    ["resolution", cfg.width && cfg.height ? `${cfg.width}×${cfg.height}` : "–"],
    ["image / repair", [cfg.image_edit_backend,cfg.repair_backend].filter(Boolean).join(" → ") || "–"],
    ["repair type", cfg.repair_type === "looped" ? "looped" : "original GSFix3D"],
    ["repair trigger", cfg.repair_trigger || "–"],
    ["created", fmtTime(firstValue(b, ["created_at"]))],
    ["started", fmtTime(firstValue(b, ["started_at"]))],
    ["updated", fmtTime(firstValue(b, ["updated_at"]))],
    ...deadlineRows(b),
  ];
  const artifacts = artifactEntries(detail, selectedId);
  const images = artifacts.filter(item => item.image);
  const files = artifacts.filter(item => !item.image);
  const error = firstValue(b, ["error","last_error","message"]);
  $("detail").innerHTML = `<div class="detail-head">
    <div class="detail-id">
      <h2>${esc(selectedId)}</h2>
      <span class="status ${esc(status)}">${esc(String(status).replace(/_/g, " "))}</span>
    </div>
    <div class="right">
      <a class="btn" id="open-viser" href="/${encodeURIComponent(selectedId)}/viser" target="_blank" rel="noopener"
         title="Starts one dedicated review visor for this run (not the live capture visor).">Open visor</a>
      <button id="stop" class="stop" ${ACTIVE.has(status) ? "" : "disabled"}>Request stop</button>
    </div>
  </div>
  <div class="summary">${metrics.map(([k,v,cls]) => cell("metric", k, v, cls)).join("")}</div>
  <div class="kv">${rows.map(([k,v]) => `<span class="k">${esc(k)}</span><span class="v">${esc(v)}</span>`).join("")}</div>
  ${error && (status === "error" || b.error || b.last_error) ? `<div class="run-error">${esc(error)}</div>` : ""}
  ${images.length ? `<div class="section-label">Frames</div><div class="artifacts">${images.map(a => `<div class="artifact">
    <a href="${esc(a.url)}" target="_blank"><img src="${esc(a.url)}" loading="lazy" alt="${esc(fileName(a.path))}"></a>
    <a class="cap" href="${esc(a.url)}" target="_blank" title="${esc(a.path)}">${esc(fileName(a.path))}</a>
  </div>`).join("")}</div>` : ""}
  ${files.length ? `<div class="section-label">Files</div><div class="files">${files.map(a =>
    `<a href="${esc(a.url)}" target="_blank">${esc(a.path)}</a>`).join("")}</div>` : ""}
  ${artifacts.length ? "" : `<div class="empty">No images, logs, or PLY artifacts yet.</div>`}
  <details><summary>Raw run detail</summary><pre>${esc(JSON.stringify(detail,null,2))}</pre></details>`;
  $("stop").onclick = stopRun;
}
function render() { renderState(); renderDetail(); }
async function fetchJson(url, options) {
  const response = await fetch(url, options);
  const body = await response.json().catch(() => ({}));
  if (!response.ok) throw new Error(body.message || body.error || `HTTP ${response.status}`);
  return body;
}
async function refreshDetail() {
  if (!selectedId) return;
  try { detail = await fetchJson(`/api/scene-runs-ext/${encodeURIComponent(selectedId)}`); }
  catch (error) { detail = {id:selectedId,status:"error",error:error.message}; }
}
async function tick() {
  clearTimeout(timer);
  try {
    state = await fetchJson("/api/scene-runs-ext/state");
    renderState();
    await refreshDetail();
    render();
  } catch (error) {
    $("message").textContent = error.message;
  }
  timer = setTimeout(tick, state?.active ? 1000 : 5000);
}
$("run-form").onsubmit = async event => {
  event.preventDefault();
  snapSteppers();
  $("start").disabled = true; $("message").textContent = "Writing queued run…";
  const body = {
    scene_id:$("scene").value, duration_seconds:Math.round(Number($("duration").value) * 3600),
    backend:$("backend").value, model:$("model").value, width:Number($("width").value),
    height:Number($("height").value), send_map:true, image_edit_backend:$("image-edit").value,
    repair_backend:$("repair-backend").value, repair_type:$("repair-type").value,
    extended:{frames:Number($("ext-frames").value), span_fraction:Number($("ext-span").value), fit_iterations:Number($("ext-iters").value), camera_scale:Number($("ext-scale").value)},
    repair_trigger:$("repair-trigger").value,
    repair_seconds:Number($("repair-seconds").value),
  };
  try {
    const result = await fetchJson("/api/scene-runs-ext/start", {
      method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(body),
    });
    selectedId = runId(result.run); detail = result.run;
    $("message").textContent = `Queued ${selectedId}. The separate manager will start it.`;
    await tick();
  } catch (error) { $("message").textContent = error.message; }
  finally { $("start").disabled = false; }
};
async function stopRun() {
  if (!selectedId) return;
  $("stop").disabled = true; $("message").textContent = `Requesting stop for ${selectedId}…`;
  try {
    const result = await fetchJson("/api/scene-runs-ext/stop", {
      method:"POST", headers:{"Content-Type":"application/json"},
      body:JSON.stringify({id:selectedId}),
    });
    detail = result.run; $("message").textContent = "Stop requested.";
    await tick();
  } catch (error) { $("message").textContent = error.message; $("stop").disabled = false; }
}
tick();
$("repair-type").addEventListener("change", syncRepairTime);
let gpuSetup = null, setupTimer = null;
function paintSetup() {
  const setup = gpuSetup || {};
  const ready = Boolean(setup.ok) && !setup.inflight;
  const artifixerOn = ready && setup.detail?.setup_mode === "artifixer";
  const baselineOn = ready && !artifixerOn;
  const busy = Boolean(setup.inflight || state?.active);
  const arti = $("load-artifixer"), base = $("load-baseline"), label = $("gpu-mode");
  arti.disabled = base.disabled = busy;
  arti.className = "ghost" + (artifixerOn ? " loaded" : "");
  base.className = "ghost" + (baselineOn ? " loaded" : "");
  arti.textContent = artifixerOn ? "ArtiFixer · loaded" : "ArtiFixer";
  base.textContent = baselineOn ? "Baseline · loaded" : "Baseline";
  arti.title = artifixerOn ? "ArtiFixer is already loaded" : "Load the ArtiFixer GPU setup";
  base.title = baselineOn ? "Baseline is already loaded" : "Load the baseline GPU setup";
  let text = "", cls = "setup-status";
  if (!gpuSetup) text = "GPU …";
  else if (setup.inflight) text = setup.message || "Loading…";
  else if (setup.error) { text = setup.error; cls = "setup-status err"; }
  else if (setup.needs_reload) { text = setup.message || "Reload needed"; cls = "setup-status warn"; }
  else if (!ready) text = "No GPU setup";
  label.hidden = !text;
  label.textContent = text;
  label.className = cls;
  label.title = text;
}
async function gpuSetupState() {
  clearTimeout(setupTimer);
  try {
    const snap = await fetchJson("/api/repair/gpu");
    gpuSetup = snap.setup || {};
  } catch (err) {
    gpuSetup = {error: err.message};
  }
  paintSetup();
  setupTimer = setTimeout(gpuSetupState, gpuSetup?.inflight ? 2000 : 10000);
}
async function reloadSetup(artifixer) {
  $("load-artifixer").disabled = $("load-baseline").disabled = true;
  try {
    const snap = await fetchJson("/api/repair/gpu/setup", {method:"POST", headers:{"Content-Type":"application/json"},
      body:JSON.stringify({force:true, QWEN_required:false, ARTIFIXER_required:artifixer})});
    gpuSetup = {...(snap.setup || gpuSetup || {}), inflight: true, message: snap.message || "Loading…"};
  } catch (err) {
    gpuSetup = {...(gpuSetup || {}), error: err.message, inflight: false};
  }
  paintSetup();
  await gpuSetupState();
}
$("load-artifixer").onclick = () => reloadSetup(true);
$("load-baseline").onclick = () => reloadSetup(false);
gpuSetupState();
document.querySelectorAll(".stepper input").forEach(input => {
  input.addEventListener("change", () => snapInput(input));
  input.addEventListener("blur", () => snapInput(input));
});
document.querySelectorAll(".nudge button").forEach(button => {
  button.addEventListener("click", () => {
    bumpInput(button.closest(".stepper").querySelector("input"), Number(button.dataset.step));
  });
});
$("run-form").addEventListener("keydown", event => {
  if (event.key === "Enter") snapSteppers();
}, true);
$("start").addEventListener("click", snapSteppers, true);
snapSteppers();
</script>
