<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>splat-explorer · repair review</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root {
    --bg: #101318; --panel: #171c24; --panel2: #1e2530; --border: #2a3342;
    --text: #dce3ee; --dim: #8b97a8; --accent: #5aa2ff; --ok: #45c98b;
    --warn: #e6b450; --err: #ef6a6a; --mono: ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 14px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
         display: flex; flex-direction: column; overflow: hidden; }
  header { display: flex; align-items: center; gap: 14px; padding: 10px 16px;
           background: var(--panel); border-bottom: 1px solid var(--border);
           flex: none; flex-wrap: wrap; }
  header h1 { font-size: 15px; margin: 0; font-weight: 600; }
  header h1 span { color: var(--dim); font-weight: 400; }
  .pill { padding: 2px 10px; border-radius: 20px; font-size: 12px;
          background: var(--panel2); border: 1px solid var(--border); color: var(--dim); }
  .pill.ok { color: var(--ok); border-color: var(--ok); }
  .pill.busy { color: var(--warn); border-color: var(--warn); }
  .pill.err { color: var(--err); border-color: var(--err); }
  .spacer { flex: 1; }
  a { color: var(--accent); text-decoration: none; }
  button { border: 0; border-radius: 6px; padding: 7px 16px; font-size: 13px;
           font-weight: 600; cursor: pointer; }
  button:disabled { opacity: .45; cursor: default; }
  #btn-replay { background: var(--accent); color: #0b1220; }
  #btn-view { background: #2d6a4f; color: #fff; }
  #btn-reset { background: var(--panel2); color: var(--text); border: 1px solid var(--border) !important; }
  #btn-stop { background: var(--err); color: #fff; }
  .ghost { background: var(--panel2); color: var(--text); border: 1px solid var(--border) !important; }
  .toggle { display: flex; border: 1px solid var(--border); border-radius: 6px; overflow: hidden; }
  .toggle button { border-radius: 0; background: var(--panel2); color: var(--dim);
                   font-weight: 600; padding: 7px 14px; }
  .toggle button.on { background: var(--accent); color: #0b1220; }
  #controls { display: flex; gap: 8px; align-items: end; padding: 10px 16px;
              background: var(--panel); border-bottom: 1px solid var(--border);
              flex: none; flex-wrap: wrap; }
  #controls label { display: flex; flex-direction: column; gap: 3px; font-size: 11px; color: var(--dim); }
  #controls select {
    background: var(--panel2); color: var(--text); border: 1px solid var(--border);
    border-radius: 6px; padding: 6px 8px; font-size: 13px; min-width: 220px; }
  #stats { display: flex; gap: 18px; padding: 8px 16px; font-size: 12px; color: var(--dim);
           border-bottom: 1px solid var(--border); flex: none; flex-wrap: wrap; }
  #stats b { color: var(--text); font-family: var(--mono); font-weight: 600; }
  #msg { font-size: 12px; color: var(--warn); padding: 6px 16px; flex: none; }
  #msg:empty { display: none; padding: 0; }
  label.chk {
    flex-direction: row !important; align-items: center; gap: 8px !important;
    font-size: 12.5px !important; color: var(--dim); white-space: nowrap;
    cursor: pointer; user-select: none;
  }
  label.chk input[type="checkbox"] {
    appearance: none; -webkit-appearance: none;
    width: 14px; height: 14px; min-width: 14px; margin: 0; padding: 0;
    border: 1px solid var(--border); border-radius: 4px;
    background: var(--panel2); cursor: pointer; flex: none;
    display: grid; place-content: center;
  }
  label.chk input[type="checkbox"]:checked {
    background: var(--accent); border-color: var(--accent);
  }
  label.chk input[type="checkbox"]:checked::after {
    content: ""; width: 7px; height: 4px;
    border: 1.6px solid #0b1220; border-top: 0; border-right: 0;
    transform: rotate(-45deg) translate(0.5px, -1px);
  }
  #layout { display: grid; grid-template-columns: 260px 1fr 1fr;
            flex: 1; min-height: 0; }
  #views { overflow-y: auto; border-right: 1px solid var(--border); }
  .view { display: flex; gap: 10px; padding: 8px 10px; cursor: pointer;
          border-bottom: 1px solid var(--border); }
  .view:hover { background: var(--panel); }
  .view.sel { background: var(--panel2); box-shadow: inset 3px 0 0 var(--accent); }
  .view img { width: 72px; height: 54px; object-fit: cover; border-radius: 4px;
              background: #000; flex: none; }
  .view .info { min-width: 0; font-size: 12px; }
  .view .act { font-family: var(--mono); font-size: 12px; }
  .view .times { color: var(--dim); font-size: 11px; }
  #compare {
    display: flex; flex-direction: column; min-width: 0; min-height: 0;
    overflow-y: auto; background: #000;
  }
  #compare-stage {
    position: relative; flex: 1 0 100%; min-height: 100%; background: #000;
  }
  #compare-img {
    position: absolute; inset: 0; width: 100%; height: 100%;
    object-fit: contain; background: #000; display: block;
  }
  #compare-img[hidden], #compare-empty[hidden] { display: none; }
  #compare-empty {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
  }
  #compare-caption {
    position: absolute; left: 12px; bottom: 12px;
    font-size: 11px; color: var(--dim); letter-spacing: .02em;
    background: rgba(16, 19, 24, .78); border: 1px solid var(--border);
    padding: 4px 9px; border-radius: 6px; pointer-events: none;
  }
  #compare-nav {
    position: absolute; right: 12px; bottom: 12px;
    display: flex; gap: 6px;
  }
  #compare-nav button {
    width: 34px; height: 34px; padding: 0; border-radius: 8px;
    background: rgba(16, 19, 24, .78); color: var(--text);
    border: 1px solid var(--border) !important; font-size: 18px; font-weight: 500;
    line-height: 1;
  }
  #compare-nav button:hover:not(:disabled) { background: #243044; color: #fff; }
  #compare-nav button.on { color: var(--accent); border-color: var(--accent) !important; }
  #compare-nav[hidden] { display: none; }
  #compare-meta {
    flex: none; margin: 0; border: 0; border-top: 1px solid var(--border);
    border-radius: 0; background: var(--panel);
  }
  #compare-meta summary {
    padding: 8px 14px; cursor: pointer; font-size: 12px; color: var(--dim);
    list-style: none; display: flex; align-items: center; gap: 8px;
  }
  #compare-meta summary::-webkit-details-marker { display: none; }
  #compare-meta summary::before { content: "▸"; font-size: 10px; color: var(--dim); }
  #compare-meta[open] summary::before { content: "▾"; }
  .kv { display: grid; grid-template-columns: 110px 1fr; gap: 3px 12px;
        font-size: 13px; margin: 0; padding: 4px 14px 14px; }
  .kv .k { color: var(--dim); }
  .kv .v { font-family: var(--mono); font-size: 12.5px; word-break: break-all; }
  #viser-wrap { display: flex; flex-direction: column; min-width: 0; position: relative;
                border-left: 1px solid var(--border); }
  #viser-wrap .bar {
    position: absolute; top: 0; left: 0; right: 0; z-index: 2;
    display: flex; align-items: center; gap: 8px; padding: 6px 10px;
    background: linear-gradient(to bottom, rgba(16,19,24,.82), transparent);
    font-size: 11px; color: var(--dim); pointer-events: none;
  }
  #viser-wrap iframe { flex: 1; width: 100%; border: 0; background: #000; }
  .empty { color: var(--dim); padding: 30px; text-align: center; }
  .badge { display: inline-block; font-size: 10px; border-radius: 4px; padding: 0 5px;
           margin-left: 5px; font-weight: 700; }
  .badge.ok { background: var(--ok); color: #0a2417; }
  .badge.err { background: var(--err); color: #fff; }
  .hint { font-size: 11px; color: var(--dim); max-width: 420px; }
  @media (max-width: 1100px) {
    #layout { grid-template-columns: 240px 1fr; }
    #viser-wrap { display: none; }
  }
</style>
</head>
<body>
<header>
  <h1>splat-explorer <span>· repair review</span></h1>
  <span id="pill-job" class="pill">idle</span>
  <span id="pill-show" class="pill">viser: catalog</span>
  <span class="spacer"></span>
  <a href="/">episode dashboard</a>
  <a href="/spectator" target="_blank">spectator (HD) ↗</a>
</header>

<div id="controls">
  <label>episode
    <select id="in-ep"></select>
  </label>
  <label>backend
    <select id="in-backend" title="Which 3D lift to run. Auto picks CUDA, then gsplat-mlx, then the CPU stamp. gsplat-mlx trains a small nearby subset so Metal does not hit its resource cap.">
      <option value="auto">Auto (best available)</option>
      <option value="gsplat-mlx">gsplat-mlx (Apple Silicon / Metal)</option>
      <option value="gsfix-gsplat">gsplat CUDA (GSFix3D)</option>
      <option value="cpu-project">CPU color stamp</option>
      <option value="cpu-photometric">CPU photometric (no rasterizer)</option>
    </select>
  </label>
  <label class="chk" title="Re-import splat_explorer.repair so code edits apply without restarting the dashboard process.">
    <input type="checkbox" id="in-reload" checked>
    reload repair.py
  </label>
  <div style="display:flex;gap:8px;align-self:end">
    <button id="btn-replay">Replay all views</button>
    <button id="btn-view" title="Paint this regenerated view onto the splat, then keep a geometry-only refine until you press Stop (max 1 hour). Continues from scene_repaired.ply when it exists.">Repair this view</button>
    <button id="btn-reset" title="Copy scene_original.ply over scene_repaired.ply and show the original splat.">Reset repair</button>
    <button id="btn-stop" disabled>Stop</button>
  </div>
  <div class="toggle" id="show-toggle" title="Swap the 3D visor between the frozen original copy and the repaired PLY. Blocked while an episode is capturing.">
    <button type="button" data-which="original">Original</button>
    <button type="button" data-which="repaired">Repaired</button>
  </div>
  <span class="hint"></span>
</div>

<div id="stats">
  <span>views <b id="st-views">–</b></span>
  <span>done <b id="st-done">–</b></span>
  <span>original ply <b id="st-orig">–</b></span>
  <span>repaired ply <b id="st-rep">–</b></span>
  <span>scene <b id="st-scene">–</b></span>
  <span>lift <b id="st-backend">–</b></span>
</div>
<div id="msg"></div>

<div id="layout">
  <div id="views"><div class="empty">Pick an episode that has regenerated RGB frames.</div></div>
  <div id="compare">
    <div id="compare-stage">
      <div id="compare-empty" class="empty">Select a regenerated view.</div>
      <img id="compare-img" alt="repair compare" hidden>
      <div id="compare-caption" hidden></div>
      <div id="compare-nav">
        <button type="button" id="btn-img-orig" title="Original render">‹</button>
        <button type="button" id="btn-img-rep" title="Repaired RGB">›</button>
      </div>
    </div>
    <details id="compare-meta">
      <summary>step details</summary>
      <div class="kv" id="compare-kv"></div>
    </details>
  </div>
  <div id="viser-wrap">
    <div class="bar"><b>3D visor</b><span class="spacer"></span><span id="viser-hint">original / repaired toggle</span></div>
    <iframe id="viser" title="Viser splat view" allow="autoplay"></iframe>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
let episodes = [];
let snapshot = null;
let selectedStep = null;
let selectedEp = "";
let compareKind = "original";
let visorPly = null; // null = catalog, "original" | "repaired" = episode PLY
let visorPublished = null;
let visorSeq = 0;
let tickBusy = false;
let looked = { ep: "", step: null };
let sceneSyncedEp = "";
let lastJobStatus = "";
let pollTimer = null;

function esc(s) {
  return String(s ?? "").replace(/[&<>"']/g, c => ({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
  }[c]));
}
function fmtBytes(n) {
  if (!n) return "–";
  if (n < 1024) return n + " B";
  if (n < 1024 * 1024) return (n / 1024).toFixed(0) + " KB";
  return (n / 1024 / 1024).toFixed(1) + " MB";
}
function jobActive(job) {
  const st = job?.status;
  return st === "running" || st === "stopping";
}
function setPolling(on) {
  if (on) {
    if (pollTimer == null) pollTimer = setInterval(() => tick({ poll: true }), 1000);
    return;
  }
  if (pollTimer != null) {
    clearInterval(pollTimer);
    pollTimer = null;
  }
}
async function post(url, body, { silent = false } = {}) {
  const r = await fetch(url, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(body || {}),
  });
  const data = await r.json().catch(() => ({}));
  if (!silent) $("msg").textContent = data.message || data.error || "";
  return data;
}

function jobPill(job) {
  const el = $("pill-job");
  const st = job?.status || "idle";
  el.textContent = st;
  el.className = "pill" + (st === "running" || st === "stopping" ? " busy"
    : st === "error" ? " err" : st === "completed" ? " ok" : "");
}

function renderBackends() {
  const sel = $("in-backend");
  if (!sel) return;
  const info = snapshot?.backends;
  const list = info?.backends || [];
  const prev = sel.value || "auto";
  if (!list.length) {
    if (!sel.options.length) {
      sel.innerHTML = '<option value="auto">Auto</option>';
    }
    return;
  }
  const signature = list.map(b => `${b.id}:${b.available}`).join("|");
  if (sel.dataset.sig === signature && sel.options.length) return;
  sel.dataset.sig = signature;
  sel.innerHTML = list.map(b => {
    const mark = b.available ? "" : " — unavailable";
    return `<option value="${esc(b.id)}" title="${esc(b.detail || "")}">${esc(b.label)}${mark}</option>`;
  }).join("");
  if ([...sel.options].some(o => o.value === prev)) sel.value = prev;
  else sel.value = "auto";
  const chosen = list.find(b => b.id === sel.value);
  sel.title = chosen?.detail || "";
}

function renderEpisodes() {
  const sel = $("in-ep");
  const live = snapshot?.live_episode;
  const sig = episodes.map(e =>
    `${e.id}:${e.n_regen}:${e.has_repaired_ply}:${e.id === live ? 1 : 0}`
  ).join("|");
  if (sel.dataset.sig === sig && sel.options.length) {
    selectedEp = sel.value;
    return;
  }
  sel.dataset.sig = sig;
  const prev = selectedEp || sel.value;
  sel.innerHTML = episodes.map(e => {
    const bits = [];
    if (e.n_regen) bits.push(e.n_regen + " regen");
    if (e.has_repaired_ply) bits.push("repaired ply");
    if (e.id === live) bits.push("live");
    const extra = bits.length ? ` (${bits.join(", ")})` : "";
    return `<option value="${esc(e.id)}">${esc(e.id)}${extra}</option>`;
  }).join("");
  if (!episodes.length) sel.innerHTML = '<option value="">— no episodes —</option>';
  if (prev && [...sel.options].some(o => o.value === prev)) sel.value = prev;
  else if (live && [...sel.options].some(o => o.value === live)) sel.value = live;
  selectedEp = sel.value;
}

function viewBadge(v) {
  const r = (snapshot?.job?.results || []).find(x => x.step === v.step) || v.repair;
  const st = r?.status || v.repair_status;
  return st ? `<span class="badge ${st === "ok" ? "ok" : "err"}">${esc(st)}</span>` : "";
}

function bindViewClicks(box) {
  box.querySelectorAll(".view").forEach(el => {
    el.onclick = () => {
      selectedStep = Number(el.dataset.step);
      looked = { ep: "", step: null };
      renderViews();
      renderCompare();
      maybeLook();
    };
  });
}

function renderStats() {
  const ep = snapshot?.episode;
  const views = ep?.views || [];
  $("st-views").textContent = views.length || "–";
  $("st-orig").textContent = ep?.original_ply ? fmtBytes(ep.original_ply.bytes) : "–";
  $("st-rep").textContent = ep?.repaired_ply ? fmtBytes(ep.repaired_ply.bytes) : "–";
  $("st-scene").textContent = snapshot?.episode_scene_label
    || snapshot?.episode_scene || snapshot?.scene_id || "–";
  const detected = snapshot?.backends?.detected;
  const jobBackend = snapshot?.job?.backend;
  $("st-backend").textContent = jobBackend && jobBackend !== "auto"
    ? jobBackend
    : (detected || "–");
  $("st-done").textContent = snapshot?.job?.n_done != null
    ? `${snapshot.job.n_done}/${snapshot.job.n_views || 0}` : "–";
}

function renderViews() {
  const ep = snapshot?.episode;
  const box = $("views");
  const views = ep?.views || [];
  renderStats();
  if (!views.length) {
    box.dataset.steps = "";
    box.innerHTML = '<div class="empty">No regenerated RGB in this episode.</div>';
    return;
  }
  const stepKey = views.map(v => `${v.step}:${v.repaired_url}`).join(",");
  if (box.dataset.steps === stepKey) {
    views.forEach(v => {
      const el = box.querySelector(`.view[data-step="${v.step}"]`);
      if (!el) return;
      el.classList.toggle("sel", v.step === selectedStep);
      const act = el.querySelector(".act");
      const html = `step ${v.step}${viewBadge(v)}`;
      if (act && act.innerHTML !== html) act.innerHTML = html;
    });
    return;
  }
  box.dataset.steps = stepKey;
  box.innerHTML = views.map(v => {
    return `<div class="view${v.step === selectedStep ? " sel" : ""}" data-step="${v.step}">
      <img src="${esc(v.repaired_url)}" alt="">
      <div class="info">
        <div class="act">step ${v.step}${viewBadge(v)}</div>
        <div class="times">${esc(v.pose || "")}</div>
      </div>
    </div>`;
  }).join("");
  bindViewClicks(box);
}

function currentView() {
  const views = snapshot?.episode?.views || [];
  return views.find(x => x.step === selectedStep) || views[0] || null;
}

function availableKinds(v) {
  const kinds = [];
  if (v?.rendered_url) kinds.push("original");
  if (v?.repaired_url) kinds.push("repaired");
  if (v?.lifted_url) kinds.push("lifted");
  return kinds;
}

function renderCompare() {
  const v = currentView();
  const img = $("compare-img");
  const empty = $("compare-empty");
  const caption = $("compare-caption");
  if (!v) {
    img.hidden = true;
    caption.hidden = true;
    empty.hidden = false;
    $("compare-nav").hidden = true;
    $("compare-kv").innerHTML = "";
    delete $("compare-kv").dataset.key;
    return;
  }
  if (selectedStep == null) selectedStep = v.step;
  const kinds = availableKinds(v);
  if (!kinds.includes(compareKind)) compareKind = kinds[0] || "original";
  empty.hidden = true;
  img.hidden = false;
  caption.hidden = false;
  const src = compareKind === "repaired" ? v.repaired_url
    : compareKind === "lifted" ? v.lifted_url
    : v.rendered_url;
  if (img.dataset.key !== src) {
    img.src = src;
    img.dataset.key = src;
  }
  const labels = {
    original: "original render",
    repaired: "diffusion-fixed RGB",
    lifted: "3D after (GSFix lift)",
  };
  caption.textContent = `${labels[compareKind] || compareKind} · step ${v.step}`;
  $("btn-img-orig").classList.toggle("on", compareKind === "original");
  $("btn-img-rep").classList.toggle("on", compareKind === "repaired" || compareKind === "lifted");
  $("btn-img-orig").disabled = kinds.length < 2;
  $("btn-img-rep").disabled = kinds.length < 2;
  $("compare-nav").hidden = false;
  const r = (snapshot?.job?.results || []).find(x => x.step === v.step) || v.repair || {};
  const kvKey = [
    v.step, compareKind, src, r.status, r.backend, r.n_iters, r.seconds, r.error || "",
  ].join("|");
  if ($("compare-kv").dataset.key === kvKey) return;
  $("compare-kv").dataset.key = kvKey;
  $("compare-kv").innerHTML = `
      <span class="k">pose</span><span class="v">${esc(v.pose || "")}</span>
      <span class="k">3D repair</span><span class="v">${esc(r.status || "not run")}</span>
      <span class="k">backend</span><span class="v">${esc(r.backend || "–")}</span>
      <span class="k">iters</span><span class="v">${r.n_iters ?? "–"}</span>
      <span class="k">train res</span><span class="v">${r.train_width && r.train_height ? `${r.train_width}×${r.train_height}` : "–"}</span>
      <span class="k">visible</span><span class="v">${r.n_visible ?? "–"}</span>
      <span class="k">spawned</span><span class="v">${r.n_spawned ?? "–"}</span>
      <span class="k">L1 before</span><span class="v">${r.l1_before ?? "–"}</span>
      <span class="k">L1 after</span><span class="v">${r.l1_after ?? "–"}</span>
      <span class="k">seconds</span><span class="v">${r.seconds ?? "–"}</span>
      <span class="k">gaussians</span><span class="v">${r.n_gaussians ?? "–"}</span>
      ${r.error ? `<span class="k">error</span><span class="v">${esc(r.error)}</span>` : ""}`;
}

function shiftKind(dir) {
  const v = currentView();
  const kinds = availableKinds(v);
  if (kinds.length < 2) return;
  let i = kinds.indexOf(compareKind);
  if (i < 0) i = 0;
  setCompareKind(kinds[(i + dir + kinds.length) % kinds.length]);
}

function setCompareKind(which, { syncViser = false } = {}) {
  if (which === "lifted") compareKind = "lifted";
  else if (which === "repaired") compareKind = "repaired";
  else compareKind = "original";
  renderCompare();
  renderShow();
  if (!syncViser || !selectedEp) return;
  const plyWhich = compareKind === "original" ? "original" : "repaired";
  showVisorPly(plyWhich);
}

async function showVisorPly(which, { force = false } = {}) {
  const ep = snapshot?.episode;
  const hasPly = which === "repaired" ? ep?.repaired_ply : ep?.original_ply;
  if (!selectedEp || !hasPly) {
    $("msg").textContent = which === "repaired"
      ? "No repaired PLY yet — run Replay 3D repair first."
      : "No original PLY yet — run Replay 3D repair first.";
    return;
  }
  if (!force && visorPublished === which && snapshot?.showing === which
      && snapshot?.showing_episode === selectedEp) {
    visorPly = which;
    renderShow();
    return;
  }
  const seq = ++visorSeq;
  visorPly = which;
  renderShow();
  const data = await post("/api/repair/show", {
    episode: selectedEp, which, force,
  }, { silent: true });
  if (seq !== visorSeq) return;
  if (data && data.ok === false) {
    visorPly = snapshot?.showing || visorPly;
    if (data.message || data.error) $("msg").textContent = data.message || data.error;
  } else {
    visorPublished = which;
  }
  renderShow();
}

function maybeLook() {
  if (!selectedEp || selectedStep == null) return;
  if (looked.ep === selectedEp && looked.step === selectedStep) return;
  looked = { ep: selectedEp, step: selectedStep };
  post("/api/repair/look", { episode: selectedEp, step: selectedStep }, { silent: true });
}

async function syncEpisodeScene() {
  const ep = snapshot?.episode;
  if (!selectedEp || !ep) return;
  if (sceneSyncedEp === selectedEp) {
    maybeLook();
    return;
  }
  sceneSyncedEp = selectedEp;
  if (!visorPly) {
    if ((snapshot.showing === "original" || snapshot.showing === "repaired")
        && snapshot.showing_episode === selectedEp) {
      visorPly = snapshot.showing;
    } else if (ep.repaired_ply) {
      visorPly = "repaired";
    } else if (ep.original_ply) {
      visorPly = "original";
    }
  }
  if (visorPly) {
    const showingThis = snapshot.showing_episode === selectedEp && snapshot.showing === visorPly;
    if (showingThis) visorPublished = visorPly;
    else await showVisorPly(visorPly, { force: false });
    maybeLook();
    return;
  }
  const want = snapshot.episode_scene;
  const catalogOk = Boolean(
    want
    && snapshot.scene_id === want
    && (snapshot.scene_status === "ready" || snapshot.scene_status === "loading"),
  );
  if (!catalogOk && want) {
    await post("/api/repair/focus", { episode: selectedEp }, { silent: true });
  }
  maybeLook();
}

function renderShow() {
  const which = snapshot?.showing;
  const sameEp = snapshot?.showing_episode === selectedEp;
  const catalogOk = snapshot?.scene_id === snapshot?.episode_scene
    && snapshot?.scene_status === "ready"
    && !which;
  const label = snapshot?.episode_scene_label || snapshot?.episode_scene;
  const visorWhich = visorPly || ((which && sameEp) ? which : null);
  $("pill-show").textContent = visorWhich
    ? `viser: ${visorWhich} ply`
    : (label ? `viser: ${label}` : "viser: catalog");
  $("pill-show").className = "pill" + (visorWhich || catalogOk ? " ok" : "");
  const hint = $("viser-hint");
  if (hint) {
    hint.textContent = visorWhich
      ? `${visorWhich} ply · click Original / Repaired to swap`
      : (label ? `catalog: ${label}` : "original / repaired toggle");
  }
  const ep = snapshot?.episode;
  document.querySelectorAll("#show-toggle button").forEach(btn => {
    const target = btn.dataset.which;
    btn.classList.toggle("on", target === visorWhich);
    btn.disabled = target === "repaired" ? !ep?.repaired_ply : !ep?.original_ply;
  });
  const busy = snapshot?.job?.status === "running" || snapshot?.job?.status === "stopping";
  $("btn-replay").disabled = busy || !selectedEp;
  const viewBtn = $("btn-view");
  if (viewBtn) viewBtn.disabled = busy || !selectedEp || selectedStep == null;
  const resetBtn = $("btn-reset");
  if (resetBtn) resetBtn.disabled = busy || !selectedEp || !ep?.original_ply;
  $("btn-stop").disabled = !busy;
}

async function refreshEpisodes() {
  const r = await fetch("/api/repair/episodes");
  const data = await r.json();
  episodes = data.episodes || [];
  renderEpisodes();
}

async function tick({ poll = false } = {}) {
  if (tickBusy) return;
  tickBusy = true;
  try {
    const ep = $("in-ep").value;
    selectedEp = ep;
    const r = await fetch("/api/repair" + (ep ? `?episode=${encodeURIComponent(ep)}` : ""));
    snapshot = await r.json();
    if (selectedStep == null && snapshot?.episode?.views?.length) {
      selectedStep = snapshot.episode.views[0].step;
    }
    jobPill(snapshot.job);
    renderBackends();
    if (snapshot?.job?.message) $("msg").textContent = snapshot.job.message;
    const status = snapshot?.job?.status || "idle";
    const wasActive = jobActive({ status: lastJobStatus });
    const nowActive = jobActive(snapshot.job);
    lastJobStatus = status;
    if (!poll && visorPly == null && snapshot?.episode?.repaired_ply
        && (status === "running" || status === "completed")) {
      visorPly = "repaired";
    }
    renderShow();
    renderViews();
    renderCompare();
    if (!poll) await syncEpisodeScene();
    if (wasActive && !nowActive && visorPly === "repaired" && snapshot?.episode?.repaired_ply) {
      await showVisorPly("repaired", { force: true });
    }
    setPolling(nowActive);
    if (wasActive && !nowActive) await refreshEpisodes();
  } finally {
    tickBusy = false;
  }
}

$("in-ep").onchange = () => {
  selectedStep = null;
  visorPly = null;
  visorPublished = null;
  visorSeq += 1;
  sceneSyncedEp = "";
  looked = { ep: "", step: null };
  compareKind = "original";
  $("msg").textContent = "";
  tick();
};
$("btn-replay").onclick = async () => {
  if (!selectedEp) return;
  visorPly = "repaired";
  await post("/api/repair/start", {
    episode: selectedEp,
    reload_code: $("in-reload").checked,
    backend: $("in-backend").value || "auto",
    resume: true,
  });
  tick();
};
$("btn-view").onclick = async () => {
  if (!selectedEp || selectedStep == null) return;
  visorPly = "repaired";
  compareKind = "repaired";
  await post("/api/repair/start", {
    episode: selectedEp,
    step: selectedStep,
    max_seconds: 3600,
    reload_code: $("in-reload").checked,
    backend: $("in-backend").value || "auto",
    resume: true,
  });
  tick();
};
$("btn-reset").onclick = async () => {
  if (!selectedEp) return;
  visorPly = "original";
  compareKind = "original";
  sceneSyncedEp = selectedEp;
  await post("/api/repair/reset", { episode: selectedEp });
  tick();
};
$("btn-stop").onclick = async () => {
  await post("/api/repair/stop");
  tick();
};
document.querySelectorAll("#show-toggle button").forEach(btn => {
  btn.onclick = () => {
    if (!selectedEp) return;
    const which = btn.dataset.which;
    compareKind = which === "repaired" ? "repaired" : "original";
    renderCompare();
    showVisorPly(which, { force: false });
  };
});
$("btn-img-orig").onclick = () => shiftKind(-1);
$("btn-img-rep").onclick = () => shiftKind(1);
document.addEventListener("keydown", e => {
  if (e.target && /input|select|textarea/i.test(e.target.tagName)) return;
  if (e.key === "ArrowLeft") shiftKind(-1);
  if (e.key === "ArrowRight") shiftKind(1);
});

fetch("/api/state").then(r => r.json()).then(s => {
  $("viser").src = s.defaults?.viewer_url || "http://localhost:8080";
}).catch(() => { $("viser").src = "http://localhost:8080"; });

refreshEpisodes().then(() => tick());
</script>
</body>
</html>
