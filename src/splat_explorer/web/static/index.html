<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>splat-explorer · episode dashboard</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root {
    --bg: #101318; --panel: #171c24; --panel2: #1e2530; --border: #2a3342;
    --text: #dce3ee; --dim: #8b97a8; --accent: #5aa2ff; --ok: #45c98b;
    --warn: #e6b450; --err: #ef6a6a; --mono: ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 14px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
         display: flex; flex-direction: column; overflow: hidden; }
  header { display: flex; align-items: center; gap: 14px; padding: 10px 16px;
           background: var(--panel); border-bottom: 1px solid var(--border);
           flex: none; flex-wrap: wrap; }
  header h1 { font-size: 15px; margin: 0; font-weight: 600; }
  header h1 span { color: var(--dim); font-weight: 400; }
  .pill { padding: 2px 10px; border-radius: 20px; font-size: 12px;
          background: var(--panel2); border: 1px solid var(--border); color: var(--dim); }
  .pill.ok { color: var(--ok); border-color: var(--ok); }
  .pill.busy { color: var(--warn); border-color: var(--warn); }
  .pill.err { color: var(--err); border-color: var(--err); }
  .spacer { flex: 1; }
  a { color: var(--accent); text-decoration: none; }

  #controls { display: flex; gap: 8px; align-items: end; padding: 10px 16px;
              background: var(--panel); border-bottom: 1px solid var(--border);
              flex: none; flex-wrap: wrap; }
  #controls label { display: flex; flex-direction: column; gap: 3px; font-size: 11px; color: var(--dim); }
  #controls input:not([type="checkbox"]), #controls select {
    background: var(--panel2); color: var(--text); border: 1px solid var(--border);
    border-radius: 6px; padding: 6px 8px; font-size: 13px; min-width: 90px; }
  #controls input:not([type="checkbox"]):focus, #controls select:focus { outline: 1px solid var(--accent); }
  button { border: 0; border-radius: 6px; padding: 7px 16px; font-size: 13px;
           font-weight: 600; cursor: pointer; }
  button:disabled { opacity: .45; cursor: default; }
  #btn-start { background: var(--accent); color: #0b1220; }
  #btn-stop { background: var(--err); color: #fff; }
  .ghost { background: var(--panel2); color: var(--text); border: 1px solid var(--border) !important; }
  #stats { display: flex; gap: 18px; padding: 8px 16px; font-size: 12px; color: var(--dim);
           border-bottom: 1px solid var(--border); flex: none; flex-wrap: wrap; }
  #stats b { color: var(--text); font-family: var(--mono); font-weight: 600; }
  #msg { font-size: 12px; color: var(--warn); padding: 6px 16px; flex: none; }
  #msg:empty { display: none; padding: 0; }
  .btn-row { display: flex; gap: 8px; align-items: center; align-self: end; }
  .settings-wrap {
    position: relative; display: flex; flex-direction: column; gap: 3px;
    font-size: 11px; color: var(--dim); align-self: end;
  }
  #btn-settings {
    background: var(--panel2); color: var(--text);
    border: 1px solid var(--border) !important;
    border-radius: 6px; padding: 6px 10px; font-size: 13px; font-weight: 400;
    min-width: 110px; text-align: left;
    display: inline-flex; align-items: center; justify-content: space-between; gap: 10px;
  }
  #btn-settings:hover { color: var(--text); background: #243044; }
  #btn-settings[aria-expanded="true"] { outline: 1px solid var(--accent); }
  #btn-settings .caret { font-size: 10px; color: var(--dim); transition: transform .12s ease; }
  .settings-wrap.open #btn-settings .caret { transform: rotate(180deg); }
  .settings-menu {
    display: none; position: absolute; top: calc(100% + 4px); left: 0; z-index: 50;
    min-width: 228px; background: var(--panel); border: 1px solid var(--border);
    border-radius: 8px; padding: 6px;
    box-shadow: 0 10px 28px rgba(0,0,0,.45);
  }
  .settings-wrap.open .settings-menu { display: block; }
  .settings-menu .chk {
    margin: 0; padding: 6px 8px; border-radius: 6px; width: 100%;
    color: var(--text) !important;
  }
  .settings-menu .chk:hover { background: var(--panel2); }
  .settings-menu .hint {
    font-size: 10px; color: var(--dim); margin: 8px 8px 3px;
    letter-spacing: .06em; text-transform: uppercase;
  }
  .settings-menu .hint:first-child { margin-top: 2px; }
  .icon-btn {
    background: transparent; color: var(--dim);
    border: 1px solid var(--border) !important;
    padding: 6px 7px; align-self: end; font-weight: 400; line-height: 0;
  }
  .icon-btn:hover:not(:disabled) { color: var(--text); background: var(--panel2); }
  .icon-btn svg { display: block; width: 15px; height: 15px; }

  #layout { display: grid; grid-template-columns: 400px 1fr; gap: 0;
            flex: 1; min-height: 0; }
  #steps { overflow-y: auto; border-right: 1px solid var(--border); }
  .step { display: flex; gap: 10px; padding: 8px 10px; cursor: pointer;
          border-bottom: 1px solid var(--border); }
  .step:hover { background: var(--panel); }
  .step.sel { background: var(--panel2); box-shadow: inset 3px 0 0 var(--accent); }
  .step img { width: 96px; height: 72px; object-fit: cover; border-radius: 4px;
              background: #000; flex: none; }
  .step .info { min-width: 0; font-size: 12px; }
  .step .act { font-family: var(--mono); font-size: 12px; white-space: nowrap;
               overflow: hidden; text-overflow: ellipsis; }
  .step .act .name { color: var(--accent); font-weight: 700; }
  .step .times { color: var(--dim); font-size: 11px; }
  .badge { display: inline-block; font-size: 10px; border-radius: 4px; padding: 0 5px;
           margin-left: 5px; font-weight: 700; }
  .badge.fb { background: var(--err); color: #fff; }
  .badge.art { background: var(--warn); color: #22180a; }
  .badge.map { background: var(--accent); color: #0b1220; }
  .badge.done { background: var(--ok); color: #0a2417; }

  #detail { overflow-y: auto; padding: 14px 18px; }
  #detail img.frame { max-width: 100%; max-height: 58vh; width: auto; height: auto;
                      object-fit: contain; border-radius: 6px;
                      border: 1px solid var(--border); background: #000; display: block; }
  .frames { display: grid; gap: 10px; grid-template-columns: 1fr 1fr; }
  .frames.n1 { grid-template-columns: 1fr; }
  .frames.n2 { grid-template-columns: 1fr 1fr; }
  .frames.n3, .frames.n4 { grid-template-columns: 1fr 1fr; }
  @media (max-width: 1100px) { .frames, .frames.n2, .frames.n3, .frames.n4 { grid-template-columns: 1fr; } }
  .frames figure { margin: 0; }
  .frames figcaption { font-size: 11px; color: var(--dim); margin: 0 0 5px; letter-spacing: .02em; }
  .frames img.frame { max-height: 46vh; width: 100%; height: auto; object-fit: contain; }
  .frames.n2 img.frame { max-height: 52vh; }
  .frames.n3 img.frame, .frames.n4 img.frame { max-height: 34vh; }
  .step img.depth-thumb { width: 48px; opacity: .9; }
  .kv { display: grid; grid-template-columns: 110px 1fr; gap: 3px 12px;
        font-size: 13px; margin: 12px 0; }
  .kv .k { color: var(--dim); }
  .kv .v { font-family: var(--mono); font-size: 12.5px; word-break: break-all; }
  details { margin: 10px 0; border: 1px solid var(--border); border-radius: 6px;
            background: var(--panel); }
  details summary { padding: 7px 12px; cursor: pointer; font-size: 12.5px; color: var(--dim); }
  details pre { margin: 0; padding: 10px 12px; border-top: 1px solid var(--border);
                font-family: var(--mono); font-size: 12px; white-space: pre-wrap;
                word-break: break-word; max-height: 45vh; overflow-y: auto; }
  .attempt { border-top: 1px solid var(--border); padding: 6px 12px; font-size: 12px; }
  .attempt .meta { color: var(--dim); }
  #artifacts { margin-top: 6px; }
  .artifact { border: 1px solid var(--warn); border-radius: 6px; padding: 8px 12px;
              margin: 6px 0; font-size: 12.5px; background: var(--panel); }
  .empty { color: var(--dim); padding: 30px; text-align: center; }
  /* Capture visor: iframe stays at the selected VLM size (4:3). The window
     is only visually scaled so WebGL still renders 960×720 (or whatever
     you picked) while looking like a small pip. Never display:none. */
  #viser-pip {
    display: none; position: fixed; z-index: 40;
    right: 16px; bottom: 16px;
    background: #000; border: 1px solid var(--border); border-radius: 8px;
    overflow: hidden; flex-direction: column;
  }
  #viser-pip.live { display: flex; }
  #viser-pip .bar {
    display: flex; align-items: center; gap: 8px; flex: none;
    padding: 5px 8px; background: var(--panel);
    border-bottom: 1px solid var(--border); cursor: grab; user-select: none;
    font-size: 11px; color: var(--dim);
  }
  #viser-pip .bar b { color: var(--text); font-weight: 600; }
  #viser-pip .bar .spacer { flex: 1; }
  #viser-pip .bar button { padding: 3px 8px; font-size: 11px; }
  #viser-pip .body { background: #000; position: relative; overflow: hidden; flex: none; }
  #viser-pip .stage { transform-origin: top left; }
  #viser-pip iframe { border: 0; display: block; }
  #viser-pip .resize {
    position: absolute; right: 0; bottom: 0; width: 18px; height: 18px;
    cursor: nwse-resize; z-index: 3;
  }
  #viser-pip .resize::after {
    content: ""; position: absolute; right: 5px; bottom: 5px;
    width: 7px; height: 7px;
    border-right: 2px solid var(--dim); border-bottom: 2px solid var(--dim);
  }
  /* Docked strip: bar + a peek of the view about as tall as the bar.
     The iframe keeps rendering at capture size; overflow clips the rest. */
  #viser-pip.mini { cursor: pointer; }
  #viser-pip.mini .bar { cursor: pointer; white-space: nowrap; overflow: hidden; }
  #viser-pip.mini .bar-extra,
  #viser-pip.mini .bar .spacer,
  #viser-pip.mini .bar button,
  #viser-pip.mini .resize { display: none; }
  #viser-pip.mini iframe { pointer-events: none; }
  @media (max-width: 900px) {
    #viser-pip { right: 12px; bottom: 12px; }
  }
  label.chk {
    flex-direction: row !important; align-items: center; gap: 8px !important;
    font-size: 12.5px !important; color: var(--dim); white-space: nowrap;
    cursor: pointer; user-select: none;
  }
  label.chk input[type="checkbox"] {
    appearance: none; -webkit-appearance: none;
    width: 14px; height: 14px; min-width: 14px; margin: 0; padding: 0;
    border: 1px solid var(--border); border-radius: 4px;
    background: var(--panel2); cursor: pointer; flex: none;
    display: grid; place-content: center;
  }
  label.chk input[type="checkbox"]:hover { border-color: var(--accent); }
  label.chk input[type="checkbox"]:checked {
    background: var(--accent); border-color: var(--accent);
  }
  label.chk input[type="checkbox"]:checked::after {
    content: ""; width: 7px; height: 4px;
    border: 1.6px solid #0b1220; border-top: 0; border-right: 0;
    transform: rotate(-45deg) translate(0.5px, -1px);
  }
  label.chk input[type="checkbox"]:focus-visible {
    outline: 1px solid var(--accent); outline-offset: 2px;
  }
</style>
</head>
<body>

<header>
  <h1>splat-explorer <span>· episode dashboard</span></h1>
  <span id="pill-scene" class="pill">scene: loading…</span>
  <span id="pill-run" class="pill">idle</span>
  <span id="pill-view" class="pill busy" style="display:none"></span>
  <span class="spacer"></span>
  <a id="spectator-link" href="/spectator" target="_blank" title="Full-window HD visor for looking around. Captures use the dashboard visor, not this page.">spectator (HD) ↗</a>
  <button id="btn-viser" class="ghost">show visor</button>
</header>

<div id="controls">
  <label>backend
    <select id="in-backend">
      <option value="cli_relay" selected>cli_relay (API)</option>
      <option value="scripted">scripted (no API)</option>
    </select>
  </label>
  <label>model (cli_relay)
    <input id="in-model" placeholder="e.g. gpt-5.6-luna" style="min-width:160px">
  </label>
  <label>max steps
    <input id="in-steps" type="number" value="10" min="1" max="200" style="min-width:70px">
  </label>
  <label>VLM resolution
    <select id="in-res">
      <option value="320x240">320 × 240 (fast debug)</option>
      <option value="480x360">480 × 360</option>
      <option value="640x480">640 × 480</option>
      <option value="960x720" selected>960 × 720 (default)</option>
    </select>
  </label>
  <div class="settings-wrap" id="settings-wrap">
    <span>settings</span>
    <button type="button" id="btn-settings" aria-expanded="false" aria-haspopup="true">
      Settings <span class="caret">▾</span>
    </button>
    <div class="settings-menu" id="settings-menu" role="menu">
      <div class="hint">send to VLM</div>
      <label class="chk"><input type="checkbox" id="in-depth">depth map</label>
      <label class="chk"><input type="checkbox" id="in-map" checked>bird's-eye map</label>
      <label class="chk"><input type="checkbox" id="in-coverage">coverage map</label>
      <div class="hint">compute (dashboard only)</div>
      <label class="chk" title="Render and save the depth map every step. Slow. Not sent to the model unless 'depth map' is also on.">
        <input type="checkbox" id="in-compute-depth">compute depth-map
      </label>
      <label class="chk" title="Render and save the coverage map every step. Not sent to the model unless 'coverage map' is also on.">
        <input type="checkbox" id="in-compute-coverage">compute coverage map
      </label>
    </div>
  </div>
  <div class="btn-row">
    <button id="btn-start">▶ Start episode</button>
    <button id="btn-stop" disabled>■ Stop</button>
  </div>
  <label class="chk"><input type="checkbox" id="in-follow" checked> follow latest step</label>
  <label>past runs
    <select id="in-history" style="min-width:210px"><option value="">— live run —</option></select>
  </label>
  <button id="btn-video" class="icon-btn" title="Episode video" aria-label="Episode video" disabled>
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <rect x="2.5" y="6.5" width="13" height="11" rx="1.8"/>
      <path d="M15.5 10.2 21 7.5v9l-5.5-2.7z"/>
    </svg>
  </button>
</div>
<div id="msg"></div>

<div id="stats">
  <span>episode <b id="st-ep">–</b></span>
  <span>steps <b id="st-steps">0</b></span>
  <span>elapsed <b id="st-elapsed">0s</b></span>
  <span>avg render <b id="st-render">–</b></span>
  <span>avg VLM <b id="st-vlm">–</b></span>
  <span>artifacts <b id="st-art">0</b></span>
</div>

<div id="layout">
  <div id="steps"><div class="empty">No steps yet — start an episode.</div></div>
  <div id="detail"><div class="empty">Step details will appear here.</div></div>
</div>

<div id="viser-pip">
  <div class="bar" id="viser-pip-bar">
    <b>Capture visor</b> · <span id="viser-pip-label">960×720</span><span class="bar-extra"> · sent to the VLM</span>
    <span class="spacer"></span>
    <button class="ghost" id="btn-pip-pop">pop out HD</button>
    <button class="ghost" id="btn-pip-hide">minimize</button>
  </div>
  <div class="body" id="viser-pip-body">
    <div class="stage" id="viser-stage">
      <iframe id="viser-frame" title="Capture visor" allow="autoplay"></iframe>
    </div>
    <div class="resize" id="viser-pip-resize" title="Drag to resize the window (capture resolution stays put)"></div>
  </div>
</div>

<script>
"use strict";
const $ = id => document.getElementById(id);
let state = null, selectedStep = null, renderedSteps = -1, renderedRunId = null;
// When set, a past run loaded from /api/episodes/<id> is shown instead of
// the live run (same shape as state.run).
let hist = null;

function activeRun() { return hist || state?.run; }

function fmtSecs(s) {
  if (s == null) return "–";
  return s >= 60 ? `${Math.floor(s / 60)}m ${Math.round(s % 60)}s` : `${s.toFixed(1)}s`;
}
function esc(t) {
  return String(t).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
}

async function poll() {
  try {
    const r = await fetch("/api/state");
    state = await r.json();
    render();
  } catch (e) { $("pill-run").textContent = "dashboard unreachable"; $("pill-run").className = "pill err"; }
  setTimeout(poll, 1000);
}

function render() {
  const { scene, run, defaults } = state;

  const ps = $("pill-scene");
  if (scene.status === "ready") {
    ps.textContent = `scene: ${scene.num_gaussians.toLocaleString()} splats (${scene.load_seconds}s load)`;
    ps.className = "pill ok";
  } else if (scene.status === "error") {
    ps.textContent = "scene: " + scene.error; ps.className = "pill err";
  } else { ps.textContent = "scene: loading…"; ps.className = "pill busy"; }

  if (!$("in-model").value && defaults.model) $("in-model").placeholder = defaults.model;
  if (!$("in-backend").dataset.init) {
    $("in-backend").value = defaults.backend || "cli_relay";
    $("in-backend").dataset.init = "1";
  }
  if (!$("in-steps").dataset.init) {
    $("in-steps").value = defaults.max_steps || 10;
    $("in-steps").dataset.init = "1";
  }
  if (!$("in-depth").dataset.init) {
    $("in-depth").checked = !!defaults.send_depth;
    $("in-depth").dataset.init = "1";
  }
  if (!$("in-coverage").dataset.init) {
    $("in-coverage").checked = !!defaults.send_coverage;
    $("in-coverage").dataset.init = "1";
  }
  if (!$("in-map").dataset.init) {
    $("in-map").checked = !!defaults.send_map;
    $("in-map").dataset.init = "1";
  }
  if (!$("in-compute-depth").dataset.init) {
    $("in-compute-depth").checked = !!defaults.compute_depth || !!defaults.send_depth;
    $("in-compute-depth").dataset.init = "1";
  }
  if (!$("in-compute-coverage").dataset.init) {
    $("in-compute-coverage").checked = !!defaults.compute_coverage || !!defaults.send_coverage;
    $("in-compute-coverage").dataset.init = "1";
  }
  $("spectator-link").href = "/spectator";
  const frame = $("viser-frame");
  if (!frame.dataset.url) frame.dataset.url = defaults.viewer_url;

  const pr = $("pill-run");
  const running = run && (run.status === "running" || run.status === "stopping");
  if (!run) { pr.textContent = "idle"; pr.className = "pill"; }
  else {
    pr.textContent = `${run.status} · ${run.params.backend}` +
      (run.params.backend === "cli_relay" ? ` · ${run.params.model || defaults.model}` : "");
    pr.className = "pill " + (running ? "busy" : run.status === "error" ? "err" : "ok");
  }
  $("btn-start").disabled = scene.status !== "ready" || running;
  $("btn-stop").disabled = !running;
  if (scene.status === "ready") ensureCaptureVisor();
  else layoutVisor();

  const pv = $("pill-view");
  pv.style.display = hist ? "" : "none";
  if (hist) pv.textContent = `viewing past run ${hist.episode}`;

  // stats + steps show either the live run or the selected past run
  const view = activeRun();
  $("st-ep").textContent = view?.episode ?? "–";
  const steps = view?.steps ?? [];
  $("st-steps").textContent = view ? `${steps.length}/${view.params?.max_steps ?? "?"}` : "0";
  const end = view?.finished_at ?? (state.now || Date.now() / 1000);
  $("st-elapsed").textContent = view?.started_at ? fmtSecs(end - view.started_at) : "–";
  const avg = key => steps.length
    ? fmtSecs(steps.reduce((a, s) => a + (s.timing?.[key] ?? 0), 0) / steps.length) : "–";
  $("st-render").textContent = avg("render_s");
  $("st-vlm").textContent = avg("decide_s");
  $("st-art").textContent = view?.artifacts?.length ?? 0;
  const videoBtn = $("btn-video");
  const epId = view?.episode;
  videoBtn.disabled = !epId;
  videoBtn.title = epId ? `Episode video (${epId})` : "No episode to render";
  if (!hist && run?.error) { $("msg").textContent = run.error; }

  // steps list: rebuild only when the shown run or its step count changes
  if (view && (view.id !== renderedRunId || steps.length !== renderedSteps)) {
    if (view.id !== renderedRunId && (selectedStep == null || selectedStep >= steps.length))
      selectedStep = steps.length ? steps.length - 1 : null;
    renderedRunId = view.id; renderedSteps = steps.length;
    renderSteps(steps);
    renderDetail();
  }
  if (!hist && $("in-follow").checked && steps.length && view.id === renderedRunId) {
    const last = steps.length - 1;
    if (selectedStep !== last) { selectedStep = last; markSelected(); renderDetail(); }
  }
}

function renderSteps(steps) {
  const box = $("steps");
  box.innerHTML = steps.length ? "" : '<div class="empty">No steps yet — start an episode.</div>';
  for (let i = steps.length - 1; i >= 0; i--) {
    const s = steps[i], a = s.action;
    const div = document.createElement("div");
    div.className = "step"; div.dataset.idx = i;
    let badge = "";
    if (s.vlm?.fallback) badge = '<span class="badge fb">FALLBACK</span>';
    if (a.name === "report_artifact") badge += '<span class="badge art">ARTIFACT</span>';
    if (a.name === "view_map") badge += '<span class="badge map">MAP</span>';
    if (a.name === "view_coverage_map") badge += '<span class="badge map">COVERAGE</span>';
    if (a.name === "view_depth") badge += '<span class="badge map">DEPTH</span>';
    if (a.name === "done") badge += '<span class="badge done">DONE</span>';
    div.innerHTML = `
      <img src="${s.frame_url}" loading="lazy" alt="step ${s.step}">
      ${s.depth_frame_url ? `<img class="depth-thumb" src="${s.depth_frame_url}" loading="lazy" alt="depth ${s.step}">` : ""}
      ${s.coverage_frame_url ? `<img class="depth-thumb" src="${s.coverage_frame_url}" loading="lazy" alt="coverage ${s.step}">` : ""}
      <div class="info">
        <div class="act">#${s.step} <span class="name">${esc(a.name)}</span> ${esc(JSON.stringify(a.args))}${badge}</div>
        <div class="times">render ${fmtSecs(s.timing?.render_s)}${s.render_backend ? ` (${esc(s.render_backend)})` : ""} · vlm ${fmtSecs(s.timing?.decide_s)}</div>
        <div class="times">${esc(s.pose)}</div>
      </div>`;
    div.onclick = () => {
      $("in-follow").checked = false;
      selectedStep = i; markSelected(); renderDetail();
      if (!hist) post("/api/select", { step: i });  // move the viser camera/frustum to this step
    };
    box.appendChild(div);
  }
  markSelected();
}

function markSelected() {
  document.querySelectorAll(".step").forEach(el =>
    el.classList.toggle("sel", Number(el.dataset.idx) === selectedStep));
}

function renderDetail() {
  const run = activeRun();
  const s = run?.steps?.[selectedStep];
  if (!s) return;
  const d = $("detail");
  const vlm = s.vlm || {};
  const attempts = (vlm.attempts || []).map(a => `
    <div class="attempt">
      <span class="meta">attempt ${a.attempt} · ${fmtSecs(a.seconds)} ·
        ${a.parsed_ok ? "parsed OK" : (a.error ? "error" : "unparseable")}</span>
      <pre>${esc(a.error || a.reply || "(empty reply)")}</pre>
    </div>`).join("");
  const artifacts = (run.artifacts || []).map(a => `
    <div class="artifact">step ${a.step} · <b>${esc(a.severity ?? "?")}</b> ·
      ${esc(a.image_region ?? "")}<br>${esc(a.description ?? "")}</div>`).join("");
  const depthCaption = s.depth_sent
    ? "DEPTH MAP — sent to the VLM this step (bright = near, black = nothing)"
    : "DEPTH MAP — computed for the dashboard (sent to the VLM after view_depth, or if always-send is on)";
  const mapCaption = s.map_sent
    ? "MAP — bird's-eye path + gold W# jump waypoints, sent to the VLM this step (full resolution)"
    : "MAP — bird's-eye path + gold W# jump waypoints (updated every step; sent to the VLM after view_map, or if always-send is on)";
  const coverageCaption = s.coverage_sent
    ? (s.coverage_lowres
        ? "COVERAGE MAP — low-res overview sent to the VLM this step (yellow-green cones)"
        : "COVERAGE MAP — viewed area (yellow-green cones), sent to the VLM this step")
      + (s.coverage != null ? ` · ${Math.round(s.coverage * 100)}%` : "")
    : "COVERAGE MAP — computed for the dashboard (sent to the VLM after view_coverage_map, or if always-send is on)"
      + (s.coverage != null ? ` · ${Math.round(s.coverage * 100)}%` : "");
  const vlmSize = run?.params
    ? `${run.params.width}×${run.params.height}`
    : "960×720";
  const fig = (caption, url, alt) => `
    <figure>
      <figcaption>${caption}</figcaption>
      <img class="frame" src="${url}" alt="${alt}">
    </figure>`;
  const rgbFig = fig(`RGB — sent to the VLM (${vlmSize}, aspect preserved)`, s.frame_url, `step ${s.step} RGB`);
  const mapFig = s.map_frame_url ? fig(mapCaption, s.map_frame_url, `step ${s.step} map`) : "";
  const coverageFig = s.coverage_frame_url
    ? fig(coverageCaption, s.coverage_frame_url, `step ${s.step} coverage`)
    : "";
  const depthFig = s.depth_frame_url ? fig(depthCaption, s.depth_frame_url, `step ${s.step} depth`) : "";
  const panes = [rgbFig, depthFig, mapFig, coverageFig].filter(Boolean);
  const frames = `<div class="frames n${panes.length}">${panes.join("")}</div>`;
  d.innerHTML = `
    ${frames}
    <div class="kv">
      <span class="k">step</span><span class="v">#${s.step} — ${esc(s.frame)}</span>
      <span class="k">pose</span><span class="v">${esc(s.pose)}</span>
      <span class="k">action</span><span class="v">${esc(s.action.name)} ${esc(JSON.stringify(s.action.args))}</span>
      ${s.coverage != null ? `<span class="k">coverage</span><span class="v">${Math.round(s.coverage * 100)}% viewed area</span>` : ""}
      <span class="k">timing</span><span class="v">render ${fmtSecs(s.timing?.render_s)} · vlm decide ${fmtSecs(s.timing?.decide_s)}</span>
      ${s.render_backend ? `<span class="k">renderer</span><span class="v">${esc(s.render_backend)}</span>` : ""}
      ${vlm.backend ? `<span class="k">vlm</span><span class="v">${esc(vlm.backend)}${vlm.model ? " · " + esc(vlm.model) : ""}${vlm.fallback ? ' · <b style="color:var(--err)">fallback action used</b>' : ""}</span>` : ""}
      ${run.episode ? `<span class="k">logs</span><span class="v"><a href="/api/episodes/${encodeURIComponent(run.episode)}/log" target="_blank">episode.log ↗</a></span>` : ""}
    </div>
    ${vlm.raw_response !== undefined ? `
      <details open><summary>raw VLM response (${(vlm.attempts || []).length || 1} attempt${(vlm.attempts||[]).length===1?"":"s"})</summary>
        ${attempts || `<pre>${esc(vlm.raw_response || "(empty)")}</pre>`}
      </details>` : ""}
    ${vlm.parsed_action ? `
      <details><summary>parsed action (after clamping: see "action" above)</summary>
        <pre>${esc(JSON.stringify(vlm.parsed_action, null, 2))}</pre></details>` : ""}
    ${vlm.prompt ? `
      <details><summary>full prompt sent (${vlm.prompt.length.toLocaleString()} chars + RGB${s.depth_sent ? " + depth" : ""}${s.map_sent ? " + map" : ""}${s.coverage_sent ? " + coverage" : ""})</summary>
        <pre>${esc(vlm.prompt)}</pre></details>` : ""}
    ${run.summary ? `<details open><summary>episode summary (done)</summary><pre>${esc(run.summary)}</pre></details>` : ""}
    <div id="artifacts">${artifacts ? "<h3 style='font-size:13px'>Artifact reports</h3>" + artifacts : ""}</div>`;
}

async function post(url, body) {
  const r = await fetch(url, { method: "POST", headers: { "Content-Type": "application/json" },
                               body: JSON.stringify(body || {}) });
  const j = await r.json();
  $("msg").textContent = j.message || "";
  setTimeout(() => { if ($("msg").textContent === j.message) $("msg").textContent = ""; }, 6000);
}

$("btn-start").onclick = () => {
  const [w, h] = $("in-res").value.split("x").map(Number);
  $("in-history").value = "";  // starting a run always returns to the live view
  hist = null;
  ensureCaptureVisor();
  post("/api/run", {
    backend: $("in-backend").value,
    model: $("in-model").value.trim(),
    max_steps: Number($("in-steps").value) || 10,
    width: w, height: h,
    send_depth: $("in-depth").checked,
    send_coverage: $("in-coverage").checked,
    send_map: $("in-map").checked,
    compute_depth: $("in-compute-depth").checked,
    compute_coverage: $("in-compute-coverage").checked,
  });
};
$("btn-stop").onclick = () => post("/api/stop");
$("btn-video").onclick = () => {
  const ep = activeRun()?.episode;
  if (!ep) return;
  window.open("/video/" + encodeURIComponent(ep), "_blank", "noopener");
};

(function settingsDropdown() {
  const wrap = $("settings-wrap"), btn = $("btn-settings");
  function setOpen(open) {
    wrap.classList.toggle("open", open);
    btn.setAttribute("aria-expanded", open ? "true" : "false");
  }
  btn.onclick = e => { e.stopPropagation(); setOpen(!wrap.classList.contains("open")); };
  document.addEventListener("click", e => { if (!wrap.contains(e.target)) setOpen(false); });
  document.addEventListener("keydown", e => { if (e.key === "Escape") setOpen(false); });
  function pair(sendId, computeId) {
    $(sendId).addEventListener("change", () => {
      if ($(sendId).checked) $(computeId).checked = true;
    });
    $(computeId).addEventListener("change", () => {
      if (!$(computeId).checked) $(sendId).checked = false;
    });
  }
  pair("in-depth", "in-compute-depth");
  pair("in-coverage", "in-compute-coverage");
})();

// --- past-run history --------------------------------------------------------
async function loadHistory() {
  try {
    const r = await fetch("/api/episodes");
    const { episodes } = await r.json();
    const sel = $("in-history"), current = sel.value;
    sel.innerHTML = '<option value="">— live run —</option>' + episodes.map(e => {
      const when = e.started_at ? new Date(e.started_at * 1000).toLocaleString() : e.id;
      const backend = e.params?.backend ? ` · ${e.params.backend}` : "";
      return `<option value="${esc(e.id)}">${esc(when)} · ${esc(e.status)} · ${e.steps} steps${backend}</option>`;
    }).join("");
    sel.value = current;  // keep the selection across refreshes
    if (sel.value !== current) sel.value = "";
  } catch (e) { /* dashboard unreachable; poll() already reports it */ }
}

$("in-history").onchange = async () => {
  const id = $("in-history").value;
  if (!id) { hist = null; renderedRunId = null; render(); return; }
  try {
    const r = await fetch(`/api/episodes/${encodeURIComponent(id)}`);
    if (!r.ok) throw new Error(`HTTP ${r.status}`);
    const ep = await r.json();
    const m = ep.meta || {};
    hist = {
      id: "hist:" + ep.id,
      episode: ep.id,
      status: m.status ?? "archived",
      params: m.params ?? { max_steps: m.max_steps },
      steps: ep.steps,
      artifacts: ep.artifacts,
      summary: m.summary ?? null,
      error: m.error ?? null,
      started_at: m.started_at ?? null,
      finished_at: m.finished_at ?? null,
    };
    $("in-follow").checked = false;
    render();
  } catch (e) {
    $("msg").textContent = `Failed to load run ${id}: ${e.message}`;
    $("in-history").value = ""; hist = null;
  }
};

loadHistory();
setInterval(loadHistory, 15000);
$("in-follow").onchange = () => {
  if ($("in-follow").checked) post("/api/select", { step: null });  // viser back to live
};

function selectedRes() {
  const [w, h] = $("in-res").value.split("x").map(Number);
  return { w: w || 960, h: h || 720 };
}

function captureRes() {
  const run = state?.run;
  const running = run && (run.status === "running" || run.status === "stopping");
  if (running && run.params?.width && run.params?.height)
    return { w: run.params.width, h: run.params.height };
  return selectedRes();
}

let visorOpen = false;
let visorVisualW = 0;
let visorPlacement = null; // last expanded {left, top, visW} for this page load
let lastLayoutKey = "";

function snapVisorBottomRight() {
  const pip = $("viser-pip");
  pip.style.left = "auto";
  pip.style.top = "auto";
  pip.style.right = "";
  pip.style.bottom = "";
}

function rememberVisorPlacement() {
  const pip = $("viser-pip");
  if (!visorOpen || pip.classList.contains("mini")) return;
  const r = pip.getBoundingClientRect();
  visorPlacement = {
    left: r.left,
    top: r.top,
    visW: $("viser-pip-body").offsetWidth || visorVisualW,
  };
  visorVisualW = visorPlacement.visW;
}

function applyVisorPlacement() {
  if (!visorPlacement) {
    snapVisorBottomRight();
    return;
  }
  const pip = $("viser-pip");
  const maxL = Math.max(8, window.innerWidth - pip.offsetWidth - 8);
  const maxT = Math.max(8, window.innerHeight - pip.offsetHeight - 8);
  pip.style.left = Math.max(8, Math.min(maxL, visorPlacement.left)) + "px";
  pip.style.top = Math.max(8, Math.min(maxT, visorPlacement.top)) + "px";
  pip.style.right = "auto";
  pip.style.bottom = "auto";
}

function layoutVisor() {
  const pip = $("viser-pip");
  if (!pip.classList.contains("live")) return;
  const { w, h } = captureRes();
  const frame = $("viser-frame"), stage = $("viser-stage"), body = $("viser-pip-body");
  frame.style.width = w + "px";
  frame.style.height = h + "px";
  stage.style.width = w + "px";
  stage.style.height = h + "px";
  $("viser-pip-label").textContent = w + "×" + h;

  if (!visorOpen) {
    pip.classList.add("mini");
    pip.title = "Click to expand";
    snapVisorBottomRight();
    const barH = $("viser-pip-bar").offsetHeight || 28;
    const visW = Math.min(240, Math.max(160, window.innerWidth - 24));
    const key = w + "x" + h + ":mini:" + visW + ":" + barH;
    if (key !== lastLayoutKey) {
      lastLayoutKey = key;
      stage.style.transform = "scale(" + (visW / w) + ")";
      body.style.width = visW + "px";
      body.style.height = barH + "px";
    }
    return;
  }

  pip.classList.remove("mini");
  pip.title = "";
  const maxOpen = Math.min(w, Math.max(280, window.innerWidth - 440), 640);
  const minVis = Math.min(280, w);
  let visW = visorVisualW || (visorPlacement && visorPlacement.visW) || maxOpen;
  visW = Math.max(minVis, Math.min(maxOpen, visW));
  visorVisualW = visW;
  const key = w + "x" + h + ":" + visW + ":open";
  if (key === lastLayoutKey) return;
  lastLayoutKey = key;
  const scale = visW / w;
  stage.style.transform = "scale(" + scale + ")";
  body.style.width = Math.round(w * scale) + "px";
  body.style.height = Math.round(h * scale) + "px";
}

function ensureCaptureVisor() {
  const pip = $("viser-pip"), frame = $("viser-frame");
  pip.classList.add("live");
  const url = frame.dataset.url || "http://localhost:8080";
  if (!frame.src || /about:blank/.test(frame.src)) frame.src = url;
  $("btn-viser").textContent = visorOpen ? "minimize visor" : "show visor";
  layoutVisor();
}

function setVisorOpen(open) {
  if (visorOpen && !open) rememberVisorPlacement();
  visorOpen = !!open;
  lastLayoutKey = "";
  if (open && visorPlacement) {
    visorVisualW = visorPlacement.visW;
    const pip = $("viser-pip");
    pip.style.left = visorPlacement.left + "px";
    pip.style.top = visorPlacement.top + "px";
    pip.style.right = "auto";
    pip.style.bottom = "auto";
  }
  $("viser-pip").classList.toggle("open", visorOpen);
  $("btn-viser").textContent = visorOpen ? "minimize visor" : "show visor";
  ensureCaptureVisor();
  if (open) applyVisorPlacement();
}

$("in-res").onchange = () => { lastLayoutKey = ""; layoutVisor(); };

function setPip(open) {
  setVisorOpen(open);
}
$("btn-viser").onclick = () => setVisorOpen(!visorOpen);
$("btn-pip-hide").onclick = () => setVisorOpen(false);
$("btn-pip-pop").onclick = () => {
  window.open("/spectator", "splat-spectator", "noopener");
};
$("viser-pip").addEventListener("click", e => {
  if (visorOpen || e.target.closest("button")) return;
  setVisorOpen(true);
});

(function enablePipDrag() {
  const pip = $("viser-pip"), bar = $("viser-pip-bar"), grip = $("viser-pip-resize");
  let mode = null, ox = 0, oy = 0, startW = 0, startX = 0;

  function pinTopLeft() {
    const r = pip.getBoundingClientRect();
    pip.style.left = r.left + "px";
    pip.style.top = r.top + "px";
    pip.style.right = "auto";
    pip.style.bottom = "auto";
    return r;
  }

  bar.addEventListener("mousedown", e => {
    if (!visorOpen || e.target.closest("button")) return;
    const r = pinTopLeft();
    mode = "move";
    ox = e.clientX - r.left; oy = e.clientY - r.top;
    bar.style.cursor = "grabbing";
    e.preventDefault();
  });
  grip.addEventListener("mousedown", e => {
    if (!visorOpen) return;
    pinTopLeft();
    mode = "resize";
    startW = $("viser-pip-body").offsetWidth;
    startX = e.clientX;
    e.preventDefault();
    e.stopPropagation();
  });
  window.addEventListener("mousemove", e => {
    if (!mode) return;
    if (mode === "move") {
      const maxL = window.innerWidth - pip.offsetWidth - 8;
      const maxT = window.innerHeight - pip.offsetHeight - 8;
      pip.style.left = Math.max(8, Math.min(maxL, e.clientX - ox)) + "px";
      pip.style.top = Math.max(8, Math.min(maxT, e.clientY - oy)) + "px";
      return;
    }
    visorOpen = true;
    visorVisualW = Math.max(200, startW + (e.clientX - startX));
    $("btn-viser").textContent = "minimize visor";
    lastLayoutKey = "";
    layoutVisor();
  });
  window.addEventListener("mouseup", () => {
    if (mode) rememberVisorPlacement();
    mode = null; bar.style.cursor = "grab";
  });
  window.addEventListener("resize", () => {
    lastLayoutKey = "";
    layoutVisor();
    if (visorOpen) applyVisorPlacement();
  });
})();

poll();
</script>
</body>
</html>
