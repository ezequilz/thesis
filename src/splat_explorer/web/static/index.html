<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>splat-explorer · episode dashboard</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root {
    --bg: #101318; --panel: #171c24; --panel2: #1e2530; --border: #2a3342;
    --text: #dce3ee; --dim: #8b97a8; --accent: #5aa2ff; --ok: #45c98b;
    --warn: #e6b450; --err: #ef6a6a; --mono: ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 14px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  header { display: flex; align-items: center; gap: 14px; padding: 10px 16px;
           background: var(--panel); border-bottom: 1px solid var(--border);
           position: sticky; top: 0; z-index: 5; flex-wrap: wrap; }
  header h1 { font-size: 15px; margin: 0; font-weight: 600; }
  header h1 span { color: var(--dim); font-weight: 400; }
  .pill { padding: 2px 10px; border-radius: 20px; font-size: 12px;
          background: var(--panel2); border: 1px solid var(--border); color: var(--dim); }
  .pill.ok { color: var(--ok); border-color: var(--ok); }
  .pill.busy { color: var(--warn); border-color: var(--warn); }
  .pill.err { color: var(--err); border-color: var(--err); }
  .spacer { flex: 1; }
  a { color: var(--accent); text-decoration: none; }

  #controls { display: flex; gap: 8px; align-items: end; padding: 10px 16px;
              background: var(--panel); border-bottom: 1px solid var(--border); flex-wrap: wrap; }
  #controls label { display: flex; flex-direction: column; gap: 3px; font-size: 11px; color: var(--dim); }
  #controls input, #controls select {
    background: var(--panel2); color: var(--text); border: 1px solid var(--border);
    border-radius: 6px; padding: 6px 8px; font-size: 13px; min-width: 90px; }
  #controls input:focus, #controls select:focus { outline: 1px solid var(--accent); }
  button { border: 0; border-radius: 6px; padding: 7px 16px; font-size: 13px;
           font-weight: 600; cursor: pointer; }
  button:disabled { opacity: .45; cursor: default; }
  #btn-start { background: var(--accent); color: #0b1220; }
  #btn-stop { background: var(--err); color: #fff; }
  .ghost { background: var(--panel2); color: var(--text); border: 1px solid var(--border) !important; }
  #stats { display: flex; gap: 18px; padding: 8px 16px; font-size: 12px; color: var(--dim);
           border-bottom: 1px solid var(--border); flex-wrap: wrap; }
  #stats b { color: var(--text); font-family: var(--mono); font-weight: 600; }
  #msg { font-size: 12px; color: var(--warn); padding: 0 16px; }

  #layout { display: grid; grid-template-columns: 340px 1fr; gap: 0;
            height: calc(100vh - 148px); }
  #steps { overflow-y: auto; border-right: 1px solid var(--border); }
  .step { display: flex; gap: 10px; padding: 8px 10px; cursor: pointer;
          border-bottom: 1px solid var(--border); }
  .step:hover { background: var(--panel); }
  .step.sel { background: var(--panel2); box-shadow: inset 3px 0 0 var(--accent); }
  .step img { width: 96px; height: 72px; object-fit: cover; border-radius: 4px;
              background: #000; flex: none; }
  .step .info { min-width: 0; font-size: 12px; }
  .step .act { font-family: var(--mono); font-size: 12px; white-space: nowrap;
               overflow: hidden; text-overflow: ellipsis; }
  .step .act .name { color: var(--accent); font-weight: 700; }
  .step .times { color: var(--dim); font-size: 11px; }
  .badge { display: inline-block; font-size: 10px; border-radius: 4px; padding: 0 5px;
           margin-left: 5px; font-weight: 700; }
  .badge.fb { background: var(--err); color: #fff; }
  .badge.art { background: var(--warn); color: #22180a; }
  .badge.done { background: var(--ok); color: #0a2417; }

  #detail { overflow-y: auto; padding: 14px 18px; }
  #detail img.frame { max-width: 100%; max-height: 58vh; border-radius: 6px;
                      border: 1px solid var(--border); background: #000; }
  .kv { display: grid; grid-template-columns: 110px 1fr; gap: 3px 12px;
        font-size: 13px; margin: 12px 0; }
  .kv .k { color: var(--dim); }
  .kv .v { font-family: var(--mono); font-size: 12.5px; word-break: break-all; }
  details { margin: 10px 0; border: 1px solid var(--border); border-radius: 6px;
            background: var(--panel); }
  details summary { padding: 7px 12px; cursor: pointer; font-size: 12.5px; color: var(--dim); }
  details pre { margin: 0; padding: 10px 12px; border-top: 1px solid var(--border);
                font-family: var(--mono); font-size: 12px; white-space: pre-wrap;
                word-break: break-word; max-height: 45vh; overflow-y: auto; }
  .attempt { border-top: 1px solid var(--border); padding: 6px 12px; font-size: 12px; }
  .attempt .meta { color: var(--dim); }
  #artifacts { margin-top: 6px; }
  .artifact { border: 1px solid var(--warn); border-radius: 6px; padding: 8px 12px;
              margin: 6px 0; font-size: 12.5px; background: var(--panel); }
  .empty { color: var(--dim); padding: 30px; text-align: center; }
  #viser-wrap { display: none; height: 46vh; border-bottom: 1px solid var(--border); }
  #viser-wrap iframe { width: 100%; height: 100%; border: 0; background: #000; }
  label.chk { flex-direction: row !important; align-items: center; gap: 6px !important;
              font-size: 12px !important; color: var(--dim); }
</style>
</head>
<body>

<header>
  <h1>splat-explorer <span>· episode dashboard</span></h1>
  <span id="pill-scene" class="pill">scene: loading…</span>
  <span id="pill-run" class="pill">idle</span>
  <span class="spacer"></span>
  <a id="viser-link" href="http://localhost:8080" target="_blank">viser viewer ↗</a>
  <button id="btn-viser" class="ghost">embed live viewer</button>
</header>

<div id="controls">
  <label>backend
    <select id="in-backend">
      <option value="scripted">scripted (no API)</option>
      <option value="cli_relay">cli_relay (VLM)</option>
    </select>
  </label>
  <label>model (cli_relay)
    <input id="in-model" placeholder="e.g. gpt-5.6-luna" style="min-width:160px">
  </label>
  <label>max steps
    <input id="in-steps" type="number" value="5" min="1" max="200" style="min-width:70px">
  </label>
  <label>resolution
    <select id="in-res">
      <option value="320x240">320 × 240 (fast debug)</option>
      <option value="480x360" selected>480 × 360</option>
      <option value="640x480">640 × 480</option>
      <option value="960x720">960 × 720 (config default)</option>
    </select>
  </label>
  <button id="btn-start">▶ Start episode</button>
  <button id="btn-stop" disabled>■ Stop</button>
  <label class="chk"><input type="checkbox" id="in-follow" checked> follow latest step</label>
  <span id="msg"></span>
</div>

<div id="stats">
  <span>episode <b id="st-ep">–</b></span>
  <span>steps <b id="st-steps">0</b></span>
  <span>elapsed <b id="st-elapsed">0s</b></span>
  <span>avg render <b id="st-render">–</b></span>
  <span>avg VLM <b id="st-vlm">–</b></span>
  <span>artifacts <b id="st-art">0</b></span>
</div>

<div id="viser-wrap"><iframe id="viser-frame"></iframe></div>

<div id="layout">
  <div id="steps"><div class="empty">No steps yet — start an episode.</div></div>
  <div id="detail"><div class="empty">Step details will appear here.</div></div>
</div>

<script>
"use strict";
const $ = id => document.getElementById(id);
let state = null, selectedStep = null, renderedSteps = -1, renderedRunId = null;

function fmtSecs(s) {
  if (s == null) return "–";
  return s >= 60 ? `${Math.floor(s / 60)}m ${Math.round(s % 60)}s` : `${s.toFixed(1)}s`;
}
function esc(t) {
  return String(t).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
}

async function poll() {
  try {
    const r = await fetch("/api/state");
    state = await r.json();
    render();
  } catch (e) { $("pill-run").textContent = "dashboard unreachable"; $("pill-run").className = "pill err"; }
  setTimeout(poll, 1000);
}

function render() {
  const { scene, run, defaults } = state;

  const ps = $("pill-scene");
  if (scene.status === "ready") {
    ps.textContent = `scene: ${scene.num_gaussians.toLocaleString()} splats (${scene.load_seconds}s load)`;
    ps.className = "pill ok";
  } else if (scene.status === "error") {
    ps.textContent = "scene: " + scene.error; ps.className = "pill err";
  } else { ps.textContent = "scene: loading…"; ps.className = "pill busy"; }

  if (!$("in-model").value && defaults.model) $("in-model").placeholder = defaults.model;
  $("viser-link").href = defaults.viewer_url;
  if (!$("viser-frame").src) $("viser-frame").dataset.url = defaults.viewer_url;

  const pr = $("pill-run");
  const running = run && (run.status === "running" || run.status === "stopping");
  if (!run) { pr.textContent = "idle"; pr.className = "pill"; }
  else {
    pr.textContent = `${run.status} · ${run.params.backend}` +
      (run.params.backend === "cli_relay" ? ` · ${run.params.model || defaults.model}` : "");
    pr.className = "pill " + (running ? "busy" : run.status === "error" ? "err" : "ok");
  }
  $("btn-start").disabled = scene.status !== "ready" || running;
  $("btn-stop").disabled = !running;

  // stats
  $("st-ep").textContent = run?.episode ?? "–";
  const steps = run?.steps ?? [];
  $("st-steps").textContent = run ? `${steps.length}/${run.params.max_steps}` : "0";
  const end = run?.finished_at ?? (state.now || Date.now() / 1000);
  $("st-elapsed").textContent = run ? fmtSecs(end - run.started_at) : "0s";
  const avg = key => steps.length
    ? fmtSecs(steps.reduce((a, s) => a + (s.timing?.[key] ?? 0), 0) / steps.length) : "–";
  $("st-render").textContent = avg("render_s");
  $("st-vlm").textContent = avg("decide_s");
  $("st-art").textContent = run?.artifacts?.length ?? 0;
  if (run?.error) { $("msg").textContent = run.error; }

  // steps list: rebuild only when the run or step count changes
  if (run && (run.id !== renderedRunId || steps.length !== renderedSteps)) {
    if (run.id !== renderedRunId) selectedStep = null;
    renderedRunId = run.id; renderedSteps = steps.length;
    renderSteps(steps);
  }
  if ($("in-follow").checked && steps.length && run.id === renderedRunId) {
    const last = steps.length - 1;
    if (selectedStep !== last) { selectedStep = last; markSelected(); renderDetail(); }
  }
}

function renderSteps(steps) {
  const box = $("steps");
  box.innerHTML = steps.length ? "" : '<div class="empty">No steps yet — start an episode.</div>';
  for (let i = steps.length - 1; i >= 0; i--) {
    const s = steps[i], a = s.action;
    const div = document.createElement("div");
    div.className = "step"; div.dataset.idx = i;
    let badge = "";
    if (s.vlm?.fallback) badge = '<span class="badge fb">FALLBACK</span>';
    if (a.name === "report_artifact") badge += '<span class="badge art">ARTIFACT</span>';
    if (a.name === "done") badge += '<span class="badge done">DONE</span>';
    div.innerHTML = `
      <img src="${s.frame_url}" loading="lazy" alt="step ${s.step}">
      <div class="info">
        <div class="act">#${s.step} <span class="name">${esc(a.name)}</span> ${esc(JSON.stringify(a.args))}${badge}</div>
        <div class="times">render ${fmtSecs(s.timing?.render_s)} · vlm ${fmtSecs(s.timing?.decide_s)}</div>
        <div class="times">${esc(s.pose)}</div>
      </div>`;
    div.onclick = () => {
      $("in-follow").checked = false;
      selectedStep = i; markSelected(); renderDetail();
      post("/api/select", { step: i });  // move the viser camera/frustum to this step
    };
    box.appendChild(div);
  }
  markSelected();
}

function markSelected() {
  document.querySelectorAll(".step").forEach(el =>
    el.classList.toggle("sel", Number(el.dataset.idx) === selectedStep));
}

function renderDetail() {
  const s = state?.run?.steps?.[selectedStep];
  if (!s) return;
  const d = $("detail");
  const vlm = s.vlm || {};
  const attempts = (vlm.attempts || []).map(a => `
    <div class="attempt">
      <span class="meta">attempt ${a.attempt} · ${fmtSecs(a.seconds)} ·
        ${a.parsed_ok ? "parsed OK" : (a.error ? "error" : "unparseable")}</span>
      <pre>${esc(a.error || a.reply || "(empty reply)")}</pre>
    </div>`).join("");
  const artifacts = (state.run.artifacts || []).map(a => `
    <div class="artifact">step ${a.step} · <b>${esc(a.severity ?? "?")}</b> ·
      ${esc(a.image_region ?? "")}<br>${esc(a.description ?? "")}</div>`).join("");
  d.innerHTML = `
    <img class="frame" src="${s.frame_url}" alt="step ${s.step}">
    <div class="kv">
      <span class="k">step</span><span class="v">#${s.step} — ${esc(s.frame)}</span>
      <span class="k">pose</span><span class="v">${esc(s.pose)}</span>
      <span class="k">action</span><span class="v">${esc(s.action.name)} ${esc(JSON.stringify(s.action.args))}</span>
      <span class="k">timing</span><span class="v">render ${fmtSecs(s.timing?.render_s)} · vlm decide ${fmtSecs(s.timing?.decide_s)}</span>
      ${vlm.backend ? `<span class="k">vlm</span><span class="v">${esc(vlm.backend)}${vlm.model ? " · " + esc(vlm.model) : ""}${vlm.fallback ? ' · <b style="color:var(--err)">fallback action used</b>' : ""}</span>` : ""}
    </div>
    ${vlm.raw_response !== undefined ? `
      <details open><summary>raw VLM response (${(vlm.attempts || []).length || 1} attempt${(vlm.attempts||[]).length===1?"":"s"})</summary>
        ${attempts || `<pre>${esc(vlm.raw_response || "(empty)")}</pre>`}
      </details>` : ""}
    ${vlm.parsed_action ? `
      <details><summary>parsed action (after clamping: see "action" above)</summary>
        <pre>${esc(JSON.stringify(vlm.parsed_action, null, 2))}</pre></details>` : ""}
    ${vlm.prompt ? `
      <details><summary>full prompt sent (${vlm.prompt.length.toLocaleString()} chars + screenshot)</summary>
        <pre>${esc(vlm.prompt)}</pre></details>` : ""}
    ${state.run.summary ? `<details open><summary>episode summary (done)</summary><pre>${esc(state.run.summary)}</pre></details>` : ""}
    <div id="artifacts">${artifacts ? "<h3 style='font-size:13px'>Artifact reports</h3>" + artifacts : ""}</div>`;
}

async function post(url, body) {
  const r = await fetch(url, { method: "POST", headers: { "Content-Type": "application/json" },
                               body: JSON.stringify(body || {}) });
  const j = await r.json();
  $("msg").textContent = j.message || "";
  setTimeout(() => { if ($("msg").textContent === j.message) $("msg").textContent = ""; }, 6000);
}

$("btn-start").onclick = () => {
  const [w, h] = $("in-res").value.split("x").map(Number);
  post("/api/run", {
    backend: $("in-backend").value,
    model: $("in-model").value.trim(),
    max_steps: Number($("in-steps").value) || 5,
    width: w, height: h,
  });
};
$("btn-stop").onclick = () => post("/api/stop");
$("in-follow").onchange = () => {
  if ($("in-follow").checked) post("/api/select", { step: null });  // viser back to live
};
$("btn-viser").onclick = () => {
  const wrap = $("viser-wrap"), frame = $("viser-frame");
  const show = wrap.style.display !== "block";
  wrap.style.display = show ? "block" : "none";
  $("btn-viser").textContent = show ? "hide live viewer" : "embed live viewer";
  if (show && !frame.src) frame.src = frame.dataset.url || "http://localhost:8080";
};

poll();
</script>
</body>
</html>
