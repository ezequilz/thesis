.g4-intro{border:1px solid #344148;border-radius:8px;padding:0 20px 12px;margin-top:24px}.g4-badge{font-size:12px;border:1px solid #566670;border-radius:4px;padding:5px 8px;color:#c5d0d6}.g4-badge.ok{border-color:#487d68;color:#a5dcc0}.g4-badge.bad,.g4-warning{color:#ffc1a8}.g4-badge.bad{border-color:#ad7157}.g4-view{border-top:1px solid #344148;padding:16px 0}.g4-view-title{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.g4-view-title h3{margin:0;flex:1;font-size:15px}.g4-panels{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}.g4-panel{display:block;background:#171e22;border:1px solid #344148;border-radius:5px;overflow:hidden;color:#d8e4e9}.g4-panel img{width:100%;height:auto;display:block;aspect-ratio:1.74;object-fit:contain;background:#080b0d}.g4-panel span,.g4-panel small{display:block;padding:6px 9px}.g4-panel small{padding-top:0;color:#9babb3}.g4-panel.missing{min-height:160px;display:flex;flex-direction:column;justify-content:center;text-align:center}.g4-legend{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.g4-gradient{display:inline-block;width:120px;height:14px;border:1px solid #73808a;background:linear-gradient(90deg,#000,#fff)}#g4Debug details{max-width:none}#g4Debug summary{cursor:pointer;padding:10px 0}#g4Debug pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:12px;background:#171e22;padding:14px;max-height:380px;overflow:auto}.g4-panels.extra{grid-template-columns:repeat(3,minmax(0,1fr))}@media(max-width:850px){.g4-panels,.g4-panels.extra{grid-template-columns:repeat(2,minmax(0,1fr))}}#oracleDebug details{max-width:none}#oracleDebug summary{cursor:pointer;padding:10px 0}#oracleDebug pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:12px;background:#171e22;padding:14px;max-height:380px;overflow:auto}.oracle-stages{display:flex;flex-wrap:wrap;gap:8px;margin:16px 0}</style></head><body><main><header><h1 id="title">Run details</h1><a href="/splatfix/results">Results</a><button id="refresh">Refresh</button><span id="refreshStatus" class="dim" aria-live="polite"></span><button id="stop" hidden>Stop gracefully &amp; download</button><a id="viser" hidden>Review splat ↗</a></header><nav id="chainNav" class="tools" aria-label="Chained benchmark runs" hidden><button id="chainPrev">← Previous run</button><span id="chainPosition" aria-live="polite"></span><button id="chainNext">Next run →</button></nav><p id="error" role="alert"></p><div id="run" class="mono dim"></div><div id="facts" class="facts"></div><div id="links" class="links"></div><section id="evaluation"></section><details id="scope" hidden><summary>Evaluation scope</summary><p></p></details><section id="comparison" hidden><div class="comparison-heading"><h2>Stage comparison</h2><button id="comparisonPrev" aria-label="Previous comparison image">‹</button><span id="comparisonPosition" class="dim" aria-live="polite"></span><button id="comparisonNext" aria-label="Next comparison image">›</button></div><a id="comparisonLink" target="_blank" rel="noopener" aria-label="Open full-size stage comparison"><img id="comparisonImage" class="comparison-image" alt="Same-camera stage comparison" decoding="async"></a><p id="comparisonCaption" class="caption dim"></p></section><section id="references" hidden><h2>Reference images fed to the model</h2><p id="referenceCounts" class="dim"></p><div id="referenceGallery" class="grid references"></div></section><div id="g4Debug" hidden></div><div id="oracleDebug" hidden></div><h2 id="galleryTitle">ArtiFixer · reconstruction inputs</h2><div class="tools"><span id="counts" class="dim"></span><label>Frame <input id="find" type="number" min="0" placeholder="Index" style="width:100px"></label><button id="go">Find</button><button id="open" disabled>Open selected</button></div><div id="gallery" class="grid"></div><section id="originalRgb" hidden><h2>Original RGB captures fed to the model</h2><p id="originalRgbCounts" class="dim"></p><div id="originalRgbGallery" class="grid references"></div></section></main><dialog id="lightbox" aria-label="Full-size gallery image"><div class="viewer"><header><button id="prev" aria-label="Previous image">‹</button><span id="position"></span><button id="next" aria-label="Next image">›</button><a id="source" target="_blank" rel="noopener">Image ↗</a><button id="fullscreen" aria-label="Enter fullscreen">⛶</button><button id="close" aria-label="Close image">×</button></header><img id="full" alt=""></div></dialog><script>
const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let frames=[],references=[],selected=-1,viewerGallery='gallery',viewerIndex=-1,comparisons=[],comparisonIndex=0;const names={baseline:'Original',artifixer:'ArtiFixer images',artifixer3d:'ArtiFixer3D',artifixer3d_plus:'ArtiFixer3D+ images'};
function renderG4(r){
const d=r.g4splat,host=$('g4Debug');host.hidden=!d;
for(const element of [$('galleryTitle'),$('galleryTitle').nextElementSibling,$('gallery')])if(element)element.hidden=!!d;
if(!d)return;
const pretty=v=>esc(JSON.stringify(v,null,2)),num=v=>Number.isFinite(v)?v.toFixed(3):'—';
const badge=(label,state='unknown')=>`<span class="g4-badge ${state}">${esc(label)}</span>`;
const image=p=>p?.url?`<a class="g4-panel" href="${esc(p.url)}" target="_blank" rel="noopener"><img loading="lazy" decoding="async" src="${esc(p.url)}" alt="${esc(p.label)}"><span>${esc(p.label)}</span>${p.stats?`<small>${(100*p.stats.valid_fraction).toFixed(1)}% valid · ${(100*p.stats.clipped_fraction).toFixed(1)}% clipped</small>`:''}</a>`:`<div class="g4-panel missing"><span>${esc(p?.label||'Native training-view render')}</span><small>${esc(p?.error||'Not available')}</small></div>`;
const gate=d.gate_status,source=d.source_depth?.enabled===true;
host.innerHTML=`<section class="g4-intro"><h2>G4Splat · research diagnostics</h2><div class="tools">${badge(gate==='passed'?'Reprojection gate passed':gate==='failed'?'Reprojection gate failed':'Reprojection not available',gate==='passed'?'ok':gate==='failed'?'bad':'unknown')}${badge(source?'Source-depth extension enabled':'Source-depth extension not recorded / disabled')}${badge(d.correction||'Camera correction unrecorded')}</div><p>${esc(d.variant)}</p>${source?`<p class="dim">Local source-depth staging: ${esc(d.input_staging?.status||'not available')} · ${esc(d.input_staging?.discovery||'no matching export')}. “Transferred” records successful input synchronization; GPU use is confirmed separately by runtime reports.</p>${d.input_staging?.error?`<p class="g4-warning">${esc(d.input_staging.error)}</p>`:''}`:''}<p class="dim">Native training-view renders show the saved 2D Gaussian output. The interactive viewer uses an approximate 3D conversion. Training views are not held-out evaluation; reprojection checks do not establish correct depth ordering.</p><p class="dim">${esc(d.evaluation)}.</p>${d.gate.error?`<p class="g4-warning">${esc(d.gate.error)}</p>`:''}<details><summary>Recipe, source-depth provenance and check details</summary><pre>${pretty({revision:d.revision,settings:d.settings,source_depth:d.source_depth,source_depth_check:d.source_depth_check,input_staging:d.input_staging,reprojection:d.gate})}</pre></details></section>
<section><h2>Input-view geometry comparison</h2><p class="dim">${d.views.length} of ${d.view_count} views · Click any panel to open it. RGB panels retain their staged dimensions; depth previews preserve aspect ratio. Source-depth panels retain the original input grid; recorded crop offsets describe the staged grid.</p><div class="g4-legend"><span class="g4-gradient"></span><span>Black = 0 · White = ${num(d.depth_scale.max)} ${esc(d.depth_scale.units||'scene units')} · Magenta = invalid</span></div><p class="dim">${esc(d.depth_scale.error||d.depth_scale.normalization||'No scalar depth maps available.')} Shared across all displayed views and stages. These are camera-z depths, not distances along normalized rays.</p>${!d.native_order_known?'<p class="g4-warning">Native render/input ordering could not be established from saved camera metadata. Render pairing is withheld.</p>':''}
${d.views.map(v=>{const k=v.saved_intrinsics,c=v.calibration,g=v.reprojection;return `<article class="g4-view"><div class="g4-view-title"><h3>View ${esc(v.view_id)} <small class="dim">${esc(v.image)}</small></h3>${badge(g?.passed===true?'Reprojection passed':g?.passed===false?'Reprojection failed':'Reprojection unverified',g?.passed===true?'ok':g?.passed===false?'bad':'unknown')}${v.calibration_warning?badge('Calibration mismatch','bad'):badge(c?'Crop recorded':'Crop metadata unavailable')}</div>${v.calibration_warning?`<p class="g4-warning">${esc(v.calibration_warning)}</p>`:''}<p class="mono dim">Staged RGB ${esc(v.staged_wh?.join(' × ')||'—')} · saved fx ${num(k?.fx)} / fy ${num(k?.fy)} / cx ${num(k?.cx)} / cy ${num(k?.cy)}${c?' · crop offset '+esc(c.crop_xy?.join(', ')):''}${g?' · reprojection median '+num(g.median_error_px)+' / p95 '+num(g.p95_error_px)+' / max '+num(g.max_error_px)+' px':''}</p>${source?`<section class="g4-source"><h4>Locally exported source-splat depth · GPU input</h4><p class="dim">View export: ${esc(v.source_export_status||'pending')}</p><p class="mono dim">Original grid ${esc(v.source_export?.width??'—')} × ${esc(v.source_export?.height??'—')} · positive camera-z · ${v.source_export?.positive_valid_fraction!=null?(100*v.source_export.positive_valid_fraction).toFixed(1)+'% valid':'coverage unavailable'} · checksum ${esc(v.source_export?.checksum_status||'not available')}</p>${v.source_export?.checksum_status==='mismatch'?'<p class="g4-warning">Source artifact checksum differs from its exported manifest. Do not treat this preview as the verified GPU input.</p>':''}<div class="g4-panels extra">${['source','source_valid','source_confidence'].map(stage=>image(v.panels[stage])).join('')}</div><details><summary>Export checksum, camera and grid provenance</summary><pre>${pretty(v.source_export||{status:'Local source artifact not available'})}</pre></details></section>`:''}<div class="g4-panels">${['input','native','chart','refined'].map(stage=>image(v.panels[stage])).join('')}</div><details><summary>More depth stages and camera provenance</summary><div class="g4-panels extra">${['monocular','native_depth','plane_vis','confident_map'].map(stage=>image(v.panels[stage])).join('')}</div><pre>${pretty({input_camera:v.input_camera,saved_intrinsics:v.saved_intrinsics,crop:c,reprojection:g,source_depth:v.source_depth,input_sha256:v.sha256})}</pre></details></article>`}).join('')}${!d.views.length?`<p class="empty">${d.input_staging?.status==='exporting'?'Local input export is starting. Completed source-depth views will appear here automatically, before GPU transfer or reconstruction.':'Input metadata is not available yet.'}</p>`:''}</section>
<section><h2>Fitting diagnostics</h2><p class="dim">Saved optimizer artifacts are evidence of fitting progress, not reconstruction accuracy. Per-view plane and confidence visualizations appear under “More depth stages”. Raw affine scale/shift coefficients are shown only if present in the linked logs or reports.</p><div class="grid">${d.fitting.map(image).join('')||'<p class="dim">No fitting plot available.</p>'}</div></section><section><h2>Generation overview</h2><p class="dim">Saved upstream comparison panels, grouped by generation round. Panel labels and filenames are preserved; filename scores are not treated as quality metrics. Availability indicates saved artifacts, not successful evaluation.</p>${d.generation.map(s=>`<details ${s.stage===1?'open':''}><summary>Round ${s.stage} · ${s.panels.length} overview panels · ${esc(s.status)}</summary><div class="grid">${s.panels.map(p=>image({url:p.url,label:p.name})).join('')}</div></details>`).join('')}</section><section><h2>Artifacts and logs</h2><div class="links">${d.artifacts.map(a=>`<a href="${esc(a.url)}" target="_blank" rel="noopener">${esc(a.label)} ↗</a>`).join('')}</div></section>`;
}

function renderOracle(r){
const d=r.oraclegs,host=$('oracleDebug');host.hidden=!d;if(!d)return;
for(const e of [$('galleryTitle'),$('galleryTitle').nextElementSibling,$('gallery')])e.hidden=true;
const open=new Set([...host.querySelectorAll('details[open]')].map(e=>e.dataset.section));
const pretty=v=>esc(JSON.stringify(v,null,2)), size=v=>esc(v?.join(' × ')||'Not recorded');
const badge=(label,status='')=>`<span class="g4-badge ${status}">${esc(label)}</span>`;
const gate=(g,label)=>badge(label+': '+(g?.passed===true?'passed':g?.passed===false?'failed':'not recorded'),g?.passed===true?'ok':g?.passed===false?'bad':'');
const panel=(url,label)=>url?`<button type="button" class="g4-panel tile" data-oracle-image data-url="${esc(url)}" aria-pressed="false" aria-label="Open ${esc(label)}"><img loading="lazy" decoding="async" src="${esc(url)}" alt="${esc(label)}"><span>${esc(label)}</span></button>`:`<div class="g4-panel missing"><span>${esc(label)}</span><small>Not available yet</small></div>`;
const section=(key,title,body,initial=false)=>`<details id="oracle-${key}" data-section="${key}" ${open.has(key)||(!host.innerHTML&&initial)?'open':''}><summary>${title}</summary>${body}</details>`;
const age=d.cache.updated_at_epoch?Math.max(0,Math.floor(Date.now()/1000-d.cache.updated_at_epoch)):null;
const message=d.state.message||r.message||'Waiting for staged inputs';
const failed=['error','stopped','cancelled'].includes(d.state.status||r.job_status);
const pending=failed?'Unavailable in this interrupted run. Inspect the stage log below.':'Waiting for this stage to save artifacts and the next cache transfer.';
const inputs=d.inputs||{},runtime=d.recipe.runtime||{},progress=d.stages.filter(s=>s.status==='completed').length;
const imageGrid=items=>`<div class="grid">${items.map(p=>panel(p.url,p.name)).join('')}</div>`;
host.innerHTML=`<section class="g4-intro"><h2>OracleGS · reconstruction diagnostics</h2><div class="tools">${badge(d.state.phase||r.phase||'Awaiting worker')}${badge(d.state.status||r.job_status,failed?'bad':'')}${gate(d.alignment,'Camera alignment')}${gate(d.geometry,'Geometry gate')}</div><p>${esc(message.split('\n')[0].slice(0,240))}</p>${message.length>240||message.includes('\n')?section('error-details','Full worker error',`<pre>${esc(message)}</pre>`):''}<p class="dim">${esc(d.recipe.gt_policy||'Saved repaired reference RGBs are ground truth. SEVA outputs remain synthetic, including views at saved poses.')} VGGT attention weights synthetic supervision; it is not a calibrated quality score.</p><p class="dim">Cache: ${esc(d.cache.status||'not synchronized yet')}${age!==null?' · last transfer '+age+' seconds ago':''}${d.cache.phase?' · '+esc(d.cache.phase):''}. This page reads local files only. The queue checks for generation artifacts at most once per minute; stable reconstruction images are not repeatedly transferred.</p>${d.cache.message?`<p class="g4-warning">${esc(d.cache.message)}</p>`:''}<div class="oracle-stages">${d.stages.map(s=>badge(s.name.replaceAll('_',' ')+' · '+s.status,s.status==='completed'?'ok':s.status==='error'?'bad':'')).join('')}</div></section>
<section><h2>Input calibration and geometry</h2><div class="facts"><span>Requested ${size(inputs.requested_resolution)}</span><span>Staged ${size(inputs.resolution)}</span><span>SEVA internal ${size(inputs.seva_internal_resolution)}</span><span>Fit: ${esc(inputs.seva_fit||'unrecorded')}</span><span>${esc(inputs.resolution_adapter||'')}</span></div><p class="dim">${esc(inputs.source_camera_convention||'Source convention unrecorded')} → ${esc(inputs.camera_convention||'SEVA convention unrecorded')}. Each image affine must also transform intrinsics; camera poses retain the saved viewpoint. The alignment gate tests encoding consistency, not whether repaired content has physically correct geometry.</p><p>${esc(d.recipe.method_variant||inputs.oracle_adapter||'Adapter not recorded')} · ${esc(inputs.oracle_adapter==='trajectory'?'Dataset adapter: saved GT poses plus synthetic intermediate cameras. Placeholder images are excluded from GT sampling.':'Saved-pose dataset: synthetic views share reference camera poses.')}</p><p class="dim">Source splat initialization: ${inputs.source_splat_used_for_initialization===false?'not used; original OracleGS initializes from reference-image SfM':'not recorded'}. ${d.geometry.triangulated_points!=null?esc(d.geometry.triangulated_points)+' triangulated points · '+esc(d.geometry.positive_depth_scales)+' positive depth scales.':'SfM/depth gate report unavailable.'}</p>${d.input_staging.error?`<p class="g4-warning">${esc(d.input_staging.error)}</p>`:''}
${section('references',`Ground-truth references · ${d.views.length} staged images`,imageGrid(d.views.map((v,i)=>({url:v.url,name:'Reference '+(i+1)+' · '+v.view_id}))),true)}
${section('reference-details','Per-view camera, crop and depth diagnostics',d.views.map((v,i)=>`<article class="g4-view"><h3>Reference ${i+1} · ${esc(v.view_id)}</h3><p class="mono dim">${esc(v.source_kind||'Saved reference')} · ${v.alignment?'camera reprojection error '+esc(v.alignment.max_pixel_error)+' px':'camera validation not recorded'}</p><div class="g4-panels extra">${panel(v.url,'Staged ground truth · '+v.view_id)}${panel(v.depth_url,'Monocular inverse-depth prior (16-bit; not metric depth)')}</div>${section('camera-'+i,'Camera, crop and checksum provenance',`<pre>${pretty({source_camera:v.camera,staged_intrinsics:v.staged_intrinsics,image_affine:v.image_affine,source_crop_box:v.source_crop_box,input_sha256:v.sha256,source_sha256:v.source_sha256,alignment:v.alignment})}</pre>`)}</article>`).join('')||`<p class="empty">Staged input metadata is not available yet.</p>`)}
${section('geometry','Geometry gate, depth scales and staging record',`<pre>${pretty({alignment:d.alignment,geometry:d.geometry,depth_scales:d.depth_scales,staging:d.input_staging})}</pre>`)}</section>
<section><h2>SEVA · two-pass generation</h2>${d.overview_url?`<a href="${esc(d.overview_url)}" target="_blank" rel="noopener"><img class="comparison-image" src="${esc(d.overview_url)}" alt="SEVA generation overview with first-pass anchors and full-trajectory frame indices"></a>`:''}<p class="dim">First-pass sparse anchors condition the full trajectory in the second pass. These are generated camera views, not blended RGBs. Saved first-pass frame numbers are upstream export indices; pose correspondence is not inferred from their filenames.</p><div class="grid">${d.videos.map(v=>`<article><h3>${esc(v.label)}</h3><video controls playsinline preload="metadata" aria-label="${esc(v.label)}" src="${esc(v.url)}" style="width:100%"></video><a href="${esc(v.url)}" download>Download video ↗</a></article>`).join('')}</div>
${section('anchors',`First pass · ${d.anchors.length} saved anchor images`,d.anchors.length?imageGrid(d.anchors):`<p class="dim">${pending}</p>`,true)}
${inputs.trajectory?.version===2?`<p class="dim">${esc(inputs.trajectory.frames_per_segment??'Saved poses')} images per transition · ${esc(inputs.trajectory.target_count)} planned targets · ${esc(inputs.trajectory.segments?.length??0)} transitions. Shared endpoints are saved for both adjacent transitions.</p>`:inputs.oracle_adapter==='trajectory'?'<p class="g4-warning">Legacy trajectory with a total frame budget. Start a fresh run to generate the configured number of images per transition.</p>':''}
${section('trajectory',`Full trajectory · ${d.trajectory.length} saved images`,d.trajectory.length?imageGrid(d.trajectory):`<p class="dim">${pending}</p>`,true)}</section>
<section><h2>Reconstruction inputs and VGGT attention</h2><p class="dim">${d.synthetic.length} synthetic targets · ${d.synthetic.filter(p=>p.attention_url).length} attention maps. Pairing uses the exact synthetic filename consumed by OracleGS. Attention maps preserve the authors’ export: layers 0 and 22 with weights 0.25 and 0.75. A map’s presence does not prove geometric correctness.</p>${section('attention','Generated images paired with attention maps',d.synthetic.map(p=>`<article class="g4-view"><h3>${esc(p.name)} · ${esc(p.role)}</h3><div class="g4-panels extra">${panel(p.url,p.name+' · Synthetic RGB')}${panel(p.attention_url,p.name+' · VGGT attention weight')}</div></article>`).join('')||`<p class="dim">${pending}</p>`,true)}</section>
<section><h2>Reconstruction and provenance</h2><p class="dim">Stop &amp; save PLY finishes the current training iteration, saves the current Gaussian splat, and downloads it as an incomplete reconstruction. Before training starts, only available artifacts can be retained. If saving fails or times out, the latest confirmed scheduled snapshot is recovered when available.</p><p>${r.ply_url?`<a href="${esc(r.ply_url)}">${r.incomplete?'Download incomplete snapshot (iteration '+esc(d.saved_iteration??'unrecorded')+')':'Download reconstructed Gaussian splat'} ↗</a>`:failed?'No final reconstruction available.':'Final reconstruction pending; generation diagnostics above remain available during optimization.'}</p><p class="dim">${esc(d.recipe.held_out_evaluation||'No held-out evaluation recorded. Generated targets are not ground-truth evaluation images.')}</p><div class="links">${d.artifacts.map(a=>`<a href="${esc(a.url)}" target="_blank" rel="noopener">${esc(a.label)} ↗</a>`).join('')}</div>${section('recipe','Full recipe, original source revisions and commands',`<pre>${pretty(d.recipe)}</pre>`)}</section>`;
host.onclick=e=>{const b=e.target.closest('[data-oracle-image]');if(!b)return;const gallery=b.closest('details');const images=[...gallery.querySelectorAll('[data-oracle-image]')];choose(images.indexOf(b),true,gallery.id)};
}

function showComparison(i){if(!comparisons.length)return;comparisonIndex=(i+comparisons.length)%comparisons.length;const item=comparisons[comparisonIndex];$('comparison').hidden=false;$('comparisonImage').src=item.url;$('comparisonImage').alt=item.title;$('comparisonLink').href=item.url;$('comparisonLink').setAttribute('aria-label','Open full-size '+item.title);$('comparisonCaption').textContent=item.caption;$('comparisonPosition').textContent=`${comparisonIndex+1} / ${comparisons.length} · ${item.title}`;$('comparisonPrev').disabled=$('comparisonNext').disabled=comparisons.length<2}
$('comparisonPrev').onclick=()=>showComparison(comparisonIndex-1);$('comparisonNext').onclick=()=>showComparison(comparisonIndex+1);
$('comparison').addEventListener('keydown',e=>{if(e.key==='ArrowLeft'||e.key==='ArrowRight'){e.preventDefault();showComparison(comparisonIndex+(e.key==='ArrowLeft'?-1:1))}});
function choose(i,show=false,gallery='gallery'){
const images=gallery.startsWith('oracle-')?[...$(gallery).querySelectorAll('[data-oracle-image]')].map(b=>({url:b.dataset.url,label:b.querySelector('img').alt})):gallery==='referenceGallery'?references:frames;if(i<0||i>=images.length)return;
viewerGallery=gallery;viewerIndex=i;
document.querySelectorAll(`#${gallery} .tile`).forEach((b,j)=>b.setAttribute('aria-pressed',j===i?'true':'false'));
if(gallery==='gallery'){selected=i;$('open').disabled=false}
const f=images[i],label=f.label||(gallery==='referenceGallery'?`Reference ${f.name}`:`ArtiFixer inferred frame ${f.index}`);
$('full').src=f.url;$('full').alt=label;$('source').href=f.url;$('position').textContent=`${label} · ${i+1} / ${images.length}`;
$('prev').disabled=i===0;$('next').disabled=i===images.length-1;
if(show&&!$('lightbox').open)$('lightbox').showModal()
}
$('prev').onclick=()=>choose(viewerIndex-1,false,viewerGallery);$('next').onclick=()=>choose(viewerIndex+1,false,viewerGallery);$('open').onclick=()=>choose(selected,true);$('close').onclick=()=>{$('lightbox').close();if(document.fullscreenElement)document.exitFullscreen()};$('fullscreen').onclick=async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else await $('lightbox').requestFullscreen()}catch(e){$('position').textContent+=' · Fullscreen unavailable'}};
$('lightbox').addEventListener('keydown',e=>{if(e.key==='ArrowLeft'){e.preventDefault();choose(viewerIndex-1,false,viewerGallery)}if(e.key==='ArrowRight'){e.preventDefault();choose(viewerIndex+1,false,viewerGallery)}});$('lightbox').addEventListener('close',()=>{if(document.fullscreenElement)document.exitFullscreen();document.querySelectorAll(`#${viewerGallery} .tile`)[viewerIndex]?.focus()});$('go').onclick=()=>{const i=frames.findIndex(f=>f.index===Number($('find').value));if(i>=0){choose(i);document.querySelectorAll('#gallery .tile')[i].scrollIntoView({block:'center'})}else $('error').textContent='Frame not available in reconstruction inputs'};$('find').onkeydown=e=>{if(e.key==='Enter')$('go').click()};
// Throttle wheel gestures so a trackpad swipe advances one image at a time.
let lastViewerScroll=0;
$('lightbox').addEventListener('wheel',e=>{if(e.ctrlKey)return;e.preventDefault();const delta=Math.abs(e.deltaX)>Math.abs(e.deltaY)?e.deltaX:e.deltaY;if(Math.abs(delta)<10||Date.now()-lastViewerScroll<250)return;lastViewerScroll=Date.now();choose(viewerIndex+(delta>0?1:-1),false,viewerGallery)},{passive:false});
$('referenceGallery').onclick=e=>{const b=e.target.closest('[data-reference]');if(b)choose(Number(b.dataset.reference),true,'referenceGallery')};
let chainRuns=[],chainPosition=1;
function showChain(r){chainRuns=r.chain_runs||[];chainPosition=r.chain_position||1;$('chainNav').hidden=!(r.chain_total>1);$('chainPosition').textContent=`Run ${chainPosition} of ${r.chain_total||1}`+(chainRuns.length<(r.chain_total||1)?' · remaining results pending':'');$('chainPrev').disabled=chainPosition<=1;$('chainNext').disabled=chainPosition>=chainRuns.length}
function moveChain(delta){const target=chainRuns[chainPosition-1+delta];if(target)location.href=target.detail_url}
$('chainPrev').onclick=()=>moveChain(-1);$('chainNext').onclick=()=>moveChain(1);
let lastDetail='', liveRun=null,stopPending=false,runStopping=false,detailTimer=null,detailLoading=false,pollGallery=true,detailDelay=30000;
function needsGalleryPolling(r){
const active=['queued','waiting_gpu','starting','running','stopping'].includes(r.job_status||r.status);
if(r.chain_total>1)return active;
const complete=r.inference_ready||(r.gallery?.verified_inputs&&r.gallery.expected_count!=null&&r.gallery.frames.length>=r.gallery.expected_count);
return (r.kind.startsWith('G4Splat')||r.kind==='OracleGS')?active:r.kind==='ArtiFixer3D'&&active&&!complete;
}
function scheduleDetail(){
clearTimeout(detailTimer);detailTimer=null;
$('refreshStatus').textContent=pollGallery?`Checking for images every ${detailDelay/1000} seconds`:'Auto-refresh off · use Refresh for latest results';
if(pollGallery)detailTimer=setTimeout(()=>{if(!document.hidden&&!$('lightbox').open&&![...document.querySelectorAll('#oracleDebug video')].some(v=>!v.paused&&!v.ended))refreshDetail();else scheduleDetail()},detailDelay);
}
$('refresh').onclick=()=>refreshDetail();
$('stop').onclick=async()=>{if(!liveRun||stopPending)return;stopPending=true;$('stop').disabled=true;try{const response=await fetch('/api/splatfix/cancel',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({run_id:liveRun})});if(!response.ok){const error=await response.json();throw Error(error.error||'Stop request failed')}$('error').textContent='Graceful stop requested. Saving and downloading available reconstruction outputs…';lastDetail='';await refreshDetail()}catch(e){$('error').textContent=e.message}finally{stopPending=false;$('stop').disabled=runStopping}};

async function refreshDetail(){if(detailLoading)return;detailLoading=true;clearTimeout(detailTimer);$('refresh').disabled=true;try{const key=new URLSearchParams(location.search).get('id')||'';const response=await fetch('/api/splatfix/results/run?id='+encodeURIComponent(key));if(!response.ok)throw Error(`Run unavailable (${response.status})`);const r=await response.json(),signature=JSON.stringify(r);pollGallery=needsGalleryPolling(r);detailDelay=r.g4splat?.input_staging?.status==='exporting'?3000:30000;if(signature===lastDetail)return;lastDetail=signature;showChain(r);const g=r.gallery;liveRun=r.run_id;runStopping=r.status==='stopping';$('stop').hidden=!r.can_stop&&!runStopping;$('stop').disabled=stopPending||r.status==='stopping';$('stop').textContent=r.status==='stopping'?'Saving & downloading…':r.kind==='OracleGS'?'Stop & save PLY':'Stop gracefully & download';frames=g.frames;$('error').textContent=r.inference_ready?'Inference images ready · reconstruction outputs pending':'';$('evaluation').innerHTML='';$('scope').hidden=true;$('references').hidden=true;$('originalRgb').hidden=true;$('comparison').hidden=true;if(r.status==='stopping')$('error').textContent='Saving current reconstruction and downloading available outputs…';if(r.incomplete)$('error').textContent=r.interruption?.reason||'Interrupted: partial outputs only; reconstruction is incomplete.';$('title').textContent=r.scene||r.run_id;$('run').textContent=r.run_id+' · '+r.result_name;$('viser').href=r.viser_url;$('viser').hidden=!(r.original||r.repaired);$('facts').innerHTML=[r.incomplete?'Interrupted · incomplete':r.status,r.kind,r.mode,r.model,r.trajectory,r.resolution_setting].filter(Boolean).map(v=>`<span>${esc(v)}</span>`).join('');$('links').innerHTML=[['Run diagnostics',r.diagnostics_url],['Viewer PLY',r.ply_url],['Native surfel PLY',r.native_ply_url],['Metrics JSON',r.metrics_url],['Run metadata',r.provenance_url]].filter(x=>x[1]).map(([n,u])=>`<a href="${esc(u)}">${n}</a>`).join('');if(Object.keys(r.metrics).length)$('evaluation').innerHTML=`<h2>Evaluation · ${esc(r.test_count??'')} test images</h2><table class="metrics"><thead><tr><th>Stage</th><th>PSNR ↑</th><th>SSIM ↑</th><th>LPIPS VGG ↓</th></tr></thead><tbody>${Object.entries(r.metrics).map(([s,m])=>`<tr><td>${esc(names[s]||s)}</td>${['psnr','ssim','lpips'].map(k=>`<td>${Number.isFinite(m[k])?m[k].toFixed(k==='psnr'?2:3):'—'}</td>`).join('')}</tr>`).join('')}</tbody></table>`;if(r.metrics_scope||r.limitation){$('scope').hidden=false;$('scope').querySelector('p').textContent=[r.metrics_scope,r.limitation].filter(Boolean).join(' ')}comparisons=r.comparison_gallery||(r.stage_comparison?[{...r.stage_comparison,title:'Stage comparison'}]:[]);if(comparisons.length)showComparison(Math.min(comparisonIndex,comparisons.length-1));if(r.preview_evaluation_status?.status==='error')$('error').textContent='Early chart unavailable: '+r.preview_evaluation_status.message;if(r.evaluation_status?.status==='partial')$('error').textContent='Some evaluation artifacts could not be computed. See evaluation-status.json in the run outputs.';const captures=r.original_rgb_images||[];if(captures.length){$('originalRgb').hidden=false;$('originalRgbCounts').textContent=`${captures.length} original RGB captures · Open an image for full resolution`;$('originalRgbGallery').innerHTML=captures.map(f=>`<a class="tile" href="${esc(f.url)}" target="_blank" rel="noopener" aria-label="Open original RGB frame ${f.index}"><img loading="lazy" decoding="async" src="${esc(f.url)}" alt="Original RGB frame ${f.index}"><span>Frame ${f.index}</span></a>`).join('')}const refs=references=r.reference_images||[];if(refs.length){$('references').hidden=false;$('referenceCounts').textContent=`${refs.length}${g.reference_count!=null&&g.reference_count!==refs.length?' / '+g.reference_count:''} reference images · Open an image for full resolution`;$('referenceGallery').innerHTML=refs.map((f,i)=>`<button class="tile" type="button" data-reference="${i}" aria-pressed="false" aria-label="Open reference ${esc(f.name)}"><img loading="lazy" decoding="async" src="${esc(f.url)}" alt="Reference ${esc(f.name)}"><span>${esc(f.name)}</span></button>`).join('')}$('galleryTitle').textContent=r.kind.startsWith('G4Splat')?'G4Splat':g.verified_inputs?g.stage:'ArtiFixer · first-pass images';$('counts').textContent=`${frames.length}${g.expected_count!=null&&g.expected_count!==frames.length?' / '+g.expected_count:''} generated images`+(g.reference_count!=null?` · ${g.reference_count} reference anchors`:'')+(!g.verified_inputs&&frames.length?' · Input provenance unavailable':'');$('gallery').innerHTML=frames.map((f,i)=>`<button class="tile" aria-label="Open inferred frame ${f.index}" aria-pressed="false" data-i="${i}"><img loading="lazy" decoding="async" src="${esc(f.url)}" alt="Inferred frame ${f.index}"><span>Frame ${f.index}</span></button>`).join('')||(r.kind.startsWith('G4Splat')?'<div class="empty">G4Splat artifacts are available in the run output folder.</div>':`<div class="empty">${r.status==='completed'?'Reconstruction completed; images are still being downloaded.':'Inference images will appear here after generation and transfer complete'}</div>`);$('gallery').onclick=e=>{const b=e.target.closest('[data-i]');if(b)choose(Number(b.dataset.i),true)};if(frames.length)choose(Math.min(Math.max(selected,0),frames.length-1));renderG4(r);renderOracle(r)}catch(e){$('error').textContent=e.message}finally{detailLoading=false;$('refresh').disabled=false;scheduleDetail()}}
refreshDetail();
</script></body></html>
