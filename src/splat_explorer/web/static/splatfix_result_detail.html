<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Run details</title><style>
:root{color-scheme:dark;font:14px system-ui;color:#dde3e5;background:#101416}*{box-sizing:border-box}body{margin:0}main{max-width:1460px;margin:auto;padding:28px}header,.tools,.links{display:flex;align-items:center;gap:16px;flex-wrap:wrap}header{border-bottom:1px solid #344148;padding-bottom:20px}header h1{font-size:21px;margin:0;flex:1}a{color:#aed5e8;text-decoration:none}button,select,input{font:inherit;color:inherit;background:#1b2429;border:1px solid #425159;border-radius:5px;padding:8px 12px}button{cursor:pointer}button:disabled{opacity:.35;cursor:default}button:focus-visible,a:focus-visible{outline:2px solid #83c1e6;outline-offset:3px}.dim{color:#9babb3}.mono{font:12px ui-monospace,monospace;overflow-wrap:anywhere}.facts{display:flex;gap:22px;flex-wrap:wrap;margin:18px 0}.metrics{border-collapse:collapse;margin:18px 0;max-width:650px;width:100%}td,th{text-align:right;padding:8px 14px;border-bottom:1px solid #303b41}td:first-child,th:first-child{text-align:left}h2{font-size:17px;margin-top:28px}.tools{margin:16px 0}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}.tile{padding:0;overflow:hidden;text-align:left}.tile img{display:block;width:100%;aspect-ratio:1.5;object-fit:contain;background:#080b0d}.tile span{display:block;padding:8px 10px;font:12px ui-monospace,monospace}.tile[aria-pressed=true]{outline:2px solid #91c5e4}.empty{padding:28px 0;color:#9babb3}dialog{width:100vw;height:100vh;max-width:none;max-height:none;padding:0;margin:0;border:0;background:#090c0f;color:#e6eaed}dialog::backdrop{background:#000}.viewer{height:100%;display:flex;flex-direction:column}.viewer header{padding:10px 18px;gap:12px;flex-wrap:nowrap}.viewer header span{flex:1}.viewer img{min-height:0;flex:1;width:100%;object-fit:contain}.viewer a{white-space:nowrap}details{max-width:1000px;margin:18px 0}details p{line-height:1.5}.comparison-heading{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:28px}.comparison-heading h2{margin:0;flex:1}.comparison-heading button{padding:3px 10px;font-size:22px}.comparison-heading span{font-size:12px}.comparison-image{display:block;width:100%;height:auto;border:1px solid #344148;border-radius:6px}.references{grid-template-columns:repeat(auto-fit,minmax(250px,1fr))}.references .tile{border:1px solid #425159;border-radius:5px;background:#1b2429;color:inherit}.references .tile img{aspect-ratio:auto}.caption{line-height:1.5;margin:10px 0 20px}#error{color:#ffb0a4}@media(max-width:600px){main{padding:16px}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.viewer header{padding:8px;gap:6px}.viewer a{display:none}}
</style></head><body><main><header><h1 id="title">Run details</h1><a href="/splatfix/results">Results</a><button id="stop" hidden>Stop gracefully &amp; download</button><a id="viser" hidden>Review splat ↗</a></header><p id="error" role="alert"></p><div id="run" class="mono dim"></div><div id="facts" class="facts"></div><div id="links" class="links"></div><section id="evaluation"></section><details id="scope" hidden><summary>Evaluation scope</summary><p></p></details><section id="comparison" hidden><div class="comparison-heading"><h2>Stage comparison</h2><button id="comparisonPrev" aria-label="Previous comparison image">‹</button><span id="comparisonPosition" class="dim" aria-live="polite"></span><button id="comparisonNext" aria-label="Next comparison image">›</button></div><a id="comparisonLink" target="_blank" rel="noopener" aria-label="Open full-size stage comparison"><img id="comparisonImage" class="comparison-image" alt="Same-camera stage comparison" decoding="async"></a><p id="comparisonCaption" class="caption dim"></p></section><section id="references" hidden><h2>Reference images fed to the model</h2><p id="referenceCounts" class="dim"></p><div id="referenceGallery" class="grid references"></div></section><h2 id="galleryTitle">ArtiFixer · reconstruction inputs</h2><div class="tools"><span id="counts" class="dim"></span><label>Frame <input id="find" type="number" min="0" placeholder="Index" style="width:100px"></label><button id="go">Find</button><button id="open" disabled>Open selected</button></div><div id="gallery" class="grid"></div></main><dialog id="lightbox" aria-label="Full-size inferred image"><div class="viewer"><header><button id="prev" aria-label="Previous image">‹</button><span id="position"></span><button id="next" aria-label="Next image">›</button><a id="source" target="_blank" rel="noopener">Image ↗</a><button id="fullscreen" aria-label="Enter fullscreen">⛶</button><button id="close" aria-label="Close image">×</button></header><img id="full" alt=""></div></dialog><script>
const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let frames=[],selected=-1,comparisons=[],comparisonIndex=0;const names={baseline:'Original',artifixer:'ArtiFixer images',artifixer3d:'ArtiFixer3D',artifixer3d_plus:'ArtiFixer3D+ images'};
function showComparison(i){if(!comparisons.length)return;comparisonIndex=(i+comparisons.length)%comparisons.length;const item=comparisons[comparisonIndex];$('comparison').hidden=false;$('comparisonImage').src=item.url;$('comparisonImage').alt=item.title;$('comparisonLink').href=item.url;$('comparisonLink').setAttribute('aria-label','Open full-size '+item.title);$('comparisonCaption').textContent=item.caption;$('comparisonPosition').textContent=`${comparisonIndex+1} / ${comparisons.length} · ${item.title}`;$('comparisonPrev').disabled=$('comparisonNext').disabled=comparisons.length<2}
$('comparisonPrev').onclick=()=>showComparison(comparisonIndex-1);$('comparisonNext').onclick=()=>showComparison(comparisonIndex+1);
$('comparison').addEventListener('keydown',e=>{if(e.key==='ArrowLeft'||e.key==='ArrowRight'){e.preventDefault();showComparison(comparisonIndex+(e.key==='ArrowLeft'?-1:1))}});
function choose(i,show=false){if(i<0||i>=frames.length)return;selected=i;document.querySelectorAll('#gallery .tile').forEach((b,j)=>b.setAttribute('aria-pressed',j===i?'true':'false'));$('open').disabled=false;const f=frames[i];$('full').src=f.url;$('full').alt=`ArtiFixer inferred frame ${f.index}`;$('source').href=f.url;$('position').textContent=`Frame ${f.index} · ${i+1} / ${frames.length}`;$('prev').disabled=i===0;$('next').disabled=i===frames.length-1;if(show&&!$('lightbox').open)$('lightbox').showModal()}
$('prev').onclick=()=>choose(selected-1);$('next').onclick=()=>choose(selected+1);$('open').onclick=()=>choose(selected,true);$('close').onclick=()=>{$('lightbox').close();if(document.fullscreenElement)document.exitFullscreen()};$('fullscreen').onclick=async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else await $('lightbox').requestFullscreen()}catch(e){$('position').textContent+=' · Fullscreen unavailable'}};
$('lightbox').addEventListener('keydown',e=>{if(e.key==='ArrowLeft'){e.preventDefault();choose(selected-1)}if(e.key==='ArrowRight'){e.preventDefault();choose(selected+1)}});$('lightbox').addEventListener('close',()=>{if(document.fullscreenElement)document.exitFullscreen();document.querySelectorAll('#gallery .tile')[selected]?.focus()});$('go').onclick=()=>{const i=frames.findIndex(f=>f.index===Number($('find').value));if(i>=0){choose(i);document.querySelectorAll('#gallery .tile')[i].scrollIntoView({block:'center'})}else $('error').textContent='Frame not available in reconstruction inputs'};$('find').onkeydown=e=>{if(e.key==='Enter')$('go').click()};
let lastDetail='',liveRun=null,stopPending=false;
$('stop').onclick=async()=>{if(!liveRun||stopPending)return;stopPending=true;$('stop').disabled=true;try{const response=await fetch('/api/splatfix/cancel',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({run_id:liveRun})});if(!response.ok){const error=await response.json();throw Error(error.error||'Stop request failed')}$('error').textContent='Graceful stop requested. Saving and downloading available reconstruction outputs…';lastDetail='';await refreshDetail()}catch(e){$('error').textContent=e.message}finally{stopPending=false;$('stop').disabled=false}};

async function refreshDetail(){try{const key=new URLSearchParams(location.search).get('id')||'';const response=await fetch('/api/splatfix/results/run?id='+encodeURIComponent(key));if(!response.ok)throw Error(`Run unavailable (${response.status})`);const r=await response.json(),signature=JSON.stringify(r);if(signature===lastDetail)return;lastDetail=signature;const g=r.gallery;liveRun=r.run_id;$('stop').hidden=!r.can_stop;$('stop').disabled=stopPending;frames=g.frames;$('error').textContent=r.inference_ready?'Inference images ready · reconstruction outputs pending':'';$('evaluation').innerHTML='';$('scope').hidden=true;$('references').hidden=true;$('comparison').hidden=true;if(r.status==='stopping')$('error').textContent='Saving current reconstruction and downloading available outputs…';if(r.incomplete)$('error').textContent=r.interruption?.reason||'Interrupted: partial outputs only; reconstruction is incomplete.';$('title').textContent=r.scene||r.run_id;$('run').textContent=r.run_id+' · '+r.result_name;$('viser').href=r.viser_url;$('viser').hidden=!(r.original||r.repaired);$('facts').innerHTML=[r.incomplete?'Interrupted · incomplete':r.status,r.kind,r.mode,r.model,r.trajectory,r.resolution_setting].filter(Boolean).map(v=>`<span>${esc(v)}</span>`).join('');$('links').innerHTML=[['Run diagnostics',r.diagnostics_url],['PLY',r.ply_url],['Metrics JSON',r.metrics_url],['Run metadata',r.provenance_url]].filter(x=>x[1]).map(([n,u])=>`<a href="${esc(u)}">${n}</a>`).join('');if(Object.keys(r.metrics).length)$('evaluation').innerHTML=`<h2>Evaluation · ${esc(r.test_count??'')} test images</h2><table class="metrics"><thead><tr><th>Stage</th><th>PSNR ↑</th><th>SSIM ↑</th><th>LPIPS VGG ↓</th></tr></thead><tbody>${Object.entries(r.metrics).map(([s,m])=>`<tr><td>${esc(names[s]||s)}</td>${['psnr','ssim','lpips'].map(k=>`<td>${Number.isFinite(m[k])?m[k].toFixed(k==='psnr'?2:3):'—'}</td>`).join('')}</tr>`).join('')}</tbody></table>`;if(r.metrics_scope||r.limitation){$('scope').hidden=false;$('scope').querySelector('p').textContent=[r.metrics_scope,r.limitation].filter(Boolean).join(' ')}comparisons=r.comparison_gallery||(r.stage_comparison?[{...r.stage_comparison,title:'Stage comparison'}]:[]);if(comparisons.length)showComparison(Math.min(comparisonIndex,comparisons.length-1));if(r.preview_evaluation_status?.status==='error')$('error').textContent='Early chart unavailable: '+r.preview_evaluation_status.message;if(r.evaluation_status?.status==='partial')$('error').textContent='Some evaluation artifacts could not be computed. See evaluation-status.json in the run outputs.';const refs=r.reference_images||[];if(refs.length){$('references').hidden=false;$('referenceCounts').textContent=`${refs.length}${g.reference_count!=null&&g.reference_count!==refs.length?' / '+g.reference_count:''} reference images · Open an image for full resolution`;$('referenceGallery').innerHTML=refs.map(f=>`<a class="tile" href="${esc(f.url)}" target="_blank" rel="noopener" aria-label="Open reference ${esc(f.name)}"><img loading="lazy" decoding="async" src="${esc(f.url)}" alt="Reference ${esc(f.name)}"><span>${esc(f.name)}</span></a>`).join('')}$('galleryTitle').textContent=g.verified_inputs?g.stage:'ArtiFixer · first-pass images';$('counts').textContent=`${frames.length}${g.expected_count!=null&&g.expected_count!==frames.length?' / '+g.expected_count:''} generated images`+(g.reference_count!=null?` · ${g.reference_count} reference anchors`:'')+(!g.verified_inputs&&frames.length?' · Input provenance unavailable':'');$('gallery').innerHTML=frames.map((f,i)=>`<button class="tile" aria-label="Open inferred frame ${f.index}" aria-pressed="false" data-i="${i}"><img loading="lazy" decoding="async" src="${esc(f.url)}" alt="Inferred frame ${f.index}"><span>Frame ${f.index}</span></button>`).join('')||'<div class="empty">Inference images will appear here after generation and transfer complete</div>';$('gallery').onclick=e=>{const b=e.target.closest('[data-i]');if(b)choose(Number(b.dataset.i),true)};if(frames.length)choose(Math.min(Math.max(selected,0),frames.length-1))}catch(e){$('error').textContent=e.message}}
refreshDetail();setInterval(()=>{if(!document.hidden&&!$('lightbox').open)refreshDetail()},15000);
</script></body></html>
